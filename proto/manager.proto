syntax = "proto3";

option go_package = "./;proto";

package asn_controller;

import "google/api/annotations.proto";

service Manager {
  // ASNC related operations
  rpc GetInfo     (Empty)         returns (ControllerInfo) {
    option (google.api.http) = {
      get: "/info"
    };
  }

  rpc UpdatePort  (UpdatePortReq) returns (Empty) {
    option (google.api.http) = {
      post: "/info/port"
      body: "*"
    };
  }

  // ---------------------------------------------------------------------------
  // 1 — Auth (Verification Codes, Login, MFA, Factors, Tokens, Logout)
  // ---------------------------------------------------------------------------

  // --- Auth Login/Logout ---

  // Lists supported login methods (password, phone+code, email+code, WeChat, Sign in with Apple).
  rpc AuthListLoginMethods (Empty) returns (Auth.LoginMethods) {
    option (google.api.http) = {
      get: "/auth/login/methods"
    };
  }

  // Lists allowed phone countries for SMS login/bind.
  rpc AuthListPhoneCountries (Empty) returns (Auth.CountryCodeList) {
    option (google.api.http) = {
      get: "/auth/phone/countries"
    };
  }

  // Sends a verification code (e.g., SMS) to a phone number.
  rpc AuthSendCodeToPhone (Auth.Phone) returns (Auth.Code) {
    option (google.api.http) = {
      post: "/auth/phone/sendCode"
      body: "*"
    };
  }

  // Sends a verification code to an email address.
  rpc AuthSendCodeToEmail (Auth.Email) returns (Auth.Code) {
    option (google.api.http) = {
      post: "/auth/email/sendCode"
      body: "*"
    };
  }

  // Login is a single stateful flow regardless of credential kind:
  //   AuthFlowInit -> (optional) AuthFlowGetChallenge -> AuthFlowVerify
  // and, when AuthFlowVerify returns FLOW_STATE_MFA_VERIFY / FLOW_STATE_MFA_SETUP,
  // continue via the Auth Flow MFA APIs below.

  // Step 1: choose a credential method, provide the matching identity, and open a
  // login flow. The returned state directs the client to AuthFlowGetChallenge
  // (FLOW_STATE_CHALLENGE_REQUIRED) or straight to AuthFlowVerify (FLOW_STATE_VERIFY_REQUIRED).
  rpc AuthFlowInit (Auth.FlowInitReq) returns (Auth.FlowInitRes) {
    option (google.api.http) = {
      post: "/auth/flow/init"
      body: "*"
    };
  }

  // Step 2 (FLOW_STATE_CHALLENGE_REQUIRED only): prepare the verify step — send an
  // OTP for phone/email code methods, or return a WebAuthn challenge for passkey.
  rpc AuthFlowGetChallenge (Auth.FlowGetChallengeReq) returns (Auth.FlowGetChallengeRes) {
    option (google.api.http) = {
      post: "/auth/flow/challenge"
      body: "*"
    };
  }

  // Step 3: submit the proof matching the flow's method and complete the login (or
  // advance to FLOW_STATE_MFA_VERIFY / FLOW_STATE_MFA_SETUP).
  rpc AuthFlowVerify (Auth.FlowVerifyReq) returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/verify"
      body: "*"
    };
  }

  // Re-enters the MFA flow from an MFA-unverified access token (when token
  // verification reports MFA is still required).
  rpc AuthFlowResume (Auth.FlowResumeReq) returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/resume"
      body: "*"
    };
  }

  // Refreshes the access/refresh token pair.
  rpc AuthRefreshToken (Auth.Tokens) returns (Auth.Tokens) {
    option (google.api.http) = {
      post: "/auth/token"
      body: "*"
    };
  }

  // Logs a user out from a single device or all devices.
  rpc AuthLogout (Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/logout"
      body: "*"
    };
  }

  // Returns the current authenticated user, resolved from the access token.
  rpc AuthGetCurrentUser (Empty) returns (User) {
    option (google.api.http) = {
      get: "/auth/user"
    };
  }

  // --- Auth Management ---

  // Password Flow: a single stateful flow covering both forgot-password recovery
  // and in-session password change.
  //   AuthPasswordFlowInit -> (OTP methods) AuthPasswordFlowSendCode
  //     -> AuthPasswordFlowVerify -> AuthPasswordFlowComplete
  // Step 1: identify the account and obtain a flow token + available methods.
  rpc AuthPasswordFlowInit (Auth.PasswordFlowInitReq) returns (Auth.PasswordFlowInitRes) {
    option (google.api.http) = {
      post: "/auth/password/flow/init"
      body: "*"
    };
  }

  // Step 2 (OTP methods only): send (or resend, rate-limited) the verification code
  // to the account's bound email/phone. Skip for the old-password method.
  rpc AuthPasswordFlowSendCode (Auth.PasswordFlowSendCodeReq) returns (Auth.PasswordFlowSendCodeRes) {
    option (google.api.http) = {
      post: "/auth/password/flow/sendCode"
      body: "*"
    };
  }

  // Step 3: submit the chosen proof (old password or OTP) to verify the flow token.
  rpc AuthPasswordFlowVerify (Auth.PasswordFlowVerifyReq) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/password/flow/verify"
      body: "*"
    };
  }

  // Step 4: set the new password for a verified flow token.
  rpc AuthPasswordFlowComplete (Auth.PasswordFlowCompleteReq) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/password/flow/complete"
      body: "*"
    };
  }

  // Admin-only: directly set another account's password (no proof of the old one).
  rpc AuthResetPassword (Auth.ResetPassword) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/password/reset"
      body: "*"
    };
  }

  // Enables MFA login for the current user.
  rpc AuthEnableUserMfa (Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/mfa/enable"
      body: "*"
    };
  }

  // Disables MFA login for the current user.
  rpc AuthDisableUserMfa (Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/mfa/disable"
      body: "*"
    };
  }

  // Generates provisioning materials to enroll a TOTP authenticator.
  rpc AuthGenerateTotpQrCode (Empty) returns (Auth.TotpQrCode) {
    option (google.api.http) = {
      get: "/auth/mfa/totp/qrcode"
    };
  }

  // Binds/enrolls a TOTP authenticator for a user (requires a valid TOTP code).
  rpc AuthBindTotp (Auth.BindTotp) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/mfa/totp/bind"
      body: "*"
    };
  }

  // Unbinds a TOTP authenticator from a user.
  rpc AuthUnbindTotp (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/mfa/totp/bind"
    };
  }

  // Binds an email factor (used for verification/MFA).
  rpc AuthBindEmail (Auth.BindEmail) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/email"
      body: "*"
    };
  }

  // Unbinds the email factor.
  rpc AuthUnbindEmail (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/email"
    };
  }

  // Binds a phone factor (used for verification/MFA).
  rpc AuthBindPhone (Auth.BindPhone) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/phone"
      body: "*"
    };
  }

  // Unbinds the phone factor.
  rpc AuthUnbindPhone (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/phone"
    };
  }

  // Binds a WeChat factor.
  rpc AuthBindWeChat (Auth.BindWeChat) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/wechat"
      body: "*"
    };
  }

  // Unbinds the WeChat factor.
  rpc AuthUnbindWeChat (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/wechat"
    };
  }

  // Binds an Apple ID factor.
  rpc AuthBindAppleId (Auth.BindApple) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/apple"
      body: "*"
    };
  }

  // Unbinds the Apple ID factor.
  rpc AuthUnbindAppleId (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/apple"
    };
  }

  // Binds a Google ID factor.
  rpc AuthBindGoogleId (Auth.BindGoogle) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/google"
      body: "*"
    };
  }

  // Unbinds the Google ID factor.
  rpc AuthUnbindGoogleId (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/google"
    };
  }

  // Returns a WebAuthn challenge for passkey enrollment.
  rpc AuthGetPasskeyBindChallenge (Auth.PasskeyDomain) returns (Auth.PasskeyChallenge) {
    option (google.api.http) = {
      post: "/auth/bind/passkey/challenge"
      body: "*"
    };
  }

  // Binds a passkey credential to the current user.
  rpc AuthBindPasskey (Auth.BindPasskey) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/passkey"
      body: "*"
    };
  }

  // Unbinds a specific passkey from the current user.
  rpc AuthUnbindPasskey (Auth.UnbindPasskey) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/passkey"
    };
  }

  // ---------------------------------------------------------------------------
  // 2 — Device
  // ---------------------------------------------------------------------------

  // Unbinds a device from a user.
  rpc DeviceUnbind (Device.UnbindReq) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/device"
    };
  }

  // Renames a device.
  rpc DeviceRename (Device.RenameReq) returns (Empty) {
    option (google.api.http) = {
      put: "/auth/device/name"
      body: "*"
    };
  }

  // Auth Flow APIs (stateful login flow with forced inline MFA setup/verify)
  rpc AuthFlowMfaSetupInitiate (Auth.FlowMfaSetupInitiateReq) returns (Auth.FlowMfaSetupInitiateRes) {
    option (google.api.http) = {
      post: "/auth/flow/mfa/setup/initiate"
      body: "*"
    };
  } // FLOW_STATE_MFA_SETUP step 1: initiate binding for chosen method

  rpc AuthFlowMfaSetupConfirm  (Auth.FlowMfaSetupConfirmReq)  returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/mfa/setup/confirm"
      body: "*"
    };
  } // FLOW_STATE_MFA_SETUP step 2: confirm binding and complete login

  rpc AuthFlowMfaVerify        (Auth.FlowMfaVerifyReq)        returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/mfa/verify"
      body: "*"
    };
  } // FLOW_STATE_MFA_VERIFY: submit factor and complete login

  // User API
  rpc GetUsersByIDs   (User.GetReq)         returns (User.List) {
    option (google.api.http) = {
      get: "/user"
    };
  } // User Info by name

  rpc ListUsers       (Node.Service.Names)  returns (User.ServiceUsers) {
    option (google.api.http) = {
      get: "/user/list"
    };
  }

  rpc CreateUser      (User.Create)         returns (Empty) {
    option (google.api.http) = {
      post: "/user"
      body: "*"
    };
  }

  rpc UpdateUser      (User.Update)         returns (Empty) {
    option (google.api.http) = {
      put: "/user"
      body: "*"
    };
  }

  rpc DeleteUser      (User.ID)             returns (Empty) {
    option (google.api.http) = {
      delete: "/user"
    };
  }

  // User Group API
  rpc GetUserGroups             (UserGroup.GetReq)    returns (UserGroup.List) {
    option (google.api.http) = {
      get: "/user/group"
    };
  } // User Group info by name

  rpc ListUserGroups            (Empty)               returns (UserGroup.Names) {
    option (google.api.http) = {
      get: "/user/group/list"
    };
  }

  rpc CreateUserGroup           (UserGroup.Create)    returns (Empty) {
    option (google.api.http) = {
      post: "/user/group"
      body: "*"
    };
  }

  rpc UpdateUserGroup           (UserGroup.Update)    returns (Empty) {
    option (google.api.http) = {
      put: "/user/group"
      body: "*"
    };
  }

  rpc DeleteUserGroup           (UserGroup.Name)      returns (Empty) {
    option (google.api.http) = {
      delete: "/user/group"
    };
  }

  rpc AddUsersToGroup           (UserGroup.UserReq)   returns (Empty) {
    option (google.api.http) = {
      post: "/user/group/users"
      body: "*"
    };
  }

  rpc RemoveUsersFromGroup      (UserGroup.UserReq)   returns (Empty) {
    option (google.api.http) = {
      put: "/user/group/users"
      body: "*"
    };
  }

  // Network API
  rpc ImportTopoFromFile        (NetworkTopo)     returns (Empty);              // Load topo networks through files

  rpc ExportTopoFile            (Network.Id)      returns (NetworkTopo);        // Export topo to files

  rpc ListAvailableNetworks     (Empty)           returns (Network.List) {
    option (google.api.http) = {
      get: "/network/available"
    };
  } // List the network that the user can view/manage. Just the basic topo info, without node

  rpc DisplayNetworks           (Network.GetReq)  returns (Network.Display) {
    option (google.api.http) = {
      get: "/network/display"
    };
  } // Get subnetworks, nodes and link need display.

  rpc GetNetworkTopo            (Empty)           returns (Network.TopoLists) {
    option (google.api.http) = {
      get: "/network/topo"
    };
  } // Get network topo that the user can view/manage

  rpc GetNetworkAvailableTiers  (Network.Id)      returns (Network.Tiers) {
    option (google.api.http) = {
      get: "/network/tier"
    };
  }

  rpc CreateNetwork             (Network.Create)  returns (Empty) {
    option (google.api.http) = {
      post: "/network"
      body: "*"
    };
  }

  rpc UpdateNetwork             (Network.Update)  returns (Empty) {
    option (google.api.http) = {
      put: "/network"
      body: "*"
    };
  }

  rpc DeleteNetwork             (Network.Id)      returns (Empty) {
    option (google.api.http) = {
      delete: "/network"
    };
  }

  // Nodes API
  rpc GetNodesByIds                (Node.GetReq)                        returns (Node.List) {
    option (google.api.http) = {
      get: "/node"
    };
  }    // Node details.
  rpc GetNodesOfNetwork            (Node.ListReq)                       returns (Node.Infos) {
    option (google.api.http) = {
      get: "/node/network"
    };
  }   // All nodes in the network and its subnetworks.
  rpc GetNodesOfNodeGroup          (NodeGroup.Id)                       returns (Node.Infos) {
    option (google.api.http) = {
      get: "/node/group/nodes"
    };
  }   // Nodes in the given Node Group.
  rpc GetNodesWithoutNodeGroup     (Node.ListReq)                       returns (Node.Infos) {
    option (google.api.http) = {
      get: "/node/service"
    };
  }   // All nodes in the network without node group.
  rpc SetNodeServiceConfig         (Node.SetConfig)                     returns (Empty) {
    option (google.api.http) = {
      put: "/node/config"
      body: "*"
    };
  }
  rpc CreateNode                   (Node.Create)                        returns (Enrollment.NodeIdentity) {
    option (google.api.http) = {
      post: "/node"
      body: "*"
    };
  } // Create a node and return its identity (node_id, enrollment_state). Topo and
    // enrollment share this one call; service_names is the install set.
  rpc UpdateNode                   (Node.Update)                        returns (Empty) {
    option (google.api.http) = {
      put: "/node"
      body: "*"
    };
  }
  rpc DeleteNode                   (Node.Id)                            returns (Empty) {
    option (google.api.http) = {
      delete: "/node"
    };
  }
  rpc AddNodeConfigOps             (Node.SetConfigOp)                   returns (Ops.Responses) {
    option (google.api.http) = {
      post: "/node/config_op"
      body: "*"
    };
  }
  rpc UpdateNodeConfigOp           (Node.SetConfigOp)                   returns (Ops.Responses) {
    option (google.api.http) = {
      put: "/node/config_op"
      body: "*"
    };
  }
  rpc RemoveNodeConfigOps          (Node.SetConfigOp)                   returns (Ops.Responses) {
    option (google.api.http) = {
      delete: "/node/config_op"
    };
  }
  rpc AddNodeInterface             (Node.NodeInfo.OperateInterface)     returns (Empty) {
    option (google.api.http) = {
      post: "/node/interface"
      body: "*"
    };
  }
  rpc UpdateNodeInterface          (Node.NodeInfo.OperateInterface)     returns (Empty) {
    option (google.api.http) = {
      put: "/node/interface"
      body: "*"
    };
  }
  rpc RemoveNodeInterface          (Node.NodeInfo.OperateInterface)     returns (Empty) {
    option (google.api.http) = {
      delete: "/node/interface"
    };
  }

  // Node Enrollment API (ASN entry point).
  // Node creation is the unified CreateNode RPC above (returns NodeIdentity);
  // these operate on an existing node_id.
  rpc MintEnrollmentToken          (Enrollment.MintTokenReq)            returns (Enrollment.Token) {
    option (google.api.http) = {
      post: "/enrollment/token"
      body: "*"
    };
  } // Mint a single-use enrollment token for an existing node.
  rpc FetchBootstrapScript         (Enrollment.ScriptReq)               returns (Enrollment.Script) {
    option (google.api.http) = {
      post: "/enrollment/script"
      body: "*"
    };
  } // Validate+consume token, lazy mint/sign, render full install script.
  rpc UnbindNode                   (Enrollment.UnbindReq)               returns (Enrollment.NodeIdentity) {
    option (google.api.http) = {
      post: "/enrollment/unbind"
      body: "*"
    };
  } // Revoke cert + cancel token; reopen the node for enrollment.
  rpc GetEnrollmentStatus          (Enrollment.StatusReq)               returns (Enrollment.Status) {
    option (google.api.http) = {
      get: "/enrollment/status"
    };
  } // Read enrollment + runtime state for a node or token.
  rpc ListEnrollmentTokens         (Enrollment.ListReq)                 returns (Enrollment.TokenList) {
    option (google.api.http) = {
      get: "/enrollment/tokens"
    };
  } // List enrollment tokens by network / node.
  rpc RevokeEnrollmentToken        (Enrollment.TokenId)                 returns (Empty) {
    option (google.api.http) = {
      delete: "/enrollment/token"
    };
  } // Revoke a single outstanding token by id.

  // Node Group API
  rpc GetNodeGroupsByIds          (NodeGroup.Ids)             returns (NodeGroup.List) {
    option (google.api.http) = {
      get: "/node/group"
    };
  } // Node Group info
  rpc ListNodeGroups              (NodeGroup.ListReq)         returns (NodeGroup.Ids) {
    option (google.api.http) = {
      get: "/node/group/list"
    };
  }  // List Node Group IDs.
  rpc CreateNodeGroup             (NodeGroup.Create)          returns (Empty) {
    option (google.api.http) = {
      post: "/node/group"
      body: "*"
    };
  }
  rpc UpdateNodeGroup             (NodeGroup.Update)          returns (Empty) {
    option (google.api.http) = {
      put: "/node/group"
      body: "*"
    };
  }
  rpc DeleteNodeGroup             (NodeGroup.Id)              returns (Empty) {
    option (google.api.http) = {
      delete: "/node/group"
    };
  }
  rpc AddNodeGroupConfigOps       (NodeGroup.SetConfigOp)     returns (Ops.Responses) {
    option (google.api.http) = {
      post: "/node/group/config_op"
      body: "*"
    };
  }
  rpc UpdateNodeGroupConfigOp     (NodeGroup.SetConfigOp)     returns (Ops.Responses) {
    option (google.api.http) = {
      put: "/node/group/config_op"
      body: "*"
    };
  }
  rpc RemoveNodeGroupConfigOps    (NodeGroup.SetConfigOp)     returns (Ops.Responses) {
    option (google.api.http) = {
      delete: "/node/group/config_op"
    };
  }

  // Link API
  rpc GetLinksOfNode    (Node.Id)      returns (Link.List) {
    option (google.api.http) = {
      get: "/link/node"
    };
  } // All links of a network. Internal and External.
  rpc CreateLink        (Link.Create)  returns (Empty) {
    option (google.api.http) = {
      post: "/link"
      body: "*"
    };
  }
  rpc UpdateLink        (Link.Update)  returns (Empty) {
    option (google.api.http) = {
      put: "/link"
      body: "*"
    };
  }
  rpc DeleteLink        (Link.Id)      returns (Empty) {
    option (google.api.http) = {
      delete: "/link"
    };
  }

  // Service API: Info or Name? ???
  rpc GetAllServices          (IncludeAsn)    returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service"
    };
  }  // All available service names.
  rpc GetServicesOfNetwork    (Network.Id)    returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service/network"
    };
  }       // Services available in the network.
  rpc GetServicesOfNodeGroup  (NodeGroup.Id)  returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service/group"
    };
  }       // Services available in the node group.
  rpc GetServicesOfNode       (Node.Id)       returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service/node"
    };
  }       // Services available on the node.

  // Service API: Start
  rpc StartServiceOnNetwork   (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/start/network"
      body: "*"
    };
  }
  rpc StartServiceOnNodeGroup (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/start/node/group"
      body: "*"
    };
  }
  rpc StartServiceOnNode      (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/start/node"
      body: "*"
    };
  }

  // Service API: Stop
  rpc StopServiceOnNetwork    (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/stop/network"
      body: "*"
    };
  }
  rpc StopServiceOnNodeGroup  (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/stop/node/group"
      body: "*"
    };
  }
  rpc StopServiceOnNode       (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/stop/node"
      body: "*"
    };
  }

  // Service API: Reset
  rpc ResetServiceOnNetwork   (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/reset/network"
      body: "*"
    };
  }
  rpc ResetServiceOnNodeGroup (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/reset/node/group"
      body: "*"
    };
  }
  rpc ResetServiceOnNode      (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/reset/node"
      body: "*"
    };
  }

  // Service API: Apply Ops (Internal Use)
  rpc ApplyServiceOpsOnNetwork    (Ops.Request) returns (Ops.Responses);
  rpc ApplyServiceOpsOnNodeGroup  (Ops.Request) returns (Ops.Responses);
  rpc ApplyServiceOpsOnNode       (Ops.Request) returns (Ops.Responses);

  // Stats
  rpc GetStatsOfNetwork   (Network.Id)                returns (Network.Stats) {
    option (google.api.http) = {
      get: "/network/stats"
    };
  }      // Numbers of networks, nodes, links, node groups, etc., of a Network.
  rpc GetStatsOfNodes     (Network.Id)                returns (Node.Stats) {
    option (google.api.http) = {
      get: "/network/stats/node"
    };
  }         // Numbers of nodes in different states in a network.
  rpc GetStatsOfServices  (Node.Service.Stats.GetReq) returns (Node.Service.Stats) {
    option (google.api.http) = {
      get: "/network/stats/service"
    };
  } // Numbers of service nodes in different states of a network. For specified services.

  // Service Metrics
  rpc GetMetricsOfService (Node.Service.Metrics.GetReq) returns (Node.Service.Metrics) {
    option (google.api.http) = {
      get: "/service/metric"
    };
  } // Metrics in key-value pairs.
}

/*
 * Common
 */
message Empty {}

/*
 * Node Enrollment (ASN entry point)
 *
 * Node creation is the unified Manager CreateNode (Node.Create -> NodeIdentity);
 * these messages drive the rest of the flow on an existing node_id. Install specs
 * come from asn.conf; the rendered script always installs asnsn + the node's
 * service debs. enrollment_state / node_state reuse the Node enums. Ownership /
 * trust tier are deferred (added later as new fields). See
 * workflow/design/NodeEnrollment.md.
 */
message Enrollment {
  // NodeIdentity is returned by CreateNode and UnbindNode.
  message NodeIdentity {
    string node_id = 1;
    repeated string service_names = 2;
    Node.EnrollmentState enrollment_state = 3;
  }

  // MintEnrollmentToken: single-use script-fetch token for an EXISTING node.
  // Allowed only when the node is ENROLLMENT_UNBOUND; non-reentrant; supersedes a
  // prior unused token. To re-enroll a bound node, call UnbindNode first.
  message MintTokenReq {
    string node_id = 1; // existing node; required
    int64 ttl_seconds = 2;
    string label = 3;
  }

  // UnbindNode: revoke the node's current certificate + cancel any outstanding
  // token, returning it to ENROLLMENT_UNBOUND. Does NOT delete the node
  // (identity / eligibility / config preserved).
  message UnbindReq {
    string node_id = 1; // required
    string reason = 2; // audit reason (e.g. "machine swap")
  }

  message Token {
    string token = 1; // single-use script-fetch credential
    string token_id = 2;
    string node_id = 3; // the bound node
    int64 expires_at = 4;
  }

  // FetchBootstrapScript: token is the credential; lazy mint/sign for the token's
  // EXISTING node. Renders the FULL install for the node's service_names (no
  // service named). Shares one server-side path with the service-API render.
  message ScriptReq {
    string token = 1;
  }

  message Script {
    bytes content = 1; // rendered bootstrap script (ASN core)
    string content_type = 2; // e.g. "text/x-shellscript"
    string node_id = 3; // the existing node this script enrolls / re-keys
    int64 cert_not_after = 4; // lazily signed cert validity
  }

  message StatusReq { string node_id = 1; string token_id = 2; }
  message Status {
    string node_id = 1;
    string token_id = 2;
    Node.EnrollmentState enrollment_state = 3;
    int64 last_event_at = 4;
    Node.NodeState node_state = 5; // runtime connectivity
  }

  message ListReq   { string network_id = 1; string node_id = 2; }
  message TokenList { repeated Token tokens = 1; }
  message TokenId   { string token_id = 1; }
}

message Location {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;
  string address = 4;
  string description = 5;
  string location_tier = 6;
}

message IncludeAsn {
  bool include_asn = 1;
}

// -----------------------------------------------------------------------------
// 2 — Auth
// -----------------------------------------------------------------------------

message Auth {
  enum MfaMethod {
    MFA_METHOD_UNSPECIFIED = 0;
    MFA_METHOD_TOTP        = 1; // time-based one-time password (authenticator app)
    MFA_METHOD_EMAIL       = 2; // email verification code
    MFA_METHOD_SMS         = 3; // SMS verification code
  }

  // CredentialMethod is the identity + proof kind chosen when starting a login flow.
  enum CredentialMethod {
    CREDENTIAL_METHOD_UNSPECIFIED       = 0;
    CREDENTIAL_METHOD_USERNAME_PASSWORD = 1; // identity: username, proof: password
    CREDENTIAL_METHOD_PHONE_PASSWORD    = 2; // identity: phone,    proof: password
    CREDENTIAL_METHOD_EMAIL_PASSWORD    = 3; // identity: email,    proof: password
    CREDENTIAL_METHOD_PHONE_CODE        = 4; // identity: phone,    proof: OTP
    CREDENTIAL_METHOD_EMAIL_CODE        = 5; // identity: email,    proof: OTP
    CREDENTIAL_METHOD_WECHAT            = 6; // WeChat OAuth
    CREDENTIAL_METHOD_APPLE             = 7; // Sign in with Apple
    CREDENTIAL_METHOD_GOOGLE            = 8; // Sign in with Google
    CREDENTIAL_METHOD_PASSKEY           = 9; // WebAuthn passkey
  }

  // PasswordVerifyMethod is the proof a user supplies during the password flow.
  enum PasswordVerifyMethod {
    PASSWORD_VERIFY_METHOD_UNSPECIFIED  = 0;
    PASSWORD_VERIFY_METHOD_OLD_PASSWORD = 1; // prove possession of the current password
    PASSWORD_VERIFY_METHOD_EMAIL        = 2; // OTP sent to the bound email
    PASSWORD_VERIFY_METHOD_SMS          = 3; // OTP sent to the bound phone
  }

  // PasswordFlowInitState is the outcome of AuthPasswordFlowInit.
  enum PasswordFlowInitState {
    PASSWORD_FLOW_INIT_STATE_UNSPECIFIED     = 0;
    PASSWORD_FLOW_INIT_STATE_METHOD_REQUIRED = 1; // flow_token and methods are valid; pick a method
    PASSWORD_FLOW_INIT_STATE_NO_RECOVERY     = 2; // account not found OR no usable verification method
  }

  // Phone number (country code and local number).
  message Phone {
    string country_code = 1;
    string number = 2;
    bool send_only_when_exists = 3; // if true, send the code only if the phone is already registered
  }

  // RFC 5321/5322 email address.
  message Email {
    string email = 1;
    bool send_only_when_exists = 2; // if true, send the code only if the email is already registered
  }

  // Verification code response.
  message Code {
    int64 result = 1;  // result code (0 = success)
    string code = 2;   // verification code (may be empty when sent out-of-band)
    int64 next = 3;    // earliest UNIX second at which the next code can be requested
  }

  // The login methods enabled at runtime.
  message LoginMethods {
    repeated CredentialMethod methods = 1;
  }

  // Admin-only: directly set another account's password.
  message ResetPassword {
    string account_id = 1;
    string password = 2;
  }

  message PasskeyDomain {
    string domain = 1;
    string account_id = 2;
  }

  message PasskeyChallenge {
    string session_id = 1;
    string data = 2; // JSON-encoded WebAuthn challenge options
  }

  // MfaMethodInfo is one MFA option offered to the client during a login flow.
  // masked_target is a masked rendering of the delivery channel for SMS/Email
  // (empty for TOTP/Passkey); country_code is set only for SMS.
  message MfaMethodInfo {
    MfaMethod method        = 1;
    string    masked_target = 2;
    string    country_code  = 3;
  }

  // Country info for phone login area selector.
  message CountryCodeList {
    string type = 1;           // category/region type of the list
    repeated string codes = 2; // phone country codes, e.g., "+86"
  }

  message TokenSet {
    string access_token = 1;
    string refresh_token = 2;
  }

  // FlowState tells the client exactly what to do next after a login attempt.
  enum FlowState {
    FLOW_STATE_UNSPECIFIED = 0;
    FLOW_STATE_AUTHENTICATED = 1;     // login complete; token_set is valid
    FLOW_STATE_MFA_VERIFY    = 2;     // credentials OK; must verify an existing MFA factor
    FLOW_STATE_MFA_SETUP     = 3;     // credentials OK; service requires MFA but none bound yet
    FLOW_STATE_CHALLENGE_REQUIRED = 4; // call AuthFlowGetChallenge (send OTP / get passkey challenge), then AuthFlowVerify
    FLOW_STATE_VERIFY_REQUIRED    = 5; // call AuthFlowVerify with the proof
  }

  // Result returned by login endpoints.
  message LoginResult {
    User   account   = 1;
    FlowState state     = 2;

    // FLOW_STATE_AUTHENTICATED only: final usable token pair
    TokenSet token_set = 3;

    // FLOW_STATE_MFA_VERIFY / FLOW_STATE_MFA_SETUP:
    // short-lived credential that must be passed to AuthFlowMfaVerify or AuthFlowMfaSetup
    string flow_token = 4;

    // FLOW_STATE_MFA_VERIFY: methods the account already has bound; client shows a picker
    repeated MfaMethodInfo available_mfa_methods = 5;

    // FLOW_STATE_MFA_SETUP: methods the account can bind right now
    //   - SMS    available when account has a phone number
    //   - EMAIL  available when account has an email address
    //   - TOTP   always available
    //   - PASSKEY always available
    repeated MfaMethod available_setup_methods = 6;
  }

  // Access/refresh token pair.
  message Tokens {
    string access_token = 1;
    string refresh_token = 2;
  }

  // Bind (enroll) TOTP for a user.
  message BindTotp {
    string code = 1; // current TOTP code for proof-of-possession
  }

  // Bind email as an authentication factor.
  message BindEmail {
    string email = 1;
    string code = 2; // verification code sent to the email
  }

  // Bind phone as an authentication factor.
  message BindPhone {
    Phone phone = 1;
    string code = 2; // verification code sent to the phone
  }

  // Bind WeChat as an authentication factor.
  message BindWeChat {
    string app_id = 1;
    string code = 2;
  }

  // Bind Apple ID as an authentication factor.
  message BindApple {
    string id_token = 1;
  }

  // Bind Google ID as an authentication factor.
  message BindGoogle {
    string id_token = 1;
  }

  message BindPasskey {
    string domain = 1;
    string session_id = 2;
    string data = 3; // JSON-encoded WebAuthn registration response
  }

  message UnbindPasskey {
    string account_id = 1;
    string passkey_id = 2;
  }

  // Result payload for TOTP provisioning.
  message TotpQrCode {
    string qr_png = 1;         // QR image in PNG bytes
    string auth_uri = 2;      // otpauth:// URI for direct import into authenticator apps
    string secret = 3;        // TOTP secret (sensitive; short-lived; do not log)
    string issuer = 4;        // issuer label shown in authenticator apps
    string display_name = 5;  // account name shown in authenticator apps
  }

  // Step 1 of inline MFA setup: choose a method and get the binding material.
  // The chosen method (and, for SMS/Email, the target being bound) is recorded on
  // the flow; AuthFlowMfaSetupConfirm resolves it from the flow token.
  message FlowMfaSetupInitiateReq {
    string    flow_token   = 1;
    MfaMethod method       = 2;
    Phone     phone        = 3;  // SMS only: number to bind and send the OTP to
    string    email        = 4;  // EMAIL only: address to bind and send the OTP to
  }

  // Response to FlowMfaSetupInitiateReq; fields are populated based on method.
  message FlowMfaSetupInitiateRes {
    // TOTP: display this QR code in the authenticator app
    string totp_image  = 1;
    string totp_issuer = 2;
    string totp_secret = 3;

    // SMS / EMAIL: OTP delivery outcome for the bound target
    int64  result = 4; // CodeSendResult
    int64  next   = 5; // cooldown in seconds before another code can be requested
    string code   = 6; // dev-mode OTP only
  }

  // Step 2 of inline MFA setup: confirm binding with the received code or credential.
  // The method, and for SMS/Email the target, were captured by FlowMfaSetupInitiateReq
  // and are resolved from the flow; re-initiate to switch method/target.
  message FlowMfaSetupConfirmReq {
    string flow_token = 1;
    string code       = 2;  // TOTP first code / SMS OTP / Email OTP
  }

  // Input for AuthFlowMfaVerify: submit the MFA factor for an account that already has one bound.
  // The method, and for passkey the session id / RP domain, were captured by
  // AuthFlowGetChallenge and are resolved from the flow; call AuthFlowGetChallenge first
  // (also for TOTP) and re-call it to switch method before verifying.
  message FlowMfaVerifyReq {
    string flow_token = 1;
    string code       = 2;  // TOTP / SMS / Email OTP
  }

  // --- Unified login flow ---

  // Step 1 input: choose a credential method and provide the matching identity.
  // Fill the identity for the method's identity kind: username for *_USERNAME_*,
  // phone for *_PHONE_*, email for *_EMAIL_*. Third-party (WeChat/Apple/Google)
  // and Passkey methods leave all identity fields empty.
  message FlowInitReq {
    Device.Info      device_info        = 1;
    CredentialMethod method             = 2;
    bool             create_if_not_exist = 3; // create the account on first successful credential validation

    string username = 4;
    Phone  phone    = 5;
    string email    = 6;
  }

  // Step 1 output: either FLOW_STATE_CHALLENGE_REQUIRED or FLOW_STATE_VERIFY_REQUIRED.
  message FlowInitRes {
    FlowState state      = 1;
    string    flow_token = 2;
  }

  // Step 2 input (FLOW_STATE_CHALLENGE_REQUIRED): prepare the verify step.
  message FlowGetChallengeReq {
    string    flow_token = 1;
    MfaMethod mfa_method = 2; // MFA phase only; ignored in the credential phase
    string    domain     = 3; // passkey only: relying-party domain
  }

  // Step 2 output: OTP send result and/or a passkey challenge. For passkey the
  // session is recorded on the flow and resolved by AuthFlowVerify.
  message FlowGetChallengeRes {
    int64  result = 1; // CodeSendResult (OTP methods)
    int64  next   = 2; // cooldown in seconds before another code can be requested
    string code   = 3; // dev-mode OTP only
    string data   = 4; // passkey only: JSON-encoded WebAuthn challenge options
  }

  // Step 3 input: submit the proof matching the flow's method (fill only the
  // relevant fields). password for *_PASSWORD; code for *_CODE; wechat_* for WeChat;
  // apple_id_token/google_id_token for Apple/Google; data for the passkey assertion
  // (the session and RP domain were captured by AuthFlowGetChallenge).
  message FlowVerifyReq {
    string flow_token = 1;

    string password = 2;
    string code     = 3;

    string wechat_app_id  = 4;
    string wechat_code    = 5;
    string apple_id_token = 6;
    string google_id_token = 7;

    string data = 8;
  }

  // Re-enter the MFA flow from an MFA-unverified access token.
  message FlowResumeReq {
    string access_token = 1;
  }

  // --- Password flow ---

  // Step 1 input: identify the account by exactly one of the identity fields.
  message PasswordFlowInitReq {
    string account_id   = 1;
    string username     = 2;
    string email        = 3;
    string country_code = 4;
    string number       = 5;
  }

  // Step 1 output: the available verification methods for the resolved account.
  message PasswordFlowInitRes {
    PasswordFlowInitState state      = 1;
    string                flow_token = 2;
    repeated PasswordFlowMethod methods = 3;
  }

  // One verification option offered after init. masked_target is empty for the
  // old-password method; country_code is set only for SMS.
  message PasswordFlowMethod {
    PasswordVerifyMethod method        = 1;
    string               masked_target = 2;
    string               country_code  = 3;
  }

  // Step 2 input (OTP methods only): send (or resend) the code to the bound target.
  message PasswordFlowSendCodeReq {
    string               flow_token = 1;
    PasswordVerifyMethod method     = 2; // PASSWORD_VERIFY_METHOD_EMAIL or _SMS
  }

  message PasswordFlowSendCodeRes {
    int64  result = 1; // CodeSendResult
    int64  next   = 2; // cooldown in seconds before another code can be requested
    string code   = 3; // dev-mode OTP only
  }

  // Step 3 input: submit the chosen proof (old password or OTP). The method is
  // resolved from the flow: a non-empty old_password means the old-password method,
  // otherwise the OTP method chosen by the last AuthPasswordFlowSendCode.
  message PasswordFlowVerifyReq {
    string flow_token   = 1;
    string code         = 2; // OTP methods
    string old_password = 3; // old-password method
  }

  // Step 4 input: set the new password for a verified flow token.
  message PasswordFlowCompleteReq {
    string flow_token   = 1;
    string new_password = 2;
  }
}

// -----------------------------------------------------------------------------
// 3 — Device
// -----------------------------------------------------------------------------

message Device {
  // Device details captured during login/binding.
  message Info {
    string id = 1;
    int64 category = 2;
    int64 type = 3;
    string os = 4;
    int64 language = 5;
    string name = 6;
    string model = 7;
    string serial_number = 8;
    string version = 9;
    bool Connected = 10; // non-standard proto casing; preserved for wire compatibility
    bool Current = 11;   // non-standard proto casing; preserved for wire compatibility

    int64 sent = 12;     // bytes sent by this device
    int64 received = 13; // bytes received by this device
  }

  // Device list returned for a user.
  message List {
    repeated Info device_infos = 1;
  }

  // Unbind a device from a user.
  message UnbindReq {
    string account_id = 1;
    string device_id = 2;
  }

  // Rename a device.
  message RenameReq {
    string account_id = 1;
    string device_id = 2;
    string device_name = 3;
  }
}

/*
 * Info
 */
message ControllerInfo {
  string asnc_version = 1;
  map<string, string> service_versions = 2;
  uint32 port = 3;
  uint32 port_pending = 4;
}

message UpdatePortReq {
  uint32 port = 1;
}

/*
 * User and User Group
 */
message User {
  string id = 1;
  string username = 2;
  string email = 3;
  Phone phone = 4;
  UserGroup.Names groups = 5;
  repeated UserGroup.Access accesses = 6;

  message ID {
    string id = 1;
  }

  message IDs {
    repeated string ids = 1;
  }

  message GetReq {
    string service = 1;
    repeated string ids = 2;
  }

  message ServiceUsers {
    map<string, Users> users = 1;

    message Users {
      repeated User users = 1;

      message User {
        string id = 1;
        string username = 2;
      }
    }
  }

  message Create {
    string username = 1;
    string password = 2;
    string email = 3;
    Phone phone = 4;
  }

  message Update {
    string id = 1;
    string email = 2;
    Phone phone = 3;
  }

  message ListReq {
    bool asn_only = 1;
  }

  message List {
    repeated User users = 1;
  }

  message Array {
    repeated string values = 1;
  }

  message Phone {
    string country_code = 1;
    string number = 2;
  }
}

message UserGroup {
  string name = 1;
  int64 user_total = 2;
  repeated string account_ids = 3;
  bool default = 4;
  Type type = 5;
  string remark = 6;
  repeated Access accesses = 7;

  message Name {
    string user_group_name = 1;
  }

  message Names {
    message GroupNames {
      repeated string names = 1;
    }
    map<string, GroupNames> groups = 1;
  }

  message Access {
    string service = 1;
    repeated string networks = 2;
    repeated string operations = 3;
  }

  message GetReq {
    repeated string user_group_names = 1;
  }

  message List {
    repeated UserGroup groups = 1;
  }

  message Create {
    string name = 1;
    string remark = 2;
    repeated Access accesses = 4;
  }

  message Update {
    string name = 1;
    string remark = 2;
    repeated Access accesses = 3;
  }

  message UserReq {
    string user_group_name = 1;
    repeated string account_ids = 2;
  }

  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_SERVICE = 1;
    TYPE_NETWORK = 2;
  }
}

/*
 * Network Topology: Network, Node, Location, etc.
 */
message NetworkTopo {
  bytes raw_data = 1;
}

message Network {
  string network_id = 1;
  string name = 2;
  string description = 3;
  string parent_network_id = 4;
  repeated string network_tiers = 5;
  Location location = 6;
  repeated Network subnets = 7;
  repeated Node.Info nodes = 8;

  message List {
    message Topo {
      string network_id = 1;
      string name = 2;
      repeated Topo subnets = 3;
    }

    repeated Topo networks = 1;
  }

  message TopoLists {
    repeated Network networks = 1;
  }

  message GetReq {
    string network_id = 1;
    string location_tier = 2;
  }

  message Display {
    message Info {
      string network_id = 1;
      string name = 2;
      string description = 3;
      string parent_network_id = 4;
      repeated string network_tiers = 5;
      Location location = 6;
      repeated Node.Display nodes = 7;
    }

    repeated Info networks = 1;
    repeated Node.Display nodes = 2;
    repeated Link links = 3;
    repeated string location_tiers = 4;
  }

  message Id {
    string network_id = 1;
  }

  message Create {
    string parent_network_id = 1;
    string name = 2;
    string description = 3;
    repeated string network_tiers = 4;
    Location location = 5;
  }

  message Update {
    string network_id = 1;
    string name = 3;
    string description = 4;
    repeated string network_tiers = 5;
    Location location = 6;
  }

  message Stats {
    int64 number_of_nodes = 1;
    int64 number_of_links = 2;
    int64 number_of_node_groups = 3;
  }

  message Tiers {
    repeated string network_tiers = 1;
    repeated string location_tiers = 2;
  }
}

message Node {
  string node_id = 1;
  Type type = 2;
  string name = 3;
  string description = 4;
  string network_id = 5;
  Location location = 6;
  bool managed = 7;
  NodeInfo topo_info = 8;
  ServiceNode service_node = 10;

  // Enrollment credential-lifecycle axis, orthogonal to the runtime NodeState
  // carried on service_node. Projection of credential facts; see
  // workflow/design/NodeEnrollment.md. Ownership / trust tier are deferred and,
  // when added, take new field numbers (append-only).
  EnrollmentState enrollment_state = 9;

  message GetReq {
    repeated string node_ids = 1;
    bool include_links = 2;
  }

  message ListReq {
    string network_id = 1;
    bool include_subnetwork = 2;
    string service = 3;
  }

  message List {
    repeated Node nodes = 1;
    repeated Link links = 2;
    repeated GroupConfig group_configs = 3;

    message GroupConfig {
      string node_group_id = 1;
      string config = 2;
    }
  }

  message Id {
    string node_id = 1;
  }

  message Infos {
    repeated Info nodes = 1;
  }

  message Info {
    string node_id = 1;
    Type type = 2;
    string name = 3;
    NodeState state = 4;
    string message = 5;
    map<string, string> meta = 6;
  }

  message Display {
    string node_id = 1;
    Type type = 2;
    string name = 3;
    Location location = 4;
    ServiceNode service_node = 5;
  }

  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_ROUTER = 1;        // router
    TYPE_SWITCH = 2;        // switch
    TYPE_APPLIANCE = 3;     // appliance
    TYPE_FIREWALL = 4;      // firewall
    TYPE_LOAD_BALANCER = 5; // lb
    TYPE_ACCESS_POINT = 6;  // ap
    TYPE_DEVICE = 7;        // device
    TYPE_SERVER = 8;        // server
  }

  message Create {
    string parent_network_id = 1;
    Type type = 2;
    string name = 3;
    string description = 4;
    bool managed = 5;
    Location location = 6;
    NodeInfo info = 7;
    // service eligibility = enrollment install set. Topo callers may leave empty;
    // enrollment callers list the services to install. type/info may be empty for
    // enrollment nodes (hardware is learned at registration).
    repeated string service_names = 8;
  }

  message Update {
    string node_id = 1;
    Type type = 3;
    string name = 4;
    string description = 5;
    bool managed = 6;
    Location location = 7;
    NodeInfo info = 8;
  }

  message SetConfig {
    string node_id = 1;
    string service_name = 2;
    string config = 3;
  }

  message SetConfigOp {
    string node_id = 1;
    string service_name = 2;
    string op_id = 3;
    repeated string op_params = 4;
  }

  message NodeInfo {
    repeated Interface interfaces = 1;
    Ipmi ipmi = 2;
    Management management = 3;
    Info info = 4;
    Param param = 5;

    message Ipmi {
      bool verify = 1;
      string ip = 2;
      string username = 3;
      string key = 4;
    }

    message Management {
      bool verify = 1;
      string hostname = 2;
      string ip = 3;
    }

    message Info {
      bool verify = 1;
      string vendor = 2;
      string model = 3;
      string serial_number = 4;
    }

    message Param {
      int64 cpu = 1;
      int64 memory = 2;
      int64 disk = 3;
    }

    message Interface {
      string name = 1;
      string ip = 2;
      repeated string tags = 3;
    }

    message OperateInterface {
      string node_id = 1;
      string name = 2;
      Interface interface = 3;
    }
  }

  message Stats {
    message Stat {
      NodeState state = 1;
      int64 count = 2;
    }

    message Type {
      string type = 1;
      int64 count = 2;
    }

    repeated Stat states = 1;
    repeated Type types = 2;
  }

  enum NodeState {
    STATE_UNREGISTERED = 0;
    STATE_OFFLINE = 1;
    STATE_ONLINE = 2;
    STATE_MAINTENANCE = 3;
  }

  enum ServiceState {
    STATE_UNAVAILABLE = 0;
    STATE_UNINITIALIZED = 1;
    STATE_INITIALIZED = 2;
    STATE_CONFIGURING = 3;
    STATE_RUNNING = 4;
    STATE_MALFUNCTIONING = 5;
  }

  // Credential-lifecycle axis (orthogonal to NodeState above). Mirrors
  // commonapi.EnrollmentState. See workflow/design/NodeEnrollment.md.
  enum EnrollmentState {
    ENROLLMENT_UNBOUND = 0;       // no token/cert: open for (re-)enrollment; also the post-unbind state
    ENROLLMENT_TOKEN_ISSUED = 1;  // a single-use enrollment token is outstanding
    ENROLLMENT_CERT_ISSUED = 2;   // certificate lazily signed; awaiting first registration
    ENROLLMENT_BOUND = 3;         // registered and holding its valid certificate
  }

  message ServiceNode {
    NodeState state = 1;
    string message = 2;
    NodeInfo register_info = 3;
    repeated Service services = 4;

    message Service {
      string name = 1;
      ServiceState state = 2;
      string message = 3;
      bool customize_config = 4;
      string config = 5;
      string node_group_id = 6;
      repeated Node.Service.ConfigOp config_ops= 7;
      string meta = 8;
    }
  }

  message Service {
    message Name {
      string service_name = 1;
    }

    message Names {
      repeated string service_names = 1;
    }

    message Stats {
      map<string, Inner> stats = 1;

      message Inner {
        repeated Stat stats = 1;
      }

      message GetReq {
        string network_id = 1;
        repeated string service_names = 2;
      }

      message Stat {
        ServiceState state = 1;
        int64 count = 2;
      }
    }

    message Metrics {
      map<string, string> metrics = 1;

      message GetReq {
        string network_id = 1;
        string service_name = 2;
      }
    }

    message ConfigOp {
      string id = 1;
      string param = 2;
      bool customize_config = 3;
    }
  }
}

message Link {
  string link_id = 1;
  string description = 2;
  string from_id = 3;
  string from_name = 4;
  bool   from_node = 5;
  string from_interface = 6;
  string to_id = 7;
  string to_name = 8;
  bool   to_node = 9;
  string to_interface = 10;
  uint64 bandwidth = 11;

  message Id {
    string link_id = 1;
  }

  message List {
    repeated Link links = 1;
  }

  message Create {
    string from_node_id = 1;
    string from_interface = 2;
    string to_node_id = 3;
    string to_interface = 4;
    uint64 bandwidth = 5;
    string description = 6;
  }

  message Update {
    string link_id = 1;
    string from_node_id = 2;
    string from_interface = 3;
    string to_node_id = 4;
    string to_interface = 5;
    uint64 bandwidth = 6;
    string description = 7;
  }
}

message NodeGroup {
  string node_group_id = 1;
  string name = 2;
  string network_id = 3;
  string service_name = 4;
  string remark = 5;
  int64 num_node = 6;
  string config = 7;
  repeated ConfigOp configOps = 8;

  message ConfigOp {
    string id = 1;
    string param = 2;
  }

  message Id {
    string node_group_id = 1;
  }

  message Ids {
    repeated string node_group_ids = 1;
  }

  message ListReq {
    string network_id = 1;
    string service = 2;
  }

  message List {
    repeated NodeGroup groups = 1;
  }

  message Create {
    string name = 1;
    string network_id = 2;
    string service = 3;
    string remark = 4;
    repeated string nodes = 5;
    string config = 6;
  }

  message Update {
    string node_group_id = 1;
    string name = 2;
    string remark = 3;
    repeated string nodes = 4;
    string config = 5;
  }

  message SetConfigOp {
    string node_group_id = 1;
    string op_id = 2;
    repeated string op_params = 3;
  }
}

message Ops {
  message GeneralReq {
    string id = 1;
    string service_name = 2;
  }

  message Request {
    string id = 1;
    string service_name = 2;
    string command = 3;
    string params = 4;
  }

  message Responses {
    repeated Response responses = 1;
  }

  message Response {
    string timestamp = 1;
    string node_id = 2;
    string framework_err = 3;
    string service_response = 4;
    string service_err = 5;
  }
}
syntax = "proto3";

option go_package = "asn.amiasys.com/controller/proto/management;managementpb";

package asn_management;

import "google/api/annotations.proto";

service Management {
  // ASNC related operations

  // Returns Controller version information and the Service Node gRPC port.
  //
  // Reports the running Controller version, the version of every loaded ASN
  // service, the port the Controller currently listens on for Service Node gRPC
  // connections, and the port saved by a previous `UpdatePort` that is not yet in
  // effect (`portPending` is 0 when no change is pending in this process).
  //
  // Auth: public; no `X-Auth-Token` is needed and no permission is checked.
  //
  // Errors: `shared.system.internal` when the configured listen address cannot be parsed.
  rpc GetInfo     (Empty)         returns (ControllerInfo) {
    option (google.api.http) = {
      get: "/info"
    };
  }

  // Changes the Service Node gRPC port saved in the Controller configuration.
  //
  // Writes `:<port>` to the `api.grpc_c` key of the Controller configuration file.
  // The running listener is not restarted: the new port takes effect on the next
  // Controller start, and until then `GetInfo` reports it as `portPending`.
  //
  // Auth: requires `X-Auth-Token`; the caller must be an ASN administrator (holds an
  // access granting the `manage` operation on the `asn` scope).
  //
  // Request: `port` is required and must be 1-65535.
  //
  // Errors:
  // - `shared.auth.permission_denied`: the caller is not an administrator.
  // - `shared.request.param_invalid` (meta `field=port`): port is 0 or above 65535.
  // - `shared.system.internal`: the lock or the configuration write failed.
  rpc UpdatePort  (UpdatePortReq) returns (Empty) {
    option (google.api.http) = {
      post: "/info/port"
      body: "*"
    };
  }

  // ---------------------------------------------------------------------------
  // 1 — Auth (Verification Codes, Login, MFA, Factors, Tokens, Logout)
  // ---------------------------------------------------------------------------

  // --- Auth Login/Logout ---

  // Lists the login credential methods enabled for ASN.
  //
  // The set comes from the IAM service configuration for the `asn` service. Use it
  // to decide which login options to show and which `method` values
  // `AuthFlowInit` will accept; `AuthFlowInit` rejects a disabled method.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Response: `methods` holds `Auth.CredentialMethod` values; it can be empty when
  // no method is enabled.
  rpc AuthListLoginMethods (Empty) returns (Auth.LoginMethods) {
    option (google.api.http) = {
      get: "/auth/login/methods"
    };
  }

  // Lists the phone country codes allowed for SMS.
  //
  // Returns the IAM country-code policy: `type` is the selection mode and `codes`
  // is the list it applies to (see `Auth.CountryCodeList`). Use it to build the
  // country selector for phone login, phone binding, and SMS MFA setup.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  rpc AuthListPhoneCountries (Empty) returns (Auth.CountryCodeList) {
    option (google.api.http) = {
      get: "/auth/phone/countries"
    };
  }

  // Sends an SMS verification code to a phone number.
  //
  // Use this to obtain the code for `AuthBindPhone`. The login flow and the password
  // flow send their own codes (`AuthFlowGetChallenge`,
  // `AuthPasswordFlowSendCode`); do not use this endpoint for them. Resends are
  // rate-limited per phone number by IAM: when called again too early, no code is
  // sent and `result` reports the cooldown.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Request: `countryCode` and `number` are required. With `sendOnlyWhenExists`
  // set, the code is sent only if an account already uses that phone; otherwise
  // the response looks the same as a send.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=country_code` or `field=number`).
  // - `shared.request.param_invalid`: IAM rejected the phone number format.
  // - `shared.request.feature_disabled`: SMS sending is not configured in IAM.
  rpc AuthSendCodeToPhone (Auth.Phone) returns (Auth.Code) {
    option (google.api.http) = {
      post: "/auth/phone/sendCode"
      body: "*"
    };
  }

  // Sends a verification code to an email address.
  //
  // Use this to obtain the code for `AuthBindEmail`. The login flow and the password
  // flow send their own codes (`AuthFlowGetChallenge`,
  // `AuthPasswordFlowSendCode`); do not use this endpoint for them. Resends are
  // rate-limited per address by IAM: when called again too early, no code is sent
  // and `result` reports the cooldown.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Request: `email` is required. With `sendOnlyWhenExists` set, the code is sent
  // only if an account already uses that address; otherwise the response looks the
  // same as a send.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=email`).
  // - `shared.request.param_invalid`: IAM rejected the email format.
  rpc AuthSendCodeToEmail (Auth.Email) returns (Auth.Code) {
    option (google.api.http) = {
      post: "/auth/email/sendCode"
      body: "*"
    };
  }

  // Login is a single stateful flow regardless of credential kind:
  //   AuthFlowInit -> (optional) AuthFlowGetChallenge -> AuthFlowVerify
  // and, when AuthFlowVerify returns FLOW_STATE_MFA_VERIFY / FLOW_STATE_MFA_SETUP,
  // continue via the Auth Flow MFA APIs below.

  // Login step 1: opens a login flow for a credential method.
  //
  // Login flow (all steps are public; follow `state` in each response):
  // 1. `AuthFlowInit` (`POST /auth/flow/init`) returns a credential-phase `flowToken`
  //    and `state`.
  // 2. If `state` is `FLOW_STATE_CHALLENGE_REQUIRED` (phone code, email code,
  //    passkey), call `AuthFlowGetChallenge` (`POST /auth/flow/challenge`).
  //    If it is `FLOW_STATE_VERIFY_REQUIRED` (password methods, WeChat, Apple,
  //    Google), skip to step 3.
  // 3. `AuthFlowVerify` (`POST /auth/flow/verify`) submits the proof and returns an
  //    `Auth.LoginResult`:
  //    - `FLOW_STATE_AUTHENTICATED`: use `tokenSet`; login is done.
  //    - `FLOW_STATE_MFA_VERIFY`: call `AuthFlowGetChallenge` with `mfaMethod`, then
  //      `AuthFlowMfaVerify` (`POST /auth/flow/mfa/verify`).
  //    - `FLOW_STATE_MFA_SETUP`: call `AuthFlowMfaSetupInitiate`
  //      (`POST /auth/flow/mfa/setup/initiate`), then `AuthFlowMfaSetupConfirm`
  //      (`POST /auth/flow/mfa/setup/confirm`).
  //
  // The credential-phase `flowToken` is an opaque handle kept in IAM memory. With
  // IAM defaults it expires 10 minutes after init and is invalidated after 5 failed
  // `AuthFlowVerify` attempts; it is consumed by a successful `AuthFlowVerify`.
  // ASN never creates accounts during login: the identity must belong to an
  // existing account.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Request: `deviceInfo` with a non-empty `name` is required; `method` is required;
  // fill the identity field that matches the method (see `Auth.FlowInitReq`).
  //
  // Response: `state` is `FLOW_STATE_CHALLENGE_REQUIRED` or
  // `FLOW_STATE_VERIFY_REQUIRED`, plus the `flowToken` for the next step.
  //
  // Errors:
  // - `shared.request.required_field_missing`: meta `field=device_name` when
  //   `deviceInfo.name` is empty; meta `field=username`, `field=phone` or
  //   `field=email` when the method's identity is missing.
  // - `shared.request.param_invalid`: meta `field=method` for an unspecified or
  //   unknown method; `field=phone` / `field=email` for a malformed identity.
  // - `shared.auth.login_method_not_allowed`: the method is not enabled (see
  //   `AuthListLoginMethods`).
  rpc AuthFlowInit (Auth.FlowInitReq) returns (Auth.FlowInitRes) {
    option (google.api.http) = {
      post: "/auth/flow/init"
      body: "*"
    };
  }

  // Login step 2: sends the OTP or returns the passkey challenge for a flow.
  //
  // Used in two phases, distinguished by which token is passed as `flowToken`:
  // - Credential phase (the token from `AuthFlowInit` with
  //   `FLOW_STATE_CHALLENGE_REQUIRED`): for phone/email code methods an OTP is sent
  //   to the identity given at init (only if an account uses it; the response looks
  //   the same either way); for passkey, `data` carries the WebAuthn assertion
  //   options and `domain` must be the relying-party domain. `mfaMethod` is ignored.
  //   Calling it for a method that needs no challenge fails.
  // - MFA phase (the `flowToken` from an `Auth.LoginResult` in
  //   `FLOW_STATE_MFA_VERIFY`): `mfaMethod` selects the factor and is required. SMS
  //   and Email send an OTP to the account's bound phone/email; TOTP sends nothing
  //   and only records the choice. Always call this before `AuthFlowMfaVerify`
  //   (also for TOTP); call it again with another `mfaMethod` to switch factor.
  //
  // Calling again resends the OTP, subject to the per-target resend cooldown
  // reported in `result`/`next`. It does not consume a verification attempt.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=flow_token`).
  // - `shared.request.param_invalid`: credential phase with a method that needs no
  //   challenge (`field=method`); MFA phase with a missing or unsupported
  //   `mfaMethod` (`field=mfa_method`).
  // - `shared.auth.flow_token_invalid` / `shared.auth.flow_token_expired`: unknown
  //   or expired credential-phase token.
  // - `shared.auth.verification.attempts_exhausted`: the credential-phase token used
  //   up its attempts; restart at `AuthFlowInit`.
  rpc AuthFlowGetChallenge (Auth.FlowGetChallengeReq) returns (Auth.FlowGetChallengeRes) {
    option (google.api.http) = {
      post: "/auth/flow/challenge"
      body: "*"
    };
  }

  // Login step 3: submits the credential proof and completes the credential phase.
  //
  // Fill only the proof field that matches the method chosen at `AuthFlowInit` (see
  // `Auth.FlowVerifyReq`). On success the credential-phase `flowToken` is consumed
  // and the result is one of:
  // - `FLOW_STATE_AUTHENTICATED`: `tokenSet` holds the access/refresh tokens.
  // - `FLOW_STATE_MFA_VERIFY`: MFA is required and the account has a factor bound;
  //   continue with `AuthFlowGetChallenge` + `AuthFlowMfaVerify` using the new
  //   `flowToken` from this response.
  // - `FLOW_STATE_MFA_SETUP`: MFA is required but no factor is bound; continue with
  //   `AuthFlowMfaSetupInitiate` + `AuthFlowMfaSetupConfirm`.
  //
  // MFA is required when the ASN service enforces MFA or the account enabled it
  // (`AuthEnableUserMfa`). Phone-code, email-code, and passkey logins already count
  // as MFA-verified and always return `FLOW_STATE_AUTHENTICATED`.
  //
  // A failed proof counts against the flow's attempt limit; the same `flowToken`
  // can be retried until the limit or expiry is reached.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=flow_token`).
  // - `shared.auth.flow_token_invalid` / `shared.auth.flow_token_expired`: unknown,
  //   already used, or expired flow token; restart at `AuthFlowInit`.
  // - `shared.auth.verification.attempts_exhausted`: too many failed proofs; restart
  //   at `AuthFlowInit`.
  // - `shared.auth.password_wrong`: wrong password (password methods).
  // - `shared.account.not_found`: no account matches the identity.
  rpc AuthFlowVerify (Auth.FlowVerifyReq) returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/verify"
      body: "*"
    };
  }

  // Re-enters the MFA step from an access token that is not yet MFA-verified.
  //
  // Any token-protected endpoint returns `shared.auth.mfa.needed` when the presented
  // access token has not cleared MFA but MFA is required (for example after
  // `AuthEnableUserMfa`, or when a client lost the MFA step of a login). Pass that
  // access token here to get a fresh `Auth.LoginResult`, exactly as `AuthFlowVerify`
  // would return it:
  // - `FLOW_STATE_MFA_VERIFY` / `FLOW_STATE_MFA_SETUP` with `flowToken` and the
  //   method lists; continue with the MFA endpoints.
  // - `FLOW_STATE_AUTHENTICATED` with `tokenSet` when the token no longer needs MFA
  //   (already verified, or MFA is not required).
  //
  // Auth: public; the token goes in the body, not in `X-Auth-Token`.
  //
  // Request: `accessToken` is required.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=access_token`).
  // - `shared.auth.access_token_invalid` / `shared.auth.access_token_expired`: the
  //   token is malformed, revoked, expired, or not an access token.
  rpc AuthFlowResume (Auth.FlowResumeReq) returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/resume"
      body: "*"
    };
  }

  // Exchanges the current access/refresh token pair for a new pair.
  //
  // Send both tokens of the current pair; the access token may already be expired.
  // The pair must be the one IAM currently holds for that device, so each pair can
  // be refreshed once: after a successful call, use and store the returned pair.
  // The new access token lives for the Controller's configured access lifetime
  // (`login` config, default 60 minutes). The refresh token's expiry does not move:
  // it stays at the time set at login (default 720 minutes after login), after which
  // the user must log in again. Refreshing an MFA-unverified pair keeps it
  // MFA-unverified.
  //
  // Auth: public; the tokens go in the body, not in `X-Auth-Token`.
  //
  // Request: `accessToken` and `refreshToken` are both required.
  //
  // Errors:
  // - `shared.auth.access_token_invalid`: the access token is malformed or not an
  //   access token.
  // - `shared.auth.refresh_token_invalid`: the refresh token does not belong to the
  //   access token, or the pair is no longer current (already refreshed, logged
  //   out, device removed).
  // - `shared.auth.refresh_token_expired`: the refresh token expired; log in again.
  // - `shared.request.feature_disabled`: token refresh is disabled in IAM.
  rpc AuthRefreshToken (Auth.Tokens) returns (Auth.Tokens) {
    option (google.api.http) = {
      post: "/auth/token"
      body: "*"
    };
  }

  // Logs out the device bound to the presented access token.
  //
  // Revokes the access/refresh tokens of the device identified by the caller's
  // access token (both the MFA-verified and the MFA-unverified session), plus any
  // sessions that device delegated to other devices. Other devices of the same
  // account stay logged in. The device record itself is kept (see `DeviceUnbind`).
  //
  // Auth: requires `X-Auth-Token`.
  rpc AuthLogout (Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/logout"
      body: "*"
    };
  }

  // Returns the profile of the caller.
  //
  // Resolves the account from the access token and loads its profile from IAM:
  // identity, email/phone, bound factors (password, TOTP, WeChat, Apple, Google,
  // passkeys), MFA flag, timestamps, and ASN groups and accesses.
  //
  // Auth: requires `X-Auth-Token`; any authenticated user.
  rpc AuthGetCurrentUser (Empty) returns (User) {
    option (google.api.http) = {
      get: "/auth/user"
    };
  }

  // --- Auth Management ---

  // Password Flow: a single stateful flow covering both forgot-password recovery
  // and in-session password change.
  //   AuthPasswordFlowInit -> (OTP methods) AuthPasswordFlowSendCode
  //     -> AuthPasswordFlowVerify -> AuthPasswordFlowComplete

  // Password flow step 1: identifies the account and lists its verification methods.
  //
  // Password flow (forgot-password recovery and voluntary change; all steps are
  // public):
  // 1. `AuthPasswordFlowInit` (`POST /auth/password/flow/init`) returns `flowToken`
  //    and the usable `methods`.
  // 2. For an OTP method, `AuthPasswordFlowSendCode`
  //    (`POST /auth/password/flow/sendCode`) sends the code to the account's bound
  //    email/phone. Skip for the old-password method.
  // 3. `AuthPasswordFlowVerify` (`POST /auth/password/flow/verify`) submits the old
  //    password or the OTP.
  // 4. `AuthPasswordFlowComplete` (`POST /auth/password/flow/complete`) sets the new
  //    password.
  //
  // The `flowToken` is an opaque handle kept in IAM memory and bound to one
  // account. With IAM defaults it expires 10 minutes after init and is invalidated
  // after 5 failed verifications.
  //
  // Identity lookup: give one of `accountId`, `username`, `email`, or
  // `countryCode`+`number`. If several are set, the first non-empty one in that
  // order is used. Email and phone work only when IAM is configured to keep them
  // unique.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Response: `PASSWORD_FLOW_INIT_STATE_METHOD_REQUIRED` with `flowToken` and
  // `methods`, or `PASSWORD_FLOW_INIT_STATE_NO_RECOVERY` with an empty `flowToken`
  // and no methods when the account does not exist or has no usable method (the two
  // cases are deliberately indistinguishable).
  //
  // Errors:
  // - `shared.request.required_field_missing`: no identity field was given.
  // - `shared.request.param_invalid`: `accountId` is not a UUID.
  rpc AuthPasswordFlowInit (Auth.PasswordFlowInitReq) returns (Auth.PasswordFlowInitRes) {
    option (google.api.http) = {
      post: "/auth/password/flow/init"
      body: "*"
    };
  }

  // Password flow step 2: sends or resends the OTP for an OTP verification method.
  //
  // The code always goes to the email or phone bound to the flow's account, never to
  // a caller-supplied address. The chosen method is recorded on the flow and is what
  // `AuthPasswordFlowVerify` checks the code against; call again with the other
  // method to switch. Resends are subject to the per-target cooldown reported in
  // `result`/`next`. Skip this step for the old-password method.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Request: `flowToken` is required; `method` must be
  // `PASSWORD_VERIFY_METHOD_EMAIL` or `PASSWORD_VERIFY_METHOD_SMS`.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=flow_token`).
  // - `shared.request.param_invalid` (meta `field=method`): unspecified method, or
  //   `PASSWORD_VERIFY_METHOD_OLD_PASSWORD`.
  // - `shared.auth.login_method_not_allowed`: the account has no email/phone for the
  //   chosen method.
  // - `shared.auth.flow_token_invalid` / `shared.auth.flow_token_expired` /
  //   `shared.auth.verification.attempts_exhausted`: the flow token is unusable;
  //   restart at `AuthPasswordFlowInit`.
  rpc AuthPasswordFlowSendCode (Auth.PasswordFlowSendCodeReq) returns (Auth.PasswordFlowSendCodeRes) {
    option (google.api.http) = {
      post: "/auth/password/flow/sendCode"
      body: "*"
    };
  }

  // Password flow step 3: verifies the old password or the OTP for the flow.
  //
  // A non-empty `oldPassword` selects the old-password method (it wins if `code`
  // is also set). Otherwise `code` is checked against the OTP method chosen by the
  // last `AuthPasswordFlowSendCode`. On success the flow is marked verified and
  // `AuthPasswordFlowComplete` may be called. A failed proof counts against the
  // flow's attempt limit; old-password guesses are also throttled per account like
  // password login.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=flow_token`).
  // - `shared.auth.verification.code_required`: no `oldPassword` and no code was
  //   sent yet; call `AuthPasswordFlowSendCode` first.
  // - `shared.auth.password_wrong`: wrong old password.
  // - `shared.auth.verification.code_invalid` / `shared.auth.verification.code_expired`:
  //   wrong or expired OTP.
  // - `shared.auth.flow_token_invalid` / `shared.auth.flow_token_expired` /
  //   `shared.auth.verification.attempts_exhausted`: the flow token is unusable;
  //   restart at `AuthPasswordFlowInit`.
  rpc AuthPasswordFlowVerify (Auth.PasswordFlowVerifyReq) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/password/flow/verify"
      body: "*"
    };
  }

  // Password flow step 4: sets the new password for a verified flow.
  //
  // Requires a flow verified by `AuthPasswordFlowVerify`. On success the flow token
  // is consumed. Session handling depends on how the flow was verified:
  // - old password: all existing sessions stay logged in;
  // - email/SMS OTP (recovery): all sessions of the account are revoked.
  // If the new password is rejected (for example by the password policy), the flow
  // stays verified and this call can be retried with another password.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Request: `flowToken` and `newPassword` are required.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=flow_token` or `field=new_password`).
  // - `shared.auth.verification.code_required`: the flow has not been verified yet.
  // - `shared.auth.flow_token_invalid` / `shared.auth.flow_token_expired`: the flow
  //   token is unknown, already used, or expired.
  rpc AuthPasswordFlowComplete (Auth.PasswordFlowCompleteReq) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/password/flow/complete"
      body: "*"
    };
  }

  // Sets another account's password without proof of the old one.
  //
  // Overwrites the target account's password (an account without a password gets
  // one). IAM revokes the target's sessions that were established with a password;
  // sessions from OTP or third-party logins are kept.
  //
  // Auth: requires `X-Auth-Token`; the caller must be an ASN administrator (holds an
  // access granting the `manage` operation on the `asn` scope).
  //
  // Request: `accountId` (UUID) and `password` are required.
  //
  // Errors:
  // - `shared.auth.permission_denied`: the caller is not an administrator.
  // - `shared.request.param_invalid` (meta `field=account_id`): `accountId` is not a UUID.
  // - `shared.account.not_found`: no such account.
  rpc AuthResetPassword (Auth.ResetPassword) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/password/reset"
      body: "*"
    };
  }

  // Turns on MFA at login for the caller's own account.
  //
  // After this, logins with a password or a third-party provider continue to
  // `FLOW_STATE_MFA_VERIFY` (or `FLOW_STATE_MFA_SETUP` if no factor is bound).
  // Existing sessions that have not cleared MFA, including the caller's own session
  // when it came from a password login, start getting `shared.auth.mfa.needed`
  // and must go through `AuthFlowResume`.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Errors: `shared.auth.mfa.not_allowed` when MFA is already enabled for the
  // account, when the ASN service enforces MFA for everyone (the per-account
  // setting cannot be changed then), or for special (non-normal) accounts.
  rpc AuthEnableUserMfa (Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/mfa/enable"
      body: "*"
    };
  }

  // Turns off MFA at login for the caller's own account.
  //
  // Bound factors stay bound. Has no effect on login when the ASN service enforces
  // MFA for everyone; that case is rejected.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Errors: `shared.auth.mfa.not_allowed` when the ASN service enforces MFA, or for
  // special (non-normal) accounts.
  rpc AuthDisableUserMfa (Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/mfa/disable"
      body: "*"
    };
  }

  // Starts TOTP enrollment for the caller and returns the provisioning material.
  //
  // TOTP binding (outside login): call this, show the QR code (or the secret) to
  // the user, then confirm with `AuthBindTotp` (`POST /auth/mfa/totp/bind`) using
  // the first code from the authenticator app. A new secret is generated on every
  // call and replaces any unconfirmed one; it is stored but not active until
  // confirmed.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Errors:
  // - `shared.auth.mfa.already_enrolled`: TOTP is already bound; unbind it first.
  // - `shared.auth.mfa.not_allowed`: special (non-normal) accounts.
  rpc AuthGenerateTotpQrCode (Empty) returns (Auth.TotpQrCode) {
    option (google.api.http) = {
      get: "/auth/mfa/totp/qrcode"
    };
  }

  // Confirms TOTP enrollment for the caller with a code from the authenticator.
  //
  // Completes the enrollment started by `AuthGenerateTotpQrCode`. Binding TOTP does
  // not by itself turn on MFA at login; see `AuthEnableUserMfa`.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `code` is required (the current TOTP code as a decimal string).
  //
  // Errors:
  // - `shared.auth.mfa.not_enrolled`: `AuthGenerateTotpQrCode` was not called first.
  // - `shared.auth.mfa.already_enrolled`: TOTP is already bound.
  // - `shared.auth.mfa.totp_code_invalid`: the code is wrong or not numeric.
  rpc AuthBindTotp (Auth.BindTotp) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/mfa/totp/bind"
      body: "*"
    };
  }

  // Removes the bound TOTP authenticator from an account.
  //
  // Does not turn off MFA at login; if MFA stays required and no other factor is
  // bound, the next login goes to `FLOW_STATE_MFA_SETUP`.
  //
  // Auth: requires `X-Auth-Token`. Omit `id` (or pass the caller's own id) to act
  // on the caller; any other `id` requires an ASN administrator.
  //
  // Request: query parameter `id` (account UUID), optional, e.g.
  // `DELETE /auth/mfa/totp/bind?id=<uuid>`.
  //
  // Errors:
  // - `shared.auth.permission_denied`: non-administrator targeting another account.
  // - `shared.auth.mfa.not_enrolled`: no TOTP is bound.
  rpc AuthUnbindTotp (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/mfa/totp/bind"
    };
  }

  // Binds or replaces the caller's email address after verifying a code.
  //
  // Email binding: get a code with `AuthSendCodeToEmail` (`POST /auth/email/sendCode`)
  // for the new address, then call this with the address and the code. The bound
  // email is used for email-code login, email MFA, and password recovery.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `email` and `code` are required.
  //
  // Errors: `shared.auth.verification.code_invalid` /
  // `shared.auth.verification.code_expired` for a wrong or expired code.
  rpc AuthBindEmail (Auth.BindEmail) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/email"
      body: "*"
    };
  }

  // Removes the email address from an account.
  //
  // Auth: requires `X-Auth-Token`. Omit `id` (or pass the caller's own id) to act
  // on the caller; any other `id` requires an ASN administrator.
  //
  // Request: query parameter `id` (account UUID), optional, e.g.
  // `DELETE /auth/bind/email?id=<uuid>`.
  //
  // Errors: `shared.auth.permission_denied` for a non-administrator targeting
  // another account.
  rpc AuthUnbindEmail (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/email"
    };
  }

  // Binds or replaces the caller's phone number after verifying an SMS code.
  //
  // Phone binding: get a code with `AuthSendCodeToPhone` (`POST /auth/phone/sendCode`)
  // for the new number, then call this with the number and the code. The bound
  // phone is used for phone-code login, SMS MFA, and password recovery.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `phone` (`countryCode` + `number`) and `code` are required.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=phone`): `phone` is absent.
  // - `shared.auth.verification.code_invalid` / `shared.auth.verification.code_expired`:
  //   wrong or expired code.
  rpc AuthBindPhone (Auth.BindPhone) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/phone"
      body: "*"
    };
  }

  // Removes the phone number from an account.
  //
  // Auth: requires `X-Auth-Token`. Omit `id` (or pass the caller's own id) to act
  // on the caller; any other `id` requires an ASN administrator.
  //
  // Request: query parameter `id` (account UUID), optional, e.g.
  // `DELETE /auth/bind/phone?id=<uuid>`.
  //
  // Errors: `shared.auth.permission_denied` for a non-administrator targeting
  // another account.
  rpc AuthUnbindPhone (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/phone"
    };
  }

  // Links a WeChat account to the caller using a WeChat OAuth code.
  //
  // IAM exchanges the OAuth `code` for the WeChat identity using the WeChat app
  // `appId` and links it to the caller, enabling WeChat login.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `appId` and `code` are required.
  rpc AuthBindWeChat (Auth.BindWeChat) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/wechat"
      body: "*"
    };
  }

  // Removes the WeChat link from an account.
  //
  // Auth: requires `X-Auth-Token`. Omit `id` (or pass the caller's own id) to act
  // on the caller; any other `id` requires an ASN administrator.
  //
  // Request: query parameter `id` (account UUID), optional, e.g.
  // `DELETE /auth/bind/wechat?id=<uuid>`.
  //
  // Errors: `shared.auth.permission_denied` for a non-administrator targeting
  // another account.
  rpc AuthUnbindWeChat (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/wechat"
    };
  }

  // Links an Apple ID to the caller using a Sign in with Apple ID token.
  //
  // Enables Apple login for the caller.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `idToken` is required.
  rpc AuthBindAppleId (Auth.BindApple) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/apple"
      body: "*"
    };
  }

  // Removes the Apple ID link from an account.
  //
  // Auth: requires `X-Auth-Token`. Omit `id` (or pass the caller's own id) to act
  // on the caller; any other `id` requires an ASN administrator.
  //
  // Request: query parameter `id` (account UUID), optional, e.g.
  // `DELETE /auth/bind/apple?id=<uuid>`.
  //
  // Errors: `shared.auth.permission_denied` for a non-administrator targeting
  // another account.
  rpc AuthUnbindAppleId (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/apple"
    };
  }

  // Links a Google account to the caller using a Google Sign-In ID token.
  //
  // Enables Google login for the caller.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `idToken` is required.
  rpc AuthBindGoogleId (Auth.BindGoogle) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/google"
      body: "*"
    };
  }

  // Removes the Google link from an account.
  //
  // Auth: requires `X-Auth-Token`. Omit `id` (or pass the caller's own id) to act
  // on the caller; any other `id` requires an ASN administrator.
  //
  // Request: query parameter `id` (account UUID), optional, e.g.
  // `DELETE /auth/bind/google?id=<uuid>`.
  //
  // Errors: `shared.auth.permission_denied` for a non-administrator targeting
  // another account.
  rpc AuthUnbindGoogleId (User.ID) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/google"
    };
  }

  // Starts passkey registration for the caller and returns a WebAuthn challenge.
  //
  // Passkey binding: call this with the relying-party `domain`, run the WebAuthn
  // registration ceremony with the creation options in `data`, then send the
  // JSON-encoded registration response with the same `domain` and the returned
  // `sessionId` to `AuthBindPasskey` (`POST /auth/bind/passkey`).
  //
  // Auth: requires `X-Auth-Token`; always acts on the caller. `accountId` in the
  // request is ignored.
  //
  // Request: `domain` is required.
  rpc AuthGetPasskeyBindChallenge (Auth.PasskeyDomain) returns (Auth.PasskeyChallenge) {
    option (google.api.http) = {
      post: "/auth/bind/passkey/challenge"
      body: "*"
    };
  }

  // Completes passkey registration for the caller.
  //
  // Verifies the WebAuthn registration response against the challenge session from
  // `AuthGetPasskeyBindChallenge` and stores the passkey on the caller's account,
  // associated with the device of the caller's access token. The passkey then
  // appears in `passkeys` of `AuthGetCurrentUser` and can be used for passkey
  // login.
  //
  // Auth: requires `X-Auth-Token`; acts on the caller only.
  //
  // Request: `domain`, `sessionId`, and `data` are required.
  rpc AuthBindPasskey (Auth.BindPasskey) returns (Empty) {
    option (google.api.http) = {
      post: "/auth/bind/passkey"
      body: "*"
    };
  }

  // Removes one passkey from an account.
  //
  // Auth: requires `X-Auth-Token`. Omit `accountId` (or pass the caller's own id) to
  // act on the caller; any other `accountId` requires an ASN administrator.
  //
  // Request: query parameters `accountId` (optional) and `passkeyId` (the
  // `passkeyId` from `User.passkeys`), e.g.
  // `DELETE /auth/bind/passkey?passkeyId=<id>`.
  //
  // Errors: `shared.auth.permission_denied` for a non-administrator targeting
  // another account.
  rpc AuthUnbindPasskey (Auth.UnbindPasskey) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/bind/passkey"
    };
  }

  // ---------------------------------------------------------------------------
  // 2 — Device
  // ---------------------------------------------------------------------------

  // Removes a login device from an account.
  //
  // Deletes the device record and its session tokens (the device is logged out),
  // together with any sessions that device delegated to other devices.
  //
  // Auth: requires `X-Auth-Token`. Omit `accountId` (or pass the caller's own id) to
  // act on the caller; any other `accountId` requires an ASN administrator.
  //
  // Request: query parameters `accountId` (optional) and `deviceId` (required), e.g.
  // `DELETE /auth/device?deviceId=<uuid>`.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=device_id`).
  // - `shared.auth.permission_denied`: non-administrator targeting another account.
  rpc DeviceUnbind (Device.UnbindReq) returns (Empty) {
    option (google.api.http) = {
      delete: "/auth/device"
    };
  }

  // Renames a login device of an account.
  //
  // Only the display name changes; the other stored device attributes are kept.
  //
  // Auth: requires `X-Auth-Token`. Omit `accountId` (or pass the caller's own id) to
  // act on the caller; any other `accountId` requires an ASN administrator.
  //
  // Request: `deviceId` and `deviceName` are required.
  //
  // Errors:
  // - `shared.request.required_field_missing` (meta `field=device_id` or `field=device_name`).
  // - `shared.auth.permission_denied`: non-administrator targeting another account.
  rpc DeviceRename (Device.RenameReq) returns (Empty) {
    option (google.api.http) = {
      put: "/auth/device/name"
      body: "*"
    };
  }

  // Auth Flow APIs (stateful login flow with forced inline MFA setup/verify)

  // MFA setup step 1: chooses the factor to bind during login and sends its material.
  //
  // Use when a login result is `FLOW_STATE_MFA_SETUP`. Pass the `flowToken` from that
  // `Auth.LoginResult` and a `method` from its `availableSetupMethods`:
  // - TOTP: returns `totpImage`, `totpIssuer`, `totpSecret` for the authenticator app.
  // - SMS: pass the new `phone`; an OTP is sent to it.
  // - Email: pass the new `email`; an OTP is sent to it.
  // The choice (and SMS/Email target) is recorded on the flow; call again to switch
  // method or target, or to resend the OTP (subject to the cooldown in
  // `result`/`next`). Then call `AuthFlowMfaSetupConfirm`
  // (`POST /auth/flow/mfa/setup/confirm`).
  //
  // The MFA-phase `flowToken` is the MFA-unverified access token itself, so it
  // expires with the access token (Controller access lifetime, default 60 minutes);
  // an expired one surfaces as `shared.auth.access_token_expired` and the login
  // must be restarted.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Errors:
  // - `shared.request.param_invalid` (meta `field=method`): unspecified or unknown method.
  // - `shared.request.required_field_missing`: SMS without `phone` / Email without `email`.
  // - `shared.auth.flow_token_invalid`: the token is not a pending MFA token (for
  //   example the login already completed).
  // - `shared.auth.access_token_invalid` / `shared.auth.access_token_expired`:
  //   malformed or expired `flowToken`.
  rpc AuthFlowMfaSetupInitiate (Auth.FlowMfaSetupInitiateReq) returns (Auth.FlowMfaSetupInitiateRes) {
    option (google.api.http) = {
      post: "/auth/flow/mfa/setup/initiate"
      body: "*"
    };
  }

  // MFA setup step 2: confirms the new factor and completes the login.
  //
  // Checks `code` against the method and target recorded by
  // `AuthFlowMfaSetupInitiate` (the first TOTP code, or the OTP sent to the new
  // phone/email). On success the factor is bound (for SMS/Email the phone/email is
  // written to the account), MFA is turned on for the account, the flow token
  // becomes invalid, and the result is `FLOW_STATE_AUTHENTICATED` with `tokenSet`.
  // `account` is not populated in this response.
  //
  // Each failed confirmation counts toward the MFA attempt limit (IAM default 5);
  // when it is reached the login must be restarted.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Errors:
  // - `shared.request.param_invalid`: `AuthFlowMfaSetupInitiate` was not called first.
  // - `shared.auth.mfa.totp_code_invalid` / `shared.auth.verification.code_invalid` /
  //   `shared.auth.verification.code_expired`: wrong or expired code.
  // - `shared.auth.mfa.attempts_exhausted`: too many failures; restart the login.
  // - `shared.auth.flow_token_invalid`, `shared.auth.access_token_invalid`,
  //   `shared.auth.access_token_expired`: unusable `flowToken`.
  rpc AuthFlowMfaSetupConfirm  (Auth.FlowMfaSetupConfirmReq)  returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/mfa/setup/confirm"
      body: "*"
    };
  }

  // MFA verify: submits the code for the selected bound factor and completes the login.
  //
  // Use when a login result is `FLOW_STATE_MFA_VERIFY`. First call
  // `AuthFlowGetChallenge` with the same `flowToken` and an `mfaMethod` from
  // `availableMfaMethods` (this sends the OTP for SMS/Email and records the choice,
  // also for TOTP), then submit the code here. On success the flow token becomes
  // invalid and the result is `FLOW_STATE_AUTHENTICATED` with `tokenSet`; `account`
  // is not populated in this response.
  //
  // Each failed verification counts toward the MFA attempt limit (IAM default 5);
  // when it is reached the login must be restarted.
  //
  // Auth: public; no `X-Auth-Token` is needed.
  //
  // Errors:
  // - `shared.request.param_invalid` (meta `field=mfa_method`): no factor was selected
  //   with `AuthFlowGetChallenge`, or the factor equals the login credential.
  // - `shared.auth.mfa.totp_code_invalid` / `shared.auth.verification.code_invalid` /
  //   `shared.auth.verification.code_expired`: wrong or expired code.
  // - `shared.auth.mfa.attempts_exhausted`: too many failures; restart the login.
  // - `shared.auth.flow_token_invalid`, `shared.auth.access_token_invalid`,
  //   `shared.auth.access_token_expired`: unusable `flowToken`.
  rpc AuthFlowMfaVerify        (Auth.FlowMfaVerifyReq)        returns (Auth.LoginResult) {
    option (google.api.http) = {
      post: "/auth/flow/mfa/verify"
      body: "*"
    };
  }
  // User API

  // Returns full user records for the given account IDs.
  //
  // Admin only: the caller must be an ASN admin (hold the `manage` operation on the
  // `asn` scope, which members of the built-in `asn-admin` group have); otherwise
  // `shared.auth.permission_denied`.
  //
  // Query parameters:
  // - `ids` (repeated, e.g. `?ids=<uuid>&ids=<uuid>`): account UUIDs to fetch. Any
  //   value that is not a UUID fails the request with `shared.request.param_invalid`
  //   (meta `field=ids`). When empty, `users` is empty.
  // - `service` (optional): the IAM service whose view of the accounts is returned
  //   (affects per-service fields such as `mfaEnabled`, `wechat`, `apple`, `google`).
  //   Defaults to `asn`. Any other value must be a loaded service name, otherwise
  //   `shared.service.not_found`.
  //
  // IDs that do not match an account visible to that service are silently skipped,
  // so `users` may be shorter than `ids` or empty. Each returned user has its
  // profile and bound-factor fields and `groups` (its `asn` user-group memberships)
  // filled; `accesses` is not filled by this call.
  rpc GetUsersByIDs   (User.GetReq)         returns (User.List) {
    option (google.api.http) = {
      get: "/user"
    };
  }

  // Lists the ID and username of every account, grouped by service.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // Query parameter `serviceNames` (repeated, e.g. `?serviceNames=asn&serviceNames=foo`)
  // selects the IAM services to list. When empty, only `asn` is listed. Each name
  // other than `asn` must be a loaded service, otherwise `shared.service.not_found`.
  //
  // The response map is keyed by service name; a service with no accounts has no
  // entry in the map.
  rpc ListUsers       (Node.Service.Names)  returns (User.ServiceUsers) {
    option (google.api.http) = {
      get: "/user/list"
    };
  }

  // Creates a new account in the `asn` IAM service.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // `username`, `password`, `email` and `phone` are passed to IAM as given; email
  // and phone are stored without sending a verification code. A leading `+` in
  // `phone.countryCode` is stripped. Field validation (username/email/phone
  // uniqueness and format, password policy) is performed by IAM, whose error code
  // is returned unchanged.
  //
  // The new account is not added to any user group; use `AddUsersToGroup`
  // (`POST /user/group/users`) to grant it access.
  rpc CreateUser      (User.Create)         returns (Empty) {
    option (google.api.http) = {
      post: "/user"
      body: "*"
    };
  }

  // Updates an account's phone number and email.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // `id` must be an account UUID, otherwise `shared.request.param_invalid`
  // (meta `field=id`). Both `phone` and `email` are always written (phone first,
  // then email), without sending a verification code: an omitted field is sent to
  // IAM as an empty value rather than being left unchanged, so send the current
  // value to keep it. A leading `+` in `phone.countryCode` is stripped. The two
  // writes are not atomic: if the email update fails, the phone change remains.
  // IAM validation errors are returned unchanged.
  rpc UpdateUser      (User.Update)         returns (Empty) {
    option (google.api.http) = {
      put: "/user"
      body: "*"
    };
  }

  // Deletes an account from the `asn` IAM service.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // Query parameter `id` must be an account UUID, otherwise
  // `shared.request.param_invalid` (meta `field=id`). Deleting your own account is
  // rejected with `shared.auth.permission_denied`. The controller performs no other
  // cleanup itself; the delete is delegated to IAM and IAM errors are returned
  // unchanged.
  rpc DeleteUser      (User.ID)             returns (Empty) {
    option (google.api.http) = {
      delete: "/user"
    };
  }

  // User Group API

  // Returns user groups by name, with members and access grants.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // Query parameter `userGroupNames` (repeated, e.g.
  // `?userGroupNames=asn-admin&userGroupNames=ops`) lists the groups to fetch;
  // results are in request order. If any name does not exist the whole request
  // fails with the IAM error. When empty, `groups` is empty.
  rpc GetUserGroups             (UserGroup.GetReq)    returns (UserGroup.List) {
    option (google.api.http) = {
      get: "/user/group"
    };
  }

  // Lists all user group names, grouped by group type.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // The `groups` map is keyed by the `UserGroup.Type` integer as a string
  // (`"0"` unknown, `"1"` service admin, `"2"` network); a type with no groups has
  // no entry. Use `GetUserGroups` (`GET /user/group`) for details.
  rpc ListUserGroups            (Empty)               returns (UserGroup.Names) {
    option (google.api.http) = {
      get: "/user/group/list"
    };
  }

  // Creates a network user group that grants operations on a set of networks.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // The created group always has type `TYPE_NETWORK` and no members. Only
  // `accesses[0]` is used (its `service` is ignored; further entries are ignored):
  // - `accesses` missing or empty: `shared.request.required_field_missing` (meta
  //   `field=access`).
  // - `accesses[0].operations`: each value must be `view` or `manage`, otherwise
  //   `shared.request.param_invalid` (meta `field=operation`); duplicates are
  //   dropped; empty fails with `shared.request.required_field_missing`
  //   (meta `field=operations`).
  // - `accesses[0].networks`: network IDs; empty fails with
  //   `shared.request.required_field_missing` (meta `field=networks`); an unknown ID
  //   fails with `asn.network.not_found`. The networks must sit under one root
  //   network, otherwise `shared.request.param_invalid`.
  // - A group whose networks include a root network grants `view` only; `manage`
  //   fails with `shared.request.param_invalid` (meta `field=operations`). Manage
  //   on a root comes only from its admin group (`root_network_id`).
  //
  // A group with the same `name` already existing fails with
  // `shared.group.name_already_exists`. On success the controller creates the group
  // and an IAM access named `<name>-access` bound to it.
  rpc CreateUserGroup           (UserGroup.Create)    returns (Empty) {
    option (google.api.http) = {
      post: "/user/group"
      body: "*"
    };
  }

  // Replaces the remark and network access of an existing network user group.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // `name` identifies the group (it cannot be renamed); an unknown name returns the
  // IAM error. Only `TYPE_NETWORK` groups can be updated; other types fail with
  // `shared.resource.state_invalid`. `accesses` follows the same rules as
  // `CreateUserGroup`, and `accesses[0].networks` / `operations` replace the
  // previous grant entirely. The access of a root admin group (`root_network_id`
  // set) is fixed: anything but its root and `view` and `manage` fails with
  // `shared.resource.state_invalid`, so only its remark changes, and the update
  // restores that access if it was changed outside the controller: only the
  // group's own `<name>-access` is written, and any other access is revoked from
  // the group. A further admin group of the same root, or one whose root is
  // gone, cannot be updated (`shared.resource.state_invalid`); delete it. `remark` is
  // always applied, so an empty `remark` clears it. Membership is not changed.
  rpc UpdateUserGroup           (UserGroup.Update)    returns (Empty) {
    option (google.api.http) = {
      put: "/user/group"
      body: "*"
    };
  }

  // Deletes a user group and its access grant.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // Query parameter `userGroupName` names the group; an unknown name returns the
  // IAM error. Built-in service admin groups (`TYPE_SERVICE`, e.g. `asn-admin`)
  // and the admin group of an existing root (`root_network_id` set; deleted with
  // the root) cannot be deleted (`shared.resource.state_invalid`); a further
  // admin group of the same root, or one whose root is gone, can. The controller deletes the
  // group's IAM access `<name>-access` and then the group itself; member accounts
  // are not deleted, they only lose the access the group granted.
  rpc DeleteUserGroup           (UserGroup.Name)      returns (Empty) {
    option (google.api.http) = {
      delete: "/user/group"
    };
  }

  // Adds accounts to a user group.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // `accountIds` must all be UUIDs, otherwise `shared.request.param_invalid`
  // (meta `field=account_ids`). An unknown `userGroupName` returns the IAM error.
  // When the group is a service admin group (`TYPE_SERVICE`, named
  // `<service>-admin`), each account is first registered with that service in IAM
  // and then added to the group; that service registration is not undone by
  // `RemoveUsersFromGroup`. Adding a user to `asn-admin` makes them an ASN admin.
  rpc AddUsersToGroup           (UserGroup.UserReq)   returns (Empty) {
    option (google.api.http) = {
      post: "/user/group/users"
      body: "*"
    };
  }

  // Removes accounts from a user group.
  //
  // Admin only (ASN admin, see `GetUsersByIDs`); otherwise
  // `shared.auth.permission_denied`.
  //
  // Uses `PUT` (not `DELETE`) so the account list travels in the body.
  // `accountIds` must all be UUIDs, otherwise `shared.request.param_invalid`
  // (meta `field=account_ids`). For the `asn-admin` group two guards apply, both
  // failing with `shared.auth.permission_denied`: the caller cannot remove
  // themselves, and the request is rejected when it would leave the group with no
  // member (non-members and duplicates in `accountIds` are not counted). Other IAM
  // errors are returned unchanged.
  rpc RemoveUsersFromGroup      (UserGroup.UserReq)   returns (Empty) {
    option (google.api.http) = {
      put: "/user/group/users"
      body: "*"
    };
  }

  // Network API

  // Imports networks, nodes and links from a topology YAML file.
  //
  // REST: this rpc has no gateway mapping; it is served by a hand-written handler at
  // `POST /network/topo/file` with the JSON body `{"networkTopo":"<yaml text>"}` (the YAML file
  // content as a plain string). On success the response is the usual envelope with an empty
  // `resp`. The YAML format is described on the `NetworkTopo` message.
  //
  // Auth: requires X-Auth-Token; the caller must be a system administrator (an access with the
  // `manage` operation on the `asn` scope), otherwise `shared.auth.permission_denied`.
  //
  // Behavior:
  // - The whole file is validated first (see `NetworkTopo`); nothing is written if validation fails.
  // - Top-level networks whose name equals an existing root network are skipped silently, together
  //   with their subnetworks, nodes and links. All other top-level networks are created as new root
  //   networks; the file's `network-tiers` become the tier vocabulary of each new root.
  // - Only nodes referenced by a created network are created; nodes listed under `nodes` but not
  //   placed in any network are ignored. Created nodes start in the unregistered state with new IDs.
  // - Links are created only between created nodes.
  // - A node-created event is emitted for every imported node.
  //
  // Errors:
  // - `shared.request.malformed`: the REST body is not valid JSON.
  // - `shared.request.param_invalid`: the text is not valid YAML for the topo structure, or it fails
  //   validation (duplicate network name, unknown node, node used twice, unknown network tier,
  //   invalid location tier or coordinates, unsupported node type, link to an unknown node/interface).
  // - `shared.system.internal`: a link connects a node being imported with a node that is not, or a
  //   database write fails.
  rpc ImportTopoFromFile        (NetworkTopo)     returns (Empty);

  // Exports a root network as a topology YAML file.
  //
  // REST: this rpc has no gateway mapping; it is served by a hand-written handler at
  // `GET /network/topo/file?networkId=<id>`. On success the response is NOT the JSON envelope: it is
  // the raw YAML with `Content-Type: application/x-yaml` and
  // `Content-Disposition: attachment; filename="topo-<networkId>.yaml"`. Errors still use the
  // JSON error envelope. The YAML format is described on the `NetworkTopo` message, and an exported
  // file can be imported again with `ImportTopoFromFile`.
  //
  // Auth: requires X-Auth-Token; the caller must be a system administrator (an access with the
  // `manage` operation on the `asn` scope), otherwise `shared.auth.permission_denied`.
  //
  // The export contains the network, all of its subnetworks and nodes (keyed by node name), the
  // root's `network-tiers`, and every link whose first endpoint is a node of this network.
  //
  // Errors:
  // - `asn.network.not_found`: `networkId` does not exist.
  // - `shared.request.param_invalid`: `networkId` is not a root network.
  // - `shared.system.internal`: YAML encoding failed.
  rpc ExportTopoFile            (Network.Id)      returns (NetworkTopo);

  // Lists the networks the caller can access, as a name-only tree.
  //
  // Returns a lightweight tree (`networkId`, `name`, `defaultRoot`, `subnets`) without nodes,
  // intended for network pickers. Top-level entries are sorted by name.
  //
  // Auth: requires X-Auth-Token. Which networks are returned depends on the caller's accesses:
  // - A caller with any system-wide access (scope `asn`) gets every root network with its full subtree.
  // - Otherwise the top-level entries are the networks named in the caller's network-scoped
  //   accesses (of any operation), each with its full subtree.
  //
  // The list is empty when the caller has no accesses.
  rpc ListAvailableNetworks     (Empty)           returns (Network.List) {
    option (google.api.http) = {
      get: "/network/available"
    };
  }

  // Gets one level of a network for map/topology display.
  //
  // Query params: `networkId` (required) and `locationTier` (optional), e.g.
  // `GET /network/display?networkId=<id>&locationTier=building`.
  //
  // The response describes the content of the requested network one level deep:
  // - `networks`: the child networks shown as collapsed boxes. Each carries, in its `nodes`, every
  //   node in its whole subtree (sorted by name).
  // - `nodes`: nodes placed directly in the requested network (sorted by name).
  // - `links`: aggregated network-level links between displayed networks and to displayed nodes
  //   (bandwidth summed, no `linkId`), plus individual node-to-node links.
  // - `locationTiers`: the distinct location tiers found in the subtree (unordered).
  //
  // Networks and nodes without their own address/coordinates inherit them from the nearest ancestor
  // network that has a location.
  //
  // `locationTier` filter (tiers ordered `world`, `country`, `state`, `city`, `district`, `campus`,
  // `building`, `floor`, `room`, `row`, `rack`, `unit`): when set, a child network is shown as a box
  // only if its location tier is empty, equal to, or finer than `locationTier`; a child network with
  // a coarser tier is not shown and its content is lifted to the current level instead. Nodes with a
  // coarser location tier are left out.
  //
  // Auth: requires X-Auth-Token and `view` or `manage` access on the network (or an ancestor),
  // otherwise `shared.auth.permission_denied`.
  //
  // Errors: `asn.network.not_found` when `networkId` is empty or unknown.
  rpc DisplayNetworks           (Network.GetReq)  returns (Network.Display) {
    option (google.api.http) = {
      get: "/network/display"
    };
  }

  // Gets the full network trees, including nodes, that the caller can access.
  //
  // Returns complete `Network` trees: every subnetwork recursively and the nodes of each network
  // (`Node.Info`).
  //
  // Auth: requires X-Auth-Token. A caller with any system-wide access (scope `asn`) gets every root
  // network. Otherwise the result is built from the networks named in the caller's network-scoped
  // accesses (of any operation); a granted network that has a granted ancestor is not
  // returned separately (it is already inside that ancestor's tree). Order is not guaranteed. The list is empty when the caller has no accesses.
  rpc GetNetworkTopo            (Empty)           returns (Network.TopoLists) {
    option (google.api.http) = {
      get: "/network/topo"
    };
  }

  // Gets the network tiers and location tiers that may be used under a network.
  //
  // Query param: `networkId`, e.g. `GET /network/tier?networkId=<id>`. Use it before
  // `CreateNetwork`/`UpdateNetwork` to fill tier pickers.
  //
  // Response:
  // - `networkTiers`: the tier vocabulary of the network's root network (set only by a topo file
  //   import; empty for root networks created with `CreateNetwork`).
  // - `locationTiers`: the location tiers allowed for items placed under this network: the tier of
  //   the nearest network (itself first, then its ancestors) that has a location tier, and every
  //   finer tier after it. All tiers when no such network exists.
  //
  // With an empty `networkId` the result is no network tiers and all location tiers
  // (`world`, `country`, `state`, `city`, `district`, `campus`, `building`, `floor`, `room`, `row`,
  // `rack`, `unit`); this works only for callers with system-wide `view` or `manage` access.
  //
  // Auth: requires X-Auth-Token and `view` or `manage` access on the network (or an ancestor),
  // otherwise `shared.auth.permission_denied`.
  //
  // Errors: `asn.network.not_found` when `networkId` is unknown (or empty for callers without
  // system-wide access).
  rpc GetNetworkAvailableTiers  (Network.Id)      returns (Network.Tiers) {
    option (google.api.http) = {
      get: "/network/tier"
    };
  }

  // Creates a network, either a new root network or a subnetwork.
  //
  // Body: `name` is required. Leave `parentNetworkId` empty to create a root network, or set it to
  // create a subnetwork under that network. A new network has no nodes and no subnetworks; the
  // server generates its UUID, which is not returned (re-read the tree to find it).
  //
  // Validation:
  // - Root networks: `name` must be unique among root networks. `networkTiers` is stored as given.
  // - Subnetworks: `name` must be unique within the whole tree of the root network.
  //   `networkTiers` must all be in the root network's tier vocabulary (see `GetNetworkAvailableTiers`).
  // - `location` (subnetworks only): latitude within [-90, 90], longitude within [-180, 180], and
  //   `locationTier` must be equal to or finer than the location tier of the nearest ancestor that
  //   has a location.
  //
  // Auth: requires X-Auth-Token and `manage` access on the parent network (or an ancestor). Creating
  // a root network therefore requires system-wide `manage` access.
  //
  // Errors:
  // - `shared.request.required_field_missing`: `name` is empty.
  // - `shared.request.param_invalid`: `location` is invalid.
  // - `shared.resource.already_exists`: the name is already used (see above).
  // - `shared.request.not_supported`: a `networkTiers` entry is not in the root's vocabulary.
  // - `asn.network.not_found`: `parentNetworkId` is unknown (for non-system-wide callers, also when
  //   it is empty).
  // - `shared.auth.permission_denied`: no `manage` access.
  rpc CreateNetwork             (Network.Create)  returns (Empty) {
    option (google.api.http) = {
      post: "/network"
      body: "*"
    };
  }

  // Updates a network's name, description, tiers and location.
  //
  // This is a full replace of the editable fields: `name` is required, and `description`,
  // `networkTiers` and `location` are overwritten with what is sent, so omitting one clears it.
  // The parent, subnetworks and nodes do not change.
  //
  // Validation: a changed `name` must be unique within the root network's tree; every
  // `networkTiers` entry must be in the root network's tier vocabulary (this also applies when
  // updating a root network); `location` follows the same rules as in `CreateNetwork`.
  //
  // Auth: requires X-Auth-Token and `manage` access on the network (or an ancestor).
  //
  // Errors:
  // - `shared.request.required_field_missing`: `name` is empty.
  // - `asn.network.not_found`: `networkId` is unknown.
  // - `shared.resource.already_exists`: the new name is already used in the tree.
  // - `shared.request.not_supported`: a `networkTiers` entry is not in the root's vocabulary.
  // - `shared.request.param_invalid`: `location` is invalid.
  // - `shared.auth.permission_denied`: no `manage` access.
  rpc UpdateNetwork             (Network.Update)  returns (Empty) {
    option (google.api.http) = {
      put: "/network"
      body: "*"
    };
  }

  // Deletes a network together with everything under it.
  //
  // Query param: `networkId`, e.g. `DELETE /network?networkId=<id>`.
  //
  // Side effects:
  // - Deletes the network and all of its subnetworks.
  // - Deletes every node in that subtree and every link attached to those nodes (including links
  //   to nodes outside the subtree).
  // - Node groups: deleting a root network deletes all node groups of that root; deleting a
  //   subnetwork removes the deleted nodes from node groups of the same root (the groups remain).
  // - Sends an unregister command to every deleted node, asynchronously.
  //
  // Auth: requires X-Auth-Token and `manage` access on the network (or an ancestor).
  //
  // Errors: `asn.network.not_found` when `networkId` is empty or unknown;
  // `shared.auth.permission_denied` without `manage` access.
  rpc DeleteNetwork             (Network.Id)      returns (Empty) {
    option (google.api.http) = {
      delete: "/network"
    };
  }

  // Nodes API

  // Get full node records by ID.
  //
  // Returns the full `Node` record (topology, install state, runtime state and
  // per-service state/config) for each requested ID, sorted by node name.
  // IDs that do not exist, and nodes the caller may not view, are silently
  // skipped.
  //
  // Auth: `view` or `manage` access to at least one requested node (an ASN-wide
  // grant, or a grant on the node's network or an ancestor network). Only the
  // nodes the caller may view are returned.
  //
  // Request (query parameters):
  // - `nodeIds` (required, repeated): `?nodeIds=a&nodeIds=b`.
  // - `includeLinks` (optional, default false): also return every link that has
  //   one of the requested nodes on either end. The node on the far end of such
  //   a link is then added to `nodes` as well, even if it was not requested.
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `node_ids`):
  //   `nodeIds` is empty.
  // - `shared.auth.permission_denied`: the caller may view none of the
  //   requested nodes.
  rpc GetNodesByIds                (Node.GetReq)                        returns (Node.List) {
    option (google.api.http) = {
      get: "/node"
    };
  }
  // List the nodes of a network as summaries.
  //
  // Returns one `Node.Info` per node directly under `networkId`, or, with
  // `includeSubnetwork=true`, under the network and all of its subnetworks
  // recursively. Sorted by node name; empty when there are no nodes.
  //
  // Auth: `view` or `manage` access to the network.
  //
  // Request (query parameters): `networkId` (required), `includeSubnetwork`
  // (optional, default false), and the optional filters `name`,
  // `nodeGroupId`, `services`, `needUpdate` (see `Node.ListReq`); a node is
  // returned only when it matches every filter given. `service` is ignored.
  //
  // Errors:
  // - `asn.network.not_found` when `networkId` does not exist.
  // - `shared.group.not_found` when `nodeGroupId` does not exist.
  rpc GetNodesOfNetwork           (Node.ListReq)                       returns (Node.Infos) {
    option (google.api.http) = {
      get: "/node/network"
    };
  }
  // List the member nodes of a node group as summaries.
  //
  // Sorted by node name; empty when the group has no members.
  //
  // Auth: `view` or `manage` access to the node group's network.
  //
  // Request (query parameter): `nodeGroupId` (required).
  //
  // Errors: `shared.group.not_found` when the node group does not exist.
  rpc GetNodesOfNodeGroup          (NodeGroup.Id)                       returns (Node.Infos) {
    option (google.api.http) = {
      get: "/node/group/nodes"
    };
  }
  // List the nodes of a network that are not in any node group of a service.
  //
  // Walks `networkId` and all of its subnetworks recursively and returns every
  // node that is not a member of any node group whose service equals
  // `service`. Use it to offer candidate members when building a node group.
  // It does not check whether the node has the service. Sorted by node name.
  //
  // Auth: `view` or `manage` access to the network.
  //
  // Request (query parameters): `networkId` (required), `service` (service name
  // of the node groups to exclude). `includeSubnetwork` is ignored; subnetworks
  // are always included.
  //
  // Errors: `asn.network.not_found` when `networkId` does not exist.
  rpc GetNodesWithoutNodeGroup     (Node.ListReq)                       returns (Node.Infos) {
    option (google.api.http) = {
      get: "/node/service"
    };
  }
  // Set a node's own configuration for one of its services.
  //
  // Stores `config` as the node-specific config of `serviceName` on the node,
  // overriding any node group config for that service. An empty `config`
  // clears the override so the node falls back to its node group's config.
  // The effective config is then pushed to the node in the background; the
  // call returns without waiting, and a node that is not connected receives
  // its config when it next registers.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId`, `serviceName`, `config` (YAML text). The service must
  // already be assigned to the node (see AddNodeService); this call never adds
  // a service to a node.
  //
  // Errors:
  // - `shared.request.param_invalid` (`errMeta.field` = `config`): `config` is
  //   not valid YAML.
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.service.not_found`: the service is not assigned to the node.
  rpc SetNodeServiceConfig         (Node.SetConfig)                     returns (Empty) {
    option (google.api.http) = {
      put: "/node/config"
      body: "*"
    };
  }
  // Create a node in the topology.
  //
  // Creates the node record only: nothing is installed and no script or token
  // is returned. The new node starts with runtime state `STATE_UNREGISTERED`
  // and install state `INSTALL_NOT_INSTALLED`. To put it on a host, call
  // GetNodeInstallScript (`POST /node/install`) with the returned `nodeId`.
  // `serviceNames` becomes the node's service set; the install script installs
  // these services. Later changes go through AddNodeService / RemoveNodeService.
  //
  // Auth: `manage` access to `parentNetworkId`.
  //
  // Request: see `Node.Create`. `parentNetworkId` and `type` (not
  // `TYPE_UNKNOWN`) are required; `name` must be unique within the parent's
  // root network tree.
  //
  // Response: the new node's ID.
  //
  // Errors:
  // - `asn.network.not_found`: `parentNetworkId` does not exist.
  // - `asn.node.type_not_supported`: `type` is `TYPE_UNKNOWN` or unknown.
  // - `asn.node.already_exists` (`errMeta.name`): a node with this name already
  //   exists in the root network tree.
  // - `shared.service.not_found` (`errMeta.service`): an entry of
  //   `serviceNames` is not a service known to this controller.
  // - `shared.request.param_invalid`: an interface has invalid or duplicate
  //   tags, or `location` is invalid (`errMeta.field` = `location`).
  rpc CreateNode                   (Node.Create)                        returns (Node.Id) {
    option (google.api.http) = {
      post: "/node"
      body: "*"
    };
  }
  // Update a node's topology attributes.
  //
  // Replaces `name`, `type`, `description`, `managed`, `location` and the IPMI,
  // management and device-info parts of the node's topology info with the
  // values in the request. This is a full replacement: omitted fields are
  // cleared. Interfaces are not changed here (use the `/node/interface`
  // endpoints) and services are not changed here (use AddNodeService /
  // RemoveNodeService). Nothing is pushed to the node.
  //
  // Auth: `manage` access to the node.
  //
  // Request: see `Node.Update`. `nodeId` and `type` (not `TYPE_UNKNOWN`) are
  // required.
  //
  // Errors:
  // - `asn.node.not_found`: the node does not exist.
  // - `asn.node.type_not_supported`: `type` is `TYPE_UNKNOWN` or unknown.
  // - `asn.node.already_exists` (`errMeta.name`): the new name is already used
  //   in the node's root network tree.
  // - `shared.request.param_invalid` (`errMeta.field` = `location`): invalid
  //   location.
  rpc UpdateNode                   (Node.Update)                        returns (Empty) {
    option (google.api.http) = {
      put: "/node"
      body: "*"
    };
  }
  // Delete a node and return an uninstall token for its host.
  //
  // Removes the node from the topology together with its links, its node group
  // memberships and its credential (bound certificate, candidate certificates
  // and every install token), drops its live session and tells the node to
  // unregister. This takes effect immediately; it does not wait for the host.
  //
  // If the node held a credential (install state `INSTALL_PENDING` or
  // `INSTALL_INSTALLED`), the response carries an uninstall token
  // (`KIND_UNINSTALL`). Its script removes every service package, `asnsn` and
  // the node credential from the host; running it is optional because the
  // controller record is already gone. The token keeps working after the node
  // is deleted, until `expiresAt`. If the node never held a credential, `token`
  // is empty and there is nothing to run.
  //
  // Auth: `manage` access to the node.
  //
  // Request (query parameter): `nodeId` (required).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `node_id`).
  // - `asn.node.not_found`: the node does not exist.
  rpc DeleteNode                   (Node.Id)                            returns (Node.Script) {
    option (google.api.http) = {
      delete: "/node"
    };
  }
  // Add config ops for one service on a node.
  //
  // Each entry of `opParams` becomes a new config op with a server-generated
  // UUID `id`. The ops are stored on the node and then sent to the node; the
  // call waits for the node's reply or for the service's timeout (the
  // service's `timeout` setting in seconds, default 10). Stored ops are also
  // re-sent whenever the node reconnects. If the service is not yet on the
  // node's service set, an entry for it is created.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId`, `serviceName`, `opParams` (required, non-empty; one op
  // parameter string per new op). `opId` is ignored.
  //
  // Response: one `Ops.Response` for the node. `frameworkErr` is
  // `shared.service.unreachable` when the node is not connected, or
  // `shared.service.timeout` when it did not answer in time; the ops stay
  // stored in both cases.
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `op_params`).
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.service.not_found`: `serviceName` is not a service known to this
  //   controller.
  rpc AddNodeConfigOps             (Node.SetConfigOp)                   returns (Ops.Responses) {
    option (google.api.http) = {
      post: "/node/config_op"
      body: "*"
    };
  }
  // Change the parameter of one config op on a node.
  //
  // Replaces the parameter of the node's config op `opId` for `serviceName`
  // with `opParams[0]`, stores it, and sends the update to the node, waiting
  // for its reply or the service's timeout as in AddNodeConfigOps. Only the
  // node's own ops (`customizeConfig` = true) can be changed here; ops
  // inherited from a node group are changed with UpdateNodeGroupConfigOp.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId`, `serviceName`, `opId` (the op's `id`), `opParams`
  // (required; only the first element is used).
  //
  // Response: one `Ops.Response` for the node (see AddNodeConfigOps).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `op_params`).
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.service.not_found`: the service is unknown to this controller or
  //   not on the node.
  // - `shared.resource.not_found` (`errMeta.field` = `op_id`, `errMeta.id`):
  //   the node has no op with this `opId` for the service.
  rpc UpdateNodeConfigOp           (Node.SetConfigOp)                   returns (Ops.Responses) {
    option (google.api.http) = {
      put: "/node/config_op"
      body: "*"
    };
  }
  // Remove config ops for one service from a node.
  //
  // Deletes the node's own config ops whose IDs are listed in `opParams`,
  // stores the result, and sends the removal to the node, waiting for its
  // reply or the service's timeout as in AddNodeConfigOps. IDs that do not
  // match an op are ignored.
  //
  // Auth: `manage` access to the node.
  //
  // Request (query parameters): `nodeId`, `serviceName`, `opParams` (required,
  // repeated; the config op IDs to remove), e.g.
  // `?nodeId=n1&serviceName=svc&opParams=id1&opParams=id2`.
  //
  // Response: one `Ops.Response` for the node (see AddNodeConfigOps).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `op_params`).
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.service.not_found`: `serviceName` is not a service known to this
  //   controller.
  rpc RemoveNodeConfigOps          (Node.SetConfigOp)                   returns (Ops.Responses) {
    option (google.api.http) = {
      delete: "/node/config_op"
    };
  }
  // Add a network interface to a node's topology info.
  //
  // Topology only; nothing is pushed to the node.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId` and `interface` (required). The new interface's name is
  // `interface.name`; the top-level `name` is ignored.
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `interface`).
  // - `shared.request.param_invalid`: `interface.tags` has an unknown or
  //   duplicate tag.
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.resource.already_exists`: the node already has an interface with
  //   this name.
  rpc AddNodeInterface             (Node.NodeInfo.OperateInterface)     returns (Empty) {
    option (google.api.http) = {
      post: "/node/interface"
      body: "*"
    };
  }
  // Replace or rename a network interface of a node.
  //
  // Replaces the interface currently named `name` with `interface`. When
  // `interface.name` differs from `name` the interface is renamed, and every
  // link attached to the old interface name is updated to the new name.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId`, `name` (current interface name), `interface` (required,
  // the new value including its name).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `interface`).
  // - `shared.request.param_invalid`: `interface.tags` has an unknown or
  //   duplicate tag.
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.resource.not_found`: the node has no interface named `name`.
  // - `shared.resource.already_exists`: renaming onto a name already used by
  //   another interface of the node.
  rpc UpdateNodeInterface          (Node.NodeInfo.OperateInterface)     returns (Empty) {
    option (google.api.http) = {
      put: "/node/interface"
      body: "*"
    };
  }
  // Remove a network interface from a node.
  //
  // Also deletes every link attached to that interface of the node.
  //
  // Auth: `manage` access to the node.
  //
  // Request (query parameters): `nodeId`, `name` (the interface name).
  // `interface` is ignored.
  //
  // Errors:
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.resource.not_found`: the node has no interface named `name`.
  rpc RemoveNodeInterface          (Node.NodeInfo.OperateInterface)     returns (Empty) {
    option (google.api.http) = {
      delete: "/node/interface"
    };
  }

  // Node Lifecycle API. Every call returning Node.Script hands out a token for
  // the public GET /enrollment/script?token= endpoint (curl ... | sudo bash);
  // an empty token means there is nothing to run on the host.
  // See workflow/design/NodeEnrollment.md.

  // Get an install token for a node (install or upgrade).
  //
  // Issues a new install token (`KIND_INSTALL`) for the node. The script it
  // stands for installs, or upgrades, `asnsn` and every service of the node to
  // this controller's versions, places a node certificate on a host that has
  // none yet, and (re)starts `asnsn`, which then registers with the
  // controller. Install and upgrade are the same call and the same script:
  // use it for "Install" (`INSTALL_NOT_INSTALLED`), to show the script again
  // (`INSTALL_PENDING`), and for "Upgrade" (`INSTALL_INSTALLED` with
  // `needUpdate`). It is allowed in every state, changes nothing on the node
  // record, and does not invalidate earlier tokens.
  //
  // Frontend flow:
  // 1. CreateNode (`POST /node`) once, then call this with the `nodeId`.
  // 2. Show the operator the one-liner to run on the host as root:
  //    `curl -fsSL https://<controller>/api/v1/enrollment/script?token=<token> | sudo bash`
  //    (`/api/v1` is the API base path of the deployment). The script endpoint
  //    is public: the token is the only credential. It returns the shell
  //    script as `text/x-shellscript` with HTTP 200, or HTTP 400 with a
  //    plain-text `node script unavailable: <error>` body when the token is
  //    invalid or expired, so `curl -f` aborts.
  // 3. The token is reusable until `expiresAt` (controller setting
  //    `servicenode.enrollment.token_ttl`, default 300 seconds). Each fetch of
  //    the script signs a new candidate certificate, so a node that is not yet
  //    installed shows `INSTALL_PENDING`; fetches are capped per node
  //    (`servicenode.enrollment.max_pending_certs`, default 16, live
  //    candidates), after which the endpoint fails until candidates are used
  //    or expire. A candidate must register within the claim window
  //    (`servicenode.enrollment.claim_window`, default 3600 seconds).
  // 4. The first host that registers with one of the candidates binds the node
  //    (`INSTALL_INSTALLED`); every other candidate can no longer claim it.
  //    Poll GetNodesByIds to observe `installState` and `serviceNode.state`.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId` (required).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `node_id`).
  // - `asn.node.not_found`: the node does not exist.
  rpc GetNodeInstallScript         (Node.Id)                            returns (Node.Script) {
    option (google.api.http) = {
      post: "/node/install"
      body: "*"
    };
  }
  // Uninstall a node from its host but keep it in the topology.
  //
  // Revokes the node's credential (bound certificate, candidate certificates
  // and every install token), drops its live session and marks it
  // `STATE_OFFLINE`. The node record (topology, services, configuration) is
  // kept, so the node can be installed again later on this or another host
  // with GetNodeInstallScript. This is also how a machine is replaced:
  // UninstallNode, then GetNodeInstallScript for the new host.
  //
  // If the node held a credential, the response carries an uninstall token
  // (`KIND_UNINSTALL`) whose script removes every service package, `asnsn` and
  // the node credential from the host. Running it is optional; the controller
  // side has already changed. If the node held no credential, `token` is
  // empty and there is nothing to run.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId` (required).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `node_id`).
  // - `asn.node.not_found`: the node does not exist.
  rpc UninstallNode                (Node.Id)                            returns (Node.Script) {
    option (google.api.http) = {
      post: "/node/uninstall"
      body: "*"
    };
  }
  // Add a service to a node.
  //
  // Adds `serviceName` to the node's service set. A connected node is told to
  // load it at once; a node that is not connected loads it when it next
  // registers. Adding a service the node already has changes nothing.
  //
  // A node whose `serviceNode.capabilities` include `task` changes the host
  // remotely: the service is recorded without telling the node, and an
  // `install` node task installs its package and restarts `asnsn`, which loads
  // it. **`asnsn` and every service on the node restart.** The response
  // carries `taskId` when the task was sent at once, or `taskPending` with
  // `pendingReason` (`offline`, `maintenance`, `busy`) when it is queued; the
  // queued task is sent when the node can take it, and its result appears as
  // `serviceNode.lastTask`. A node in Maintenance keeps the install queued
  // until it is admitted normally. When the node already reports the service
  // at the version this controller serves, nothing is installed and none of
  // `taskId`, `taskPending`, `token` is set. Adding a service again whose
  // package is missing or older queues a new install.
  //
  // Any other node: if it holds a credential (`INSTALL_PENDING` or
  // `INSTALL_INSTALLED`), the response carries a new install token
  // (`KIND_INSTALL`): running the install script again installs the new
  // service package on the host and skips what is already installed.
  // Otherwise `token` is empty and the next install script will include the
  // service.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId`, `serviceName` (both required).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `node_id` or
  //   `service_name`).
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.service.not_found`: the service is not known to this controller.
  // - `shared.request.param_invalid`: the service has no install package
  //   configured on the controller.
  rpc AddNodeService               (Node.ServiceReq)                    returns (Node.Script) {
    option (google.api.http) = {
      post: "/node/service/add"
      body: "*"
    };
  }
  // Remove a service from a node.
  //
  // Removes `serviceName` from the node's service set; a connected node is
  // told to unload it at once, a disconnected one unloads it when it next
  // registers. The node keeps `asnsn` and its credential even when this was
  // its last service.
  //
  // A node whose `serviceNode.capabilities` include `task` changes the host
  // remotely: an `uninstall` node task purges the service's package and
  // restarts `asnsn`. **`asnsn` and every service on the node restart; on a
  // node in Maintenance, or in Maintenance when the task runs, the other
  // services stay stopped until the node leaves Maintenance.** The response
  // carries `taskId` or `taskPending` with `pendingReason`, as for
  // AddNodeService; the task runs in Maintenance too. A service no longer on
  // the node is accepted when the controller knows its package, so a failed
  // purge can be repeated.
  //
  // Any other node: if it holds a credential, the response carries an
  // uninstall token (`KIND_UNINSTALL`) whose script purges that service's
  // package from the host and restarts `asnsn`. Running it is optional.
  // Otherwise `token` is empty.
  //
  // Auth: `manage` access to the node.
  //
  // Request: `nodeId`, `serviceName` (both required).
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` = `node_id` or
  //   `service_name`).
  // - `asn.node.not_found`: the node does not exist.
  // - `shared.auth.permission_denied` (reason "service is not eligible for this
  //   node"): the service is not on the node (a node without the `task`
  //   capability).
  // - `shared.request.param_invalid`: the service has no install package
  //   configured on the controller; nothing is removed.
  rpc RemoveNodeService            (Node.ServiceReq)                    returns (Node.Script) {
    option (google.api.http) = {
      post: "/node/service/remove"
      body: "*"
    };
  }
  // Render the script a lifecycle token stands for (token-authenticated).
  //
  // Not a JSON endpoint. It is served by the hand-written public
  // `GET /enrollment/script?token=<token>` route, which needs no session: the
  // token is the credential. That route returns `content` as the raw body
  // with HTTP 200 and `Content-Type: text/x-shellscript`, or HTTP 400 with a
  // plain-text body `node script unavailable: <error>` on any failure.
  //
  // An install token renders the node's full install/upgrade script and, on
  // every fetch, signs a new candidate certificate for the node (see
  // GetNodeInstallScript). An uninstall token renders the uninstall script
  // captured when the token was issued. Tokens are not consumed.
  //
  // Errors:
  // - `shared.auth.unauthenticated` ("invalid or expired enrollment token"):
  //   the token is empty, unknown, expired, was issued by a service rather
  //   than by these lifecycle calls, or is an install token whose node was
  //   uninstalled or deleted.
  // - `shared.resource.limit_reached`: the node already has the maximum number
  //   of unregistered candidate certificates.
  rpc FetchNodeScript              (Node.ScriptReq)                     returns (Node.ScriptContent);
  // Run a node task on nodes.
  //
  // Sends the controller's task `task` to each node and returns once it is
  // sent; it does not wait for the outcome. The node runs the task's script as
  // a systemd unit outside asnsn and reports the result, which appears as
  // `serviceNode.lastTask` of the node. One task runs per node at a time.
  // Tasks:
  // - `probe`: reports the host environment and changes nothing; runs on a
  //   node in Maintenance too.
  // - `upgrade`: see UpgradeNodes.
  //
  // Auth: `manage` access to every node.
  //
  // Request: `nodeIds` (required, at least one), `task` (required).
  //
  // Response: one result per node, with the sent `taskId`, or `error` naming
  // why the task was not sent:
  // - `asn.node.not_found`: the node does not exist.
  // - `asn.node.task_unsupported`: the node did not register the task
  //   capability (built before node tasks, or not running under systemd), or
  //   the task does not run in the node's Maintenance kind.
  // - `asn.node.connect_failed`: the node is not connected.
  // - `asn.node.task_in_progress`: another task is in flight on the node.
  // - `asn.node.up_to_date`: nothing to change (`upgrade`).
  // - `shared.resource.limit_reached`: the controller's limit of nodes with a
  //   task in flight (`servicenode.task.max_concurrent`) is reached.
  // - `shared.request.param_invalid`: unknown task.
  // The list is not exhaustive: each node is authorized on its own, so an
  // auth error (`shared.auth.*`) of the caller or of that node appears as its
  // `error`, and so may an internal error (`shared.system.*`).
  rpc RunNodeTask                 (Node.TaskRun)                       returns (Node.TaskRunResult) {
    option (google.api.http) = {
      post: "/node/task/run"
      body: "*"
    };
  }
  // Upgrade nodes to this controller's versions.
  //
  // The same as RunNodeTask with `task` = `upgrade`. On each node the task
  // upgrades `asnsn` and every service recorded on the node that the node
  // reports to the versions this controller serves, from the configured APT
  // sources, in one apt transaction that never removes a package. The node
  // restarts `asnsn`, and so every service on it, and registers again on the
  // new versions; on success it leaves Maintenance. A recorded service the
  // node does not report is skipped. The task's result
  // appears as `serviceNode.lastTask`; a failure before `asnsn` is stopped
  // restores the APT sources and leaves the node as it was.
  //
  // Runs on a node in the normal state or below the controller's version
  // window; a node above the window is refused with
  // `asn.node.task_unsupported`.
  //
  // Auth: `manage` access to every node.
  //
  // Request: `nodeIds` (required, at least one).
  //
  // Response: as RunNodeTask.
  rpc UpgradeNodes                 (Node.UpgradeReq)                    returns (Node.TaskRunResult) {
    option (google.api.http) = {
      post: "/node/upgrade"
      body: "*"
    };
  }
  // Turn the auto-upgrade switch of nodes on or off.
  //
  // With the switch on, whenever the node is admitted normally (inside the
  // version window `servicenode.minimum_version` to `maximum_version`,
  // whatever its line) and `asnsn` or a service deb on it is older than this
  // controller serves, the controller upgrades the whole node (as
  // UpgradeNodes): `asnsn` and every service on it restart. One attempt is
  // made per target version set; after a failure the node is held
  // (`serviceNode.autoUpgradeHeld`) until the target changes or the switch is
  // turned off and on again. Setting the value a node already has changes
  // nothing. A node in Maintenance, outside the window, is never upgraded
  // automatically. The switch belongs to the node:
  // any service on the node may change it too, and every service on the node
  // is told.
  //
  // Auth: `manage` access to every node.
  //
  // Request: `nodeIds` (required, at least one), `enabled`.
  //
  // Response: one result per node, in request order, with `error` naming why
  // the switch was not set:
  // - `asn.node.not_found`: the node does not exist.
  // - `asn.node.task_unsupported`: turning it on for a node that did not
  //   register the task capability.
  // - `shared.auth.permission_denied`: no `manage` access to the node.
  rpc SetNodeAutoUpgrade           (Node.AutoUpgradeReq)                returns (Node.AutoUpgradeResult) {
    option (google.api.http) = {
      post: "/node/auto-upgrade"
      body: "*"
    };
  }

  // Node Group API

  // Get node groups by ID.
  //
  // Returns the node groups among `nodeGroupIds` that the caller may view.
  // IDs that do not exist are skipped.
  //
  // Auth: `view` or `manage` access to at least one requested group's network.
  //
  // Request (query parameters): `nodeGroupIds` (required, repeated), e.g.
  // `?nodeGroupIds=a&nodeGroupIds=b`.
  //
  // Errors:
  // - `shared.request.required_field_missing` (`errMeta.field` =
  //   `node_group_ids`).
  // - `shared.auth.permission_denied`: the caller may view none of them.
  rpc GetNodeGroupsByIds          (NodeGroup.Ids)             returns (NodeGroup.List) {
    option (google.api.http) = {
      get: "/node/group"
    };
  }
  // List the node group IDs of a service in a network.
  //
  // Returns the IDs of the node groups whose service equals `service` and
  // whose network is `networkId` or one of its subnetworks (recursively). The
  // list is empty when none match; since every node group has a service, an
  // empty `service` matches nothing. Fetch details with GetNodeGroupsByIds.
  //
  // Auth: `view` or `manage` access to the network.
  //
  // Request (query parameters): `networkId` (required), `service`.
  //
  // Errors: `asn.network.not_found` when `networkId` does not exist.
  rpc ListNodeGroups              (NodeGroup.ListReq)         returns (NodeGroup.Ids) {
    option (google.api.http) = {
      get: "/node/group/list"
    };
  }
  // Create a node group for one service.
  //
  // A node group shares one service config (and config ops) across its member
  // nodes. A member node uses the group config for that service unless it has
  // its own config (SetNodeServiceConfig). After the group is stored, the
  // effective config is pushed to the member nodes in the background; the call
  // does not wait. The response does not carry the new group's ID; find it
  // with ListNodeGroups.
  //
  // Auth: `manage` access to `networkId`.
  //
  // Request: `name` (required), `networkId` (required), `service` (required, a
  // service known to this controller), `remark`, `nodes` (member node IDs),
  // `config` (YAML text; may be empty). A node can be in at most one node
  // group per service.
  //
  // Errors:
  // - `asn.network.not_found`: `networkId` does not exist.
  // - `shared.service.not_found`: `service` is unknown.
  // - `shared.request.required_field_missing` (`errMeta.field` = `name`).
  // - `shared.request.param_invalid` (`errMeta.field` = `config`): `config` is
  //   not valid YAML.
  // - `asn.node.not_found` (`errMeta.id` = comma-separated missing IDs): a
  //   member node does not exist.
  // - `asn.group.service_conflict`: a member node is already in another node
  //   group of the same service.
  rpc CreateNodeGroup             (NodeGroup.Create)          returns (Empty) {
    option (google.api.http) = {
      post: "/node/group"
      body: "*"
    };
  }
  // Update a node group.
  //
  // Replaces `name`, `remark`, `nodes` and `config` with the request values
  // (full replacement; the service cannot be changed). The effective config is
  // then pushed in the background to every node that was or now is a member.
  //
  // Auth: `manage` access to the node group's network.
  //
  // Request: `nodeGroupId` (required), `name` (required), `remark`, `nodes`,
  // `config` (YAML text; may be empty).
  //
  // Errors:
  // - `shared.group.not_found`: the node group does not exist.
  // - `shared.request.required_field_missing` (`errMeta.field` = `name`).
  // - `shared.request.param_invalid` (`errMeta.field` = `config`): invalid YAML.
  // - `asn.node.not_found`: a member node does not exist.
  // - `asn.group.service_conflict`: a member node is in another node group of
  //   the same service.
  rpc UpdateNodeGroup             (NodeGroup.Update)          returns (Empty) {
    option (google.api.http) = {
      put: "/node/group"
      body: "*"
    };
  }
  // Delete a node group.
  //
  // The former members fall back to their own config for the group's service;
  // the new effective config is pushed to them in the background.
  //
  // Auth: `manage` access to the node group's network.
  //
  // Request (query parameter): `nodeGroupId` (required).
  //
  // Errors: `shared.group.not_found` when the node group does not exist.
  rpc DeleteNodeGroup             (NodeGroup.Id)              returns (Empty) {
    option (google.api.http) = {
      delete: "/node/group"
    };
  }
  // Add config ops to a node group.
  //
  // Each entry of `opParams` becomes a new group config op with a
  // server-generated UUID `id`. The ops are stored on the group and sent to
  // every member node for the group's service; the call waits until every
  // member has replied or the service's timeout (seconds, default 10) has
  // passed. Stored ops are re-sent to a member whenever it reconnects.
  //
  // Auth: `manage` access to the node group's network.
  //
  // Request: `nodeGroupId`, `opParams` (required, non-empty). `opId` is
  // ignored.
  //
  // Response: one `Ops.Response` per member node. `frameworkErr` is
  // `shared.service.unreachable` for a member that is not connected and
  // `shared.service.timeout` for one that did not answer in time. A group
  // without members returns an empty list immediately.
  //
  // Errors:
  // - `shared.group.not_found`: the node group does not exist.
  // - `shared.request.required_field_missing` (`errMeta.field` = `op_params`).
  rpc AddNodeGroupConfigOps       (NodeGroup.SetConfigOp)     returns (Ops.Responses) {
    option (google.api.http) = {
      post: "/node/group/config_op"
      body: "*"
    };
  }
  // Change the parameter of one config op of a node group.
  //
  // Replaces the parameter of group config op `opId` with `opParams[0]`,
  // stores it, and sends the update to every member node, waiting as in
  // AddNodeGroupConfigOps.
  //
  // Auth: `manage` access to the node group's network.
  //
  // Request: `nodeGroupId`, `opId`, `opParams` (required; only the first
  // element is used).
  //
  // Response: one `Ops.Response` per member node (see AddNodeGroupConfigOps).
  //
  // Errors:
  // - `shared.group.not_found`: the node group does not exist.
  // - `shared.request.required_field_missing` (`errMeta.field` = `op_params`).
  // - `shared.resource.not_found` (`errMeta.field` = `op_id`, `errMeta.id`):
  //   the group has no op with this `opId`.
  rpc UpdateNodeGroupConfigOp     (NodeGroup.SetConfigOp)     returns (Ops.Responses) {
    option (google.api.http) = {
      put: "/node/group/config_op"
      body: "*"
    };
  }
  // Remove config ops from a node group.
  //
  // Deletes the group config ops whose IDs are listed in `opParams`, stores the
  // result, and sends the removal to every member node, waiting as in
  // AddNodeGroupConfigOps. IDs that do not match an op are ignored.
  //
  // Auth: `manage` access to the node group's network.
  //
  // Request (query parameters): `nodeGroupId`, `opParams` (required, repeated;
  // config op IDs), e.g. `?nodeGroupId=g1&opParams=id1&opParams=id2`.
  //
  // Response: one `Ops.Response` per member node (see AddNodeGroupConfigOps).
  //
  // Errors:
  // - `shared.group.not_found`: the node group does not exist.
  // - `shared.request.required_field_missing` (`errMeta.field` = `op_params`).
  rpc RemoveNodeGroupConfigOps    (NodeGroup.SetConfigOp)     returns (Ops.Responses) {
    option (google.api.http) = {
      delete: "/node/group/config_op"
    };
  }

  // --- Link API ---

  // List the links attached to a node.
  //
  // Returns every node-to-node link that has the given node at either end. Each
  // link is reported as stored: the queried node may be the `from` or the `to`
  // end. `fromName`/`toName` carry the node names; `fromNode`/`toNode` are
  // always `true` here. Links come only from manual creation (`CreateLink`) or
  // a topology file import; the controller does not discover links itself.
  //
  // Auth: requires `view` or `manage` access to the node's network.
  //
  // Request: `GET /link/node?nodeId=<id>`; `nodeId` is required.
  //
  // Response: links sorted by `linkId`; the list is empty when the node has no
  // links.
  //
  // Errors: `asn.node.not_found` when the node does not exist;
  // `shared.auth.permission_denied` when the caller lacks access.
  rpc GetLinksOfNode    (Node.Id)      returns (Link.List) {
    option (google.api.http) = {
      get: "/link/node"
    };
  }
  // Create a manual link between two nodes.
  //
  // Persists a new link between `fromNodeId` and `toNodeId` and assigns it a
  // UUID `linkId` (not returned; read it back with `GetLinksOfNode`,
  // `GET /link/node`). At most one link may exist between a pair of nodes, in
  // either direction. This only records topology; nothing is pushed to nodes.
  //
  // Auth: requires `manage` access to the network of both nodes.
  //
  // Request: `fromNodeId` and `toNodeId` are required and must differ and
  // belong to the same root network. `fromInterface`/`toInterface` are
  // optional; when set they must name an existing interface of that node.
  // `bandwidth` and `description` are optional.
  //
  // Errors: `asn.node.not_found` when either node does not exist;
  // `shared.request.param_invalid` when both ends are the same node, the nodes
  // are under different root networks, or an interface is not found on its
  // node; `asn.link.exists` when the two nodes are already linked;
  // `shared.auth.permission_denied` when the caller lacks access.
  rpc CreateLink        (Link.Create)  returns (Empty) {
    option (google.api.http) = {
      post: "/link"
      body: "*"
    };
  }
  // Update a link's interfaces, bandwidth and description.
  //
  // Replaces the stored interfaces, `bandwidth` and `description` with the
  // request values (full replacement: omitted fields are stored as empty/0).
  // The two end nodes cannot change: `fromNodeId`/`toNodeId` must be the
  // link's existing node pair, in either order; the order given is stored.
  //
  // Auth: requires `manage` access to the network (or an ancestor) of either
  // end node, or system-wide `manage` access.
  //
  // Request: `linkId`, `fromNodeId` and `toNodeId` are required. Interfaces,
  // when set, must exist on their node.
  //
  // Errors: `asn.link.not_found` when the link does not exist;
  // `shared.request.param_invalid` when the node pair differs from the link's
  // or an interface is not found; `asn.node.not_found` when a node no longer
  // exists; `shared.auth.permission_denied` when the caller lacks access.
  rpc UpdateLink        (Link.Update)  returns (Empty) {
    option (google.api.http) = {
      put: "/link"
      body: "*"
    };
  }
  // Delete a link.
  //
  // Removes the link from the topology. Links are also removed automatically
  // when one of their nodes is deleted or when the interface they use is
  // deleted from a node.
  //
  // Auth: requires `manage` access to the network (or an ancestor) of either
  // end node, or system-wide `manage` access.
  //
  // Request: `DELETE /link?linkId=<id>`; `linkId` is required.
  //
  // Errors: `asn.link.not_found` when the link does not exist;
  // `shared.auth.permission_denied` when the caller lacks access.
  rpc DeleteLink        (Link.Id)      returns (Empty) {
    option (google.api.http) = {
      delete: "/link"
    };
  }

  // --- Service API: Service Names ---

  // List all services known to the controller.
  //
  // Returns the names of all service plugins loaded on the controller,
  // optionally preceded by the framework itself (`asn`). Order is not
  // guaranteed.
  //
  // Auth: any authenticated caller; no network permission is checked.
  //
  // Request: `GET /service?includeAsn=true`; `includeAsn` is optional
  // (default `false`).
  rpc GetAllServices          (IncludeAsn)    returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service"
    };
  }
  // List the services present on nodes of a network.
  //
  // Returns the distinct names of services that are in the install set of at
  // least one node in the network or any of its subnetworks, restricted to
  // services loaded on the controller. Order is not guaranteed; the list is
  // empty when no node has a service.
  //
  // Auth: requires `view` or `manage` access to the network.
  //
  // Request: `GET /service/network?networkId=<id>`; `networkId` is required.
  //
  // Errors: `asn.network.not_found` when the network does not exist.
  rpc GetServicesOfNetwork    (Network.Id)    returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service/network"
    };
  }
  // List the services present on the member nodes of a node group.
  //
  // Returns the distinct names of services in the install set of at least one
  // member node of the group, restricted to services loaded on the controller.
  // Note that this is not just the group's own `serviceName`. Order is not
  // guaranteed.
  //
  // Auth: requires `view` or `manage` access to the group's network.
  //
  // Request: `GET /service/group?nodeGroupId=<id>`; `nodeGroupId` is required.
  //
  // Errors: `shared.group.not_found` when the group does not exist.
  rpc GetServicesOfNodeGroup  (NodeGroup.Id)  returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service/group"
    };
  }
  // List the services installed on a node.
  //
  // Returns the names in the node's install set that are also loaded on the
  // controller. Order is not guaranteed.
  //
  // Auth: requires `view` or `manage` access to the node's network.
  //
  // Request: `GET /service/node?nodeId=<id>`; `nodeId` is required.
  //
  // Errors: `asn.node.not_found` when the node does not exist.
  rpc GetServicesOfNode       (Node.Id)       returns (Node.Service.Names) {
    option (google.api.http) = {
      get: "/service/node"
    };
  }

  // --- Service API: Start ---

  // Start a service on every node of a network and its subnetworks.
  //
  // Asynchronous: the controller sends a start command, carrying the service
  // config, to every node under the network (recursively) and returns
  // immediately. Delivery failures (e.g. offline nodes) are only logged, and
  // the result of the start is not returned; watch the nodes' service states
  // instead. The config sent to a node is its own service config for this
  // service, or, when that is empty, the config of the node group for this
  // service that contains the node.
  //
  // Auth: requires `manage` access to the network.
  //
  // Request: `id` (network ID) and `serviceName` are required. The service
  // name is not validated.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `asn.network.not_found` when the network does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc StartServiceOnNetwork   (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/start/network"
      body: "*"
    };
  }
  // Start a service on every member node of a node group.
  //
  // Asynchronous, like `StartServiceOnNetwork`. Only applies when the
  // group's `serviceName` equals the requested `serviceName`; otherwise no
  // node is targeted and the call still succeeds. Each node receives its own
  // service config, falling back to the group's `config`.
  //
  // Auth: requires `manage` access to the group's network.
  //
  // Request: `id` (node group ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `shared.group.not_found` when the group does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc StartServiceOnNodeGroup (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/start/node/group"
      body: "*"
    };
  }
  // Start a service on a single node.
  //
  // Asynchronous, like `StartServiceOnNetwork`. The node receives its own
  // service config, falling back to the config of its node group for this
  // service.
  //
  // Auth: requires `manage` access to the node's network.
  //
  // Request: `id` (node ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `asn.node.not_found` when the node does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc StartServiceOnNode      (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/start/node"
      body: "*"
    };
  }

  // --- Service API: Stop ---

  // Stop a service on every node of a network and its subnetworks.
  //
  // Asynchronous: the controller sends a stop command to every node under the
  // network (recursively) and returns immediately. Delivery failures are only
  // logged and the stop result is not returned; watch the nodes' service
  // states instead. Nodes that do not run the service ignore the command.
  //
  // Auth: requires `manage` access to the network.
  //
  // Request: `id` (network ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `asn.network.not_found` when the network does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc StopServiceOnNetwork    (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/stop/network"
      body: "*"
    };
  }
  // Stop a service on every member node of a node group.
  //
  // Asynchronous, like `StopServiceOnNetwork`. Only applies when the group's
  // service equals the requested `serviceName`; otherwise no node is targeted
  // and the call still succeeds.
  //
  // Auth: requires `manage` access to the group's network.
  //
  // Request: `id` (node group ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `shared.group.not_found` when the group does not
  // exist; `asn.node.not_found` when a member node no longer exists;
  // `shared.auth.permission_denied` when the caller lacks access.
  rpc StopServiceOnNodeGroup  (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/stop/node/group"
      body: "*"
    };
  }
  // Stop a service on a single node.
  //
  // Asynchronous, like `StopServiceOnNetwork`.
  //
  // Auth: requires `manage` access to the node's network.
  //
  // Request: `id` (node ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `asn.node.not_found` when the node does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc StopServiceOnNode       (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/stop/node"
      body: "*"
    };
  }

  // --- Service API: Reset ---

  // Reset a service on every node of a network and its subnetworks.
  //
  // Asynchronous: the controller sends a reset command to every node under the
  // network (recursively) and returns immediately. A node that has the
  // service loaded unloads and reloads the service plugin, keeping its
  // auto-start/auto-stop policy; nodes without the service ignore it.
  // Delivery failures are only logged and the result is not returned.
  //
  // Auth: requires `manage` access to the network.
  //
  // Request: `id` (network ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `asn.network.not_found` when the network does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc ResetServiceOnNetwork   (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/reset/network"
      body: "*"
    };
  }
  // Reset a service on every member node of a node group.
  //
  // Asynchronous, like `ResetServiceOnNetwork`. Only applies when the group's
  // service equals the requested `serviceName`; otherwise no node is targeted
  // and the call still succeeds.
  //
  // Auth: requires `manage` access to the group's network.
  //
  // Request: `id` (node group ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `shared.group.not_found` when the group does not
  // exist; `asn.node.not_found` when a member node no longer exists;
  // `shared.auth.permission_denied` when the caller lacks access.
  rpc ResetServiceOnNodeGroup (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/reset/node/group"
      body: "*"
    };
  }
  // Reset a service on a single node.
  //
  // Asynchronous, like `ResetServiceOnNetwork`.
  //
  // Auth: requires `manage` access to the node's network.
  //
  // Request: `id` (node ID) and `serviceName` are required.
  //
  // Errors: `shared.request.required_field_missing` when `id` or
  // `serviceName` is empty; `asn.node.not_found` when the node does not
  // exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc ResetServiceOnNode      (Ops.GeneralReq) returns (Empty) {
    option (google.api.http) = {
      post: "/service/reset/node"
      body: "*"
    };
  }

  // --- Service API: Apply Ops (gRPC only) ---

  // Run a service command on every node of a network and its subnetworks.
  //
  // gRPC-only: not exposed over REST. Sends `command` and `params` to the
  // service on every node under the network (recursively) and waits for the
  // replies. The call returns when every node has replied or after the
  // service's configured timeout; nodes that did not reply by then get a
  // response with `frameworkErr` starting with `shared.service.timeout`, and
  // nodes that could not be reached get `shared.service.unreachable`. When
  // the scope has no nodes, the call returns an empty list immediately.
  //
  // Auth: requires `manage` access to the network.
  //
  // Request: `id` (network ID), `serviceName` and `command` are required;
  // `params` is optional.
  //
  // Errors: `shared.request.required_field_missing` when `id`, `serviceName`
  // or `command` is empty; `shared.service.not_found` when the service is not
  // loaded on the controller; `asn.network.not_found` when the network does
  // not exist; `shared.auth.permission_denied` when the caller lacks access.
  rpc ApplyServiceOpsOnNetwork    (Ops.Request) returns (Ops.Responses);
  // Run a service command on every member node of a node group.
  //
  // gRPC-only: not exposed over REST. Same behavior as
  // `ApplyServiceOpsOnNetwork`, targeting all member nodes of the group
  // (whatever the group's own `serviceName` is).
  //
  // Auth: requires `manage` access to the group's network.
  //
  // Request: `id` (node group ID), `serviceName` and `command` are required.
  //
  // Errors: as `ApplyServiceOpsOnNetwork`, with `shared.group.not_found` when
  // the group does not exist and `asn.node.not_found` when a member node no
  // longer exists.
  rpc ApplyServiceOpsOnNodeGroup  (Ops.Request) returns (Ops.Responses);
  // Run a service command on a single node.
  //
  // gRPC-only: not exposed over REST. Same behavior as
  // `ApplyServiceOpsOnNetwork`, targeting one node.
  //
  // Auth: requires `manage` access to the node's network.
  //
  // Request: `id` (node ID), `serviceName` and `command` are required.
  //
  // Errors: as `ApplyServiceOpsOnNetwork`, with `asn.node.not_found` when the
  // node does not exist.
  rpc ApplyServiceOpsOnNode       (Ops.Request) returns (Ops.Responses);

  // --- Stats ---

  // Get node, link and node group counts of a network.
  //
  // Counts cover the network and all its subnetworks: `numberOfNodes` is the
  // number of nodes; `numberOfLinks` counts each link between two nodes in
  // scope once plus each link from a node in scope to a node outside it;
  // `numberOfNodeGroups` counts the node groups (of any service) with at least
  // one member node in scope.
  //
  // Auth: requires `view` or `manage` access to the network.
  //
  // Request: `GET /network/stats?networkId=<id>`; `networkId` is required.
  //
  // Errors: `asn.network.not_found` when the network does not exist.
  rpc GetStatsOfNetwork   (Network.Id)                returns (Network.Stats) {
    option (google.api.http) = {
      get: "/network/stats"
    };
  }
  // Get node counts by state and by type for a network.
  //
  // Covers the network and all its subnetworks. `states` lists every node
  // state with its count and `types` lists every node type known to the
  // framework with its count, including entries with count 0. List order is
  // not guaranteed.
  //
  // Auth: requires `view` or `manage` access to the network.
  //
  // Request: `GET /network/stats/node?networkId=<id>`; `networkId` is
  // required.
  //
  // Errors: `asn.network.not_found` when the network does not exist.
  rpc GetStatsOfNodes     (Network.Id)                returns (Node.Stats) {
    option (google.api.http) = {
      get: "/network/stats/node"
    };
  }
  // Get per-service counts of service states across a network.
  //
  // For each requested service, counts the nodes in the network and all its
  // subnetworks that have the service installed, grouped by service state.
  // Only states that occur are listed; a service with no nodes maps to an
  // empty list.
  //
  // Auth: requires `view` or `manage` access to the network.
  //
  // Request: `GET /network/stats/service?networkId=<id>&serviceNames=a&serviceNames=b`;
  // `networkId` is required. `serviceNames` is optional; when empty, all
  // services loaded on the controller are reported.
  //
  // Response: `stats` is keyed by service name.
  //
  // Errors: `asn.network.not_found` when the network does not exist;
  // `shared.service.not_found` when a requested service is not loaded on the
  // controller.
  rpc GetStatsOfServices  (Node.Service.Stats.GetReq) returns (Node.Service.Stats) {
    option (google.api.http) = {
      get: "/network/stats/service"
    };
  }

  // --- Service Metrics ---

  // Get a service's display metrics for a network.
  //
  // Returns the key-value metrics that the service's controller plugin
  // reports for the given network. Metric keys, value formats and units are
  // defined by each service; the framework defines none and passes the map
  // through unchanged. The map may be empty.
  //
  // Auth: requires `view` or `manage` access to the network.
  //
  // Request: `GET /service/metric?networkId=<id>&serviceName=<name>`; both are
  // required.
  //
  // Errors: `shared.service.not_found` when the service is not loaded on the
  // controller; `shared.system.internal` when the service fails to produce
  // metrics; `asn.network.not_found` when the network does not exist.
  rpc GetMetricsOfService (Node.Service.Metrics.GetReq) returns (Node.Service.Metrics) {
    option (google.api.http) = {
      get: "/service/metric"
    };
  }
}

/*
 * Common
 */

// Empty request or response body.
//
// Used as the request of RPCs that take no parameters and as the response of RPCs
// that return no data; serialized as `{}`.
message Empty {}

// Geographic location and location tier of a network or node.
//
// Used in network and node requests (create/update) and responses. In responses
// the whole object is omitted when no location was set.
//
// Validation on create/update (failure returns `shared.request.param_invalid`,
// meta `field=location`) is skipped for a root network (no parent):
// - `latitude` must be in [-90, 90] and `longitude` in [-180, 180].
// - Walking up from the parent network (for a node: its network), the first
//   network that has a location is the reference. If one is found,
//   `locationTier`, when set, must be one of the tiers listed under that field and
//   must not be a larger tier than the reference's tier (equal is allowed). If
//   none is found, the tier is not checked.
message Location {
  // Latitude in degrees, -90 to 90.
  double latitude = 1;
  // Longitude in degrees, -180 to 180.
  double longitude = 2;
  // Altitude; stored and returned as given, not validated.
  double altitude = 3;
  // Free-form street address.
  string address = 4;
  // Free-form description of the location.
  string description = 5;
  // Location tier name, from largest to smallest: `world`, `country`, `state`,
  // `city`, `district`, `campus`, `building`, `floor`, `room`, `row`, `rack`,
  // `unit`. Empty means no tier.
  string location_tier = 6;
}

// Request of `GetAllServices` (`GET /service`).
//
// Any authenticated user may call it.
message IncludeAsn {
  // When true, the framework name `asn` is listed first, before the loaded
  // service names; when false (default) only loaded services are listed. Pass as
  // query parameter `?includeAsn=true`.
  bool include_asn = 1;
}


// -----------------------------------------------------------------------------
// 2 — Auth
// -----------------------------------------------------------------------------

// Namespace for the authentication request/response types.
//
// Groups the messages and enums used by the login flow, the password flow, MFA,
// and factor binding endpoints (`/auth/...`).
message Auth {
  // Second-factor method used during login MFA and inline MFA setup.
  //
  // Passkeys are a login method (`CREDENTIAL_METHOD_PASSKEY`), not an MFA method.
  enum MfaMethod {
    // Not set. Rejected where a method is required.
    MFA_METHOD_UNSPECIFIED = 0;
    // Time-based one-time password from an authenticator app.
    MFA_METHOD_TOTP        = 1;
    // One-time code sent by email.
    MFA_METHOD_EMAIL       = 2;
    // One-time code sent by SMS.
    MFA_METHOD_SMS         = 3;
  }

  // Identity and proof kind chosen when starting a login flow.
  //
  // The value decides which identity field `AuthFlowInit` needs, the state it
  // returns, and which proof field `AuthFlowVerify` reads.
  enum CredentialMethod {
    // Not set. Rejected by `AuthFlowInit`.
    CREDENTIAL_METHOD_UNSPECIFIED       = 0;
    // Identity `username`, proof `password`. Init returns `FLOW_STATE_VERIFY_REQUIRED`.
    CREDENTIAL_METHOD_USERNAME_PASSWORD = 1;
    // Identity `phone`, proof `password`. Init returns `FLOW_STATE_VERIFY_REQUIRED`.
    CREDENTIAL_METHOD_PHONE_PASSWORD    = 2;
    // Identity `email`, proof `password`. Init returns `FLOW_STATE_VERIFY_REQUIRED`.
    CREDENTIAL_METHOD_EMAIL_PASSWORD    = 3;
    // Identity `phone`, proof: SMS code. Init returns `FLOW_STATE_CHALLENGE_REQUIRED`; counts as MFA-verified.
    CREDENTIAL_METHOD_PHONE_CODE        = 4;
    // Identity `email`, proof: email code. Init returns `FLOW_STATE_CHALLENGE_REQUIRED`; counts as MFA-verified.
    CREDENTIAL_METHOD_EMAIL_CODE        = 5;
    // WeChat OAuth; no identity at init, proof `wechatAppId` + `wechatCode`. Init returns `FLOW_STATE_VERIFY_REQUIRED`.
    CREDENTIAL_METHOD_WECHAT            = 6;
    // Sign in with Apple; no identity at init, proof `appleIdToken`. Init returns `FLOW_STATE_VERIFY_REQUIRED`.
    CREDENTIAL_METHOD_APPLE             = 7;
    // Sign in with Google; no identity at init, proof `googleIdToken`. Init returns `FLOW_STATE_VERIFY_REQUIRED`.
    CREDENTIAL_METHOD_GOOGLE            = 8;
    // WebAuthn passkey; no identity at init, proof: assertion in `data`. Init returns `FLOW_STATE_CHALLENGE_REQUIRED`; counts as MFA-verified.
    CREDENTIAL_METHOD_PASSKEY           = 9;
  }

  // Proof a user gives in the password flow.
  enum PasswordVerifyMethod {
    // Not set. Rejected by `AuthPasswordFlowSendCode`.
    PASSWORD_VERIFY_METHOD_UNSPECIFIED  = 0;
    // The current password. Offered when the account has a password; sessions are kept on completion.
    PASSWORD_VERIFY_METHOD_OLD_PASSWORD = 1;
    // Code sent to the account's bound email. Offered when an email is bound; all sessions are revoked on completion.
    PASSWORD_VERIFY_METHOD_EMAIL        = 2;
    // Code sent to the account's bound phone. Offered when a phone is bound; all sessions are revoked on completion.
    PASSWORD_VERIFY_METHOD_SMS          = 3;
  }

  // Outcome of `AuthPasswordFlowInit`.
  enum PasswordFlowInitState {
    // Not set; not returned on success.
    PASSWORD_FLOW_INIT_STATE_UNSPECIFIED     = 0;
    // The account was found and has methods: `flowToken` and `methods` are valid; pick a method.
    PASSWORD_FLOW_INIT_STATE_METHOD_REQUIRED = 1;
    // The account does not exist or has no usable method (indistinguishable); no flow token is issued.
    PASSWORD_FLOW_INIT_STATE_NO_RECOVERY     = 2;
  }

  // Phone number, also the request of `AuthSendCodeToPhone`.
  message Phone {
    // Country calling code of the number. Required where a phone is required; validated by IAM together with `number`.
    string country_code = 1;
    // Local phone number without the country code. Required where a phone is required.
    string number = 2;
    // `AuthSendCodeToPhone` only: when true, the code is sent only if an account already uses this phone; the response is the same either way.
    bool send_only_when_exists = 3;
  }

  // Email address, the request of `AuthSendCodeToEmail`.
  message Email {
    // Email address to send the code to. Required; format is validated by IAM.
    string email = 1;
    // When true, the code is sent only if an account already uses this address; the response is the same either way.
    bool send_only_when_exists = 2;
  }

  // Result of sending a verification code.
  //
  // Returned by `AuthSendCodeToPhone` and `AuthSendCodeToEmail`.
  message Code {
    // Send outcome:
    // - `1`: sent, or silently skipped because `sendOnlyWhenExists` found no account;
    // - `2`: IAM runs in non-production mode and returned the code in `code` instead of sending it;
    // - `3`: the delivery provider refused to send (SMS provider rate limit);
    // - `4`: resend cooldown still running; nothing was sent, see `next`.
    int64 result = 1;
    // The code itself, only when `result` is `2` (non-production IAM); empty otherwise.
    string code = 2;
    // Seconds to wait before another code can be requested for the same target (rounded up); 0 when not reported.
    int64 next = 3;
  }

  // Login methods enabled for ASN, returned by `AuthListLoginMethods`.
  message LoginMethods {
    // Enabled credential methods (`Auth.CredentialMethod` values); may be empty.
    repeated CredentialMethod methods = 1;
  }

  // Request of `AuthResetPassword` (administrator only).
  message ResetPassword {
    // Target account ID (UUID). Required.
    string account_id = 1;
    // New password to set. Required; checked by the IAM password policy.
    string password = 2;
  }

  // Request of `AuthGetPasskeyBindChallenge`.
  message PasskeyDomain {
    // WebAuthn relying-party domain the passkey is registered for. Required; send the same value to `AuthBindPasskey`.
    string domain = 1;
    // Ignored: the challenge is always for the caller's own account.
    string account_id = 2;
  }

  // Passkey registration challenge returned by `AuthGetPasskeyBindChallenge`.
  message PasskeyChallenge {
    // Registration session ID. Send it back unchanged as `sessionId` of `AuthBindPasskey`.
    string session_id = 1;
    // JSON-encoded WebAuthn credential creation options.
    string data = 2;
  }

  // One MFA option offered for an account that already has factors bound.
  //
  // Element of `LoginResult.availableMfaMethods` (state `FLOW_STATE_MFA_VERIFY`).
  // A factor equal to the login credential (for example SMS after a phone-code
  // login) is not offered.
  message MfaMethodInfo {
    // The factor; pass it as `mfaMethod` to `AuthFlowGetChallenge`.
    MfaMethod method        = 1;
    // Masked rendering of the bound phone or email for display; empty for TOTP.
    string    masked_target = 2;
    // Country calling code of the bound phone; set only for SMS.
    string    country_code  = 3;
  }

  // Phone country-code policy returned by `AuthListPhoneCountries`.
  message CountryCodeList {
    // Selection mode configured in IAM: `all` (every country allowed; `codes` is not a limit), `include` (only `codes` allowed), or `exclude` (all except `codes`).
    string type = 1;
    // Country calling codes the mode applies to; may be empty.
    repeated string codes = 2;
  }

  // Access/refresh token pair issued at the end of a login.
  message TokenSet {
    // Access token (JWT). Send it as `X-Auth-Token`. Lifetime: Controller `login` config, default 60 minutes.
    string access_token = 1;
    // Refresh token for `AuthRefreshToken`. Expires at a fixed time set at login (default 720 minutes) that refreshing does not extend.
    string refresh_token = 2;
  }

  // Next action the client must take in the login flow.
  //
  // Returned by `AuthFlowInit` (`FlowInitRes.state`) and in every `LoginResult`.
  enum FlowState {
    // Not set; not returned on success.
    FLOW_STATE_UNSPECIFIED = 0;
    // Login complete; `tokenSet` holds the access/refresh tokens.
    FLOW_STATE_AUTHENTICATED = 1;
    // Credentials accepted; MFA is required and a factor is bound. Pick one of `availableMfaMethods`, call `AuthFlowGetChallenge`, then `AuthFlowMfaVerify`.
    FLOW_STATE_MFA_VERIFY    = 2;
    // Credentials accepted; MFA is required but no factor is bound. Pick one of `availableSetupMethods`, call `AuthFlowMfaSetupInitiate`, then `AuthFlowMfaSetupConfirm`.
    FLOW_STATE_MFA_SETUP     = 3;
    // From `AuthFlowInit` only: call `AuthFlowGetChallenge` (sends the OTP or returns the passkey challenge), then `AuthFlowVerify`.
    FLOW_STATE_CHALLENGE_REQUIRED = 4;
    // From `AuthFlowInit` only: call `AuthFlowVerify` with the proof directly.
    FLOW_STATE_VERIFY_REQUIRED    = 5;
  }

  // Outcome of a login step.
  //
  // Returned by `AuthFlowVerify`, `AuthFlowResume`, `AuthFlowMfaSetupConfirm`, and
  // `AuthFlowMfaVerify`. Read `state` first; only the fields listed for that state
  // are meaningful.
  message LoginResult {
    // The logged-in account with only `id`, `username`, `email`, and `phone` filled. Set by `AuthFlowVerify` and `AuthFlowResume`; null in `AuthFlowMfaSetupConfirm` and `AuthFlowMfaVerify` responses (use `AuthGetCurrentUser`).
    User   account   = 1;
    // What to do next; see `Auth.FlowState`.
    FlowState state     = 2;

    // `FLOW_STATE_AUTHENTICATED` only: the access/refresh token pair; null otherwise.
    TokenSet token_set = 3;

    // `FLOW_STATE_MFA_VERIFY` / `FLOW_STATE_MFA_SETUP` only: token for the MFA endpoints (`AuthFlowGetChallenge`, `AuthFlowMfaVerify`, `AuthFlowMfaSetupInitiate`, `AuthFlowMfaSetupConfirm`). It is the MFA-unverified access token and expires with it (access lifetime); it is invalidated once MFA completes.
    string flow_token = 4;

    // `FLOW_STATE_MFA_VERIFY` only: factors the account has bound and can use; show them as a picker.
    repeated MfaMethodInfo available_mfa_methods = 5;

    // `FLOW_STATE_MFA_SETUP` only: methods that can be bound now, decided by IAM configuration rather than the account's contacts: TOTP always; SMS when SMS sending is enabled; EMAIL when mail sending is enabled. For SMS/EMAIL the user supplies a new phone/email at setup.
    repeated MfaMethod available_setup_methods = 6;
  }

  // Access/refresh token pair, the request and response of `AuthRefreshToken`.
  message Tokens {
    // Access token of the current pair (may be expired) in the request; the new access token in the response.
    string access_token = 1;
    // Refresh token of the current pair in the request; the new refresh token in the response. Both are required in the request.
    string refresh_token = 2;
  }

  // Request of `AuthBindTotp`.
  message BindTotp {
    // Current code shown by the authenticator app after scanning the `AuthGenerateTotpQrCode` QR code. Required; decimal digits.
    string code = 1;
  }

  // Request of `AuthBindEmail`.
  message BindEmail {
    // Email address to bind. Required.
    string email = 1;
    // Code sent to that address by `AuthSendCodeToEmail`. Required.
    string code = 2;
  }

  // Request of `AuthBindPhone`.
  message BindPhone {
    // Phone number to bind (`countryCode` and `number`). Required; `sendOnlyWhenExists` is ignored here.
    Phone phone = 1;
    // Code sent to that number by `AuthSendCodeToPhone`. Required.
    string code = 2;
  }

  // Request of `AuthBindWeChat`.
  message BindWeChat {
    // WeChat app ID the OAuth `code` was issued for. Required.
    string app_id = 1;
    // WeChat OAuth authorization code. Required.
    string code = 2;
  }

  // Request of `AuthBindAppleId`.
  message BindApple {
    // ID token from Sign in with Apple. Required.
    string id_token = 1;
  }

  // Request of `AuthBindGoogleId`.
  message BindGoogle {
    // ID token from Google Sign-In. Required.
    string id_token = 1;
  }

  // Request of `AuthBindPasskey`.
  message BindPasskey {
    // Relying-party domain; the same value sent to `AuthGetPasskeyBindChallenge`. Required.
    string domain = 1;
    // `sessionId` returned by `AuthGetPasskeyBindChallenge`. Required.
    string session_id = 2;
    // JSON-encoded WebAuthn registration response produced from the challenge options. Required.
    string data = 3;
  }

  // Request of `AuthUnbindPasskey`, sent as query parameters.
  message UnbindPasskey {
    // Account ID (UUID). Optional: empty means the caller; another account requires an administrator.
    string account_id = 1;
    // ID of the passkey to remove (`passkeyId` from `User.passkeys`). Required.
    string passkey_id = 2;
  }

  // TOTP provisioning material returned by `AuthGenerateTotpQrCode`.
  //
  // `secret` is sensitive: show it only to the user and do not log it.
  message TotpQrCode {
    // Base64-encoded PNG image of the QR code (no `data:` prefix); it encodes an `otpauth://totp/` URI with the issuer, username, and secret.
    string qr_png = 1;
    // The `otpauth://totp/<issuer>:<username>?issuer=...&secret=...` URI encoded in
    // `qrPng`; usable as a tap-to-add link on mobile.
    string auth_uri = 2;
    // TOTP secret for manual entry into an authenticator app.
    string secret = 3;
    // Issuer label shown in authenticator apps (IAM `mfa.totp.issuer` setting).
    string issuer = 4;
    // Account label shown in authenticator apps: the caller's username.
    string display_name = 5;
  }

  // Request of `AuthFlowMfaSetupInitiate`.
  //
  // The chosen method (and, for SMS/Email, the target being bound) is recorded on
  // the flow; `AuthFlowMfaSetupConfirm` resolves it from the flow token. Call
  // again to switch method or target.
  message FlowMfaSetupInitiateReq {
    // `flowToken` from a `LoginResult` in state `FLOW_STATE_MFA_SETUP`. Required.
    string    flow_token   = 1;
    // Method to bind, one of `availableSetupMethods`. Required.
    MfaMethod method       = 2;
    // SMS only: the phone number to bind; the OTP is sent here. Required for SMS.
    Phone     phone        = 3;
    // EMAIL only: the address to bind; the OTP is sent here. Required for EMAIL.
    string    email        = 4;
  }

  // Response of `AuthFlowMfaSetupInitiate`; which fields are set depends on the method.
  message FlowMfaSetupInitiateRes {
    // TOTP only: base64-encoded PNG QR code to scan with the authenticator app.
    string totp_image  = 1;
    // TOTP only: issuer label shown in the authenticator app.
    string totp_issuer = 2;
    // TOTP only: secret for manual entry (sensitive; do not log).
    string totp_secret = 3;

    // SMS / EMAIL only: send outcome, same values as `Auth.Code.result` (`1` sent, `2` code returned in `code`, `3` provider refused, `4` cooldown).
    int64  result = 4;
    // SMS / EMAIL only: seconds to wait before another code can be requested for the target.
    int64  next   = 5;
    // SMS / EMAIL only: the OTP when IAM runs in non-production mode (`result` `2`); empty otherwise.
    string code   = 6;
  }

  // Request of `AuthFlowMfaSetupConfirm`.
  //
  // The method, and for SMS/Email the target, were captured by
  // `AuthFlowMfaSetupInitiate` and are resolved from the flow; re-initiate to
  // switch method or target.
  message FlowMfaSetupConfirmReq {
    // The same `flowToken` passed to `AuthFlowMfaSetupInitiate`. Required.
    string flow_token = 1;
    // TOTP: the first code from the authenticator app; SMS/EMAIL: the OTP sent to the new target. Required.
    string code       = 2;
  }

  // Request of `AuthFlowMfaVerify` for an account that already has a factor bound.
  //
  // The factor was selected by `AuthFlowGetChallenge` and is resolved from the
  // flow; call `AuthFlowGetChallenge` first (also for TOTP) and again to switch
  // factor before verifying.
  message FlowMfaVerifyReq {
    // `flowToken` from a `LoginResult` in state `FLOW_STATE_MFA_VERIFY`. Required.
    string flow_token = 1;
    // TOTP code, or the SMS/email OTP sent by `AuthFlowGetChallenge`. Required.
    string code       = 2;
  }

  // --- Unified login flow ---

  // Request of `AuthFlowInit`.
  //
  // Fill the identity for the method's identity kind: `username` for
  // `CREDENTIAL_METHOD_USERNAME_PASSWORD`, `phone` for the `PHONE_*` methods,
  // `email` for the `EMAIL_*` methods. WeChat, Apple, Google, and passkey leave
  // all identity fields empty.
  message FlowInitReq {
    // Descriptor of the device logging in. Required; `name` must be non-empty and IAM checks `category`/`type`/`os`/`language` (see `Device.Info`).
    Device.Info      device_info        = 1;
    // Credential method; must be one returned by `AuthListLoginMethods`. Required.
    CredentialMethod method             = 2;
//    bool             create_if_not_exist = 3; // create the account on first successful credential validation

    // Username; required for `CREDENTIAL_METHOD_USERNAME_PASSWORD`.
    string username = 4;
    // Phone (`countryCode` + `number`); required for `CREDENTIAL_METHOD_PHONE_PASSWORD` and `CREDENTIAL_METHOD_PHONE_CODE`. `sendOnlyWhenExists` is ignored.
    Phone  phone    = 5;
    // Email; required for `CREDENTIAL_METHOD_EMAIL_PASSWORD` and `CREDENTIAL_METHOD_EMAIL_CODE`.
    string email    = 6;
  }

  // Response of `AuthFlowInit`.
  message FlowInitRes {
    // `FLOW_STATE_CHALLENGE_REQUIRED` (phone code, email code, passkey) or `FLOW_STATE_VERIFY_REQUIRED` (all other methods).
    FlowState state      = 1;
    // Credential-phase flow token for `AuthFlowGetChallenge` / `AuthFlowVerify`. Opaque; IAM default lifetime 10 minutes and 5 failed verifications.
    string    flow_token = 2;
  }

  // Request of `AuthFlowGetChallenge`.
  message FlowGetChallengeReq {
    // Credential-phase token from `AuthFlowInit`, or MFA-phase `flowToken` from a `LoginResult` in `FLOW_STATE_MFA_VERIFY`. Required.
    string    flow_token = 1;
    // MFA phase only (required there): the factor to use, one of `availableMfaMethods`. Ignored in the credential phase.
    MfaMethod mfa_method = 2;
    // Credential-phase passkey login only: the WebAuthn relying-party domain.
    string    domain     = 3;
  }

  // Response of `AuthFlowGetChallenge`.
  //
  // For OTP methods the send outcome is in `result`/`next`/`code`; for passkey
  // login `data` holds the challenge and the session is kept on the flow (resolved
  // by `AuthFlowVerify`). Selecting TOTP in the MFA phase returns all fields empty.
  message FlowGetChallengeRes {
    // OTP methods only: send outcome, same values as `Auth.Code.result` (`1` sent or skipped, `2` code returned in `code`, `3` provider refused, `4` cooldown); 0 otherwise.
    int64  result = 1;
    // OTP methods only: seconds to wait before another code can be requested for the target.
    int64  next   = 2;
    // OTP methods only: the OTP when IAM runs in non-production mode (`result` `2`); empty otherwise.
    string code   = 3;
    // Passkey login only: JSON-encoded WebAuthn assertion (request) options to sign.
    string data   = 4;
  }

  // Request of `AuthFlowVerify`.
  //
  // Fill only the proof that matches the method chosen at `AuthFlowInit`; other
  // fields are ignored.
  message FlowVerifyReq {
    // Credential-phase flow token from `AuthFlowInit`. Required.
    string flow_token = 1;

    // `*_PASSWORD` methods: the account password.
    string password = 2;
    // `*_CODE` methods: the OTP sent by `AuthFlowGetChallenge`.
    string code     = 3;

    // `CREDENTIAL_METHOD_WECHAT`: WeChat app ID the OAuth code was issued for.
    string wechat_app_id  = 4;
    // `CREDENTIAL_METHOD_WECHAT`: WeChat OAuth authorization code.
    string wechat_code    = 5;
    // `CREDENTIAL_METHOD_APPLE`: ID token from Sign in with Apple.
    string apple_id_token = 6;
    // `CREDENTIAL_METHOD_GOOGLE`: ID token from Google Sign-In.
    string google_id_token = 7;

    // `CREDENTIAL_METHOD_PASSKEY`: JSON-encoded WebAuthn assertion for the challenge from `AuthFlowGetChallenge` (session and domain are taken from the flow).
    string data = 8;
  }

  // Request of `AuthFlowResume`.
  message FlowResumeReq {
    // An access token that is not yet MFA-verified (the one that got `shared.auth.mfa.needed`). Required.
    string access_token = 1;
  }

  // --- Password flow ---

  // Request of `AuthPasswordFlowInit`.
  //
  // Identify the account with one of the fields. If several are set, the first
  // non-empty one in the order `accountId`, `username`, `email`,
  // `countryCode`+`number` is used. Email and phone lookups work only when IAM keeps
  // them unique.
  message PasswordFlowInitReq {
    // Account ID (UUID).
    string account_id   = 1;
    // Username.
    string username     = 2;
    // Bound email address.
    string email        = 3;
    // Country calling code of the bound phone; used together with `number`.
    string country_code = 4;
    // Local number of the bound phone; used together with `countryCode`.
    string number       = 5;
  }

  // Response of `AuthPasswordFlowInit`.
  message PasswordFlowInitRes {
    // Outcome; see `Auth.PasswordFlowInitState`.
    PasswordFlowInitState state      = 1;
    // Password-flow token for the next steps; set only for `PASSWORD_FLOW_INIT_STATE_METHOD_REQUIRED`. Opaque; IAM default lifetime 10 minutes and 5 failed verifications.
    string                flow_token = 2;
    // Verification methods the account can use; empty for `PASSWORD_FLOW_INIT_STATE_NO_RECOVERY`.
    repeated PasswordFlowMethod methods = 3;
  }

  // One verification option offered by `AuthPasswordFlowInit`.
  message PasswordFlowMethod {
    // The method.
    PasswordVerifyMethod method        = 1;
    // Masked bound email/phone for display; empty for the old-password method.
    string               masked_target = 2;
    // Country calling code of the bound phone; set only for SMS.
    string               country_code  = 3;
  }

  // Request of `AuthPasswordFlowSendCode`.
  message PasswordFlowSendCodeReq {
    // Password-flow token from `AuthPasswordFlowInit`. Required.
    string               flow_token = 1;
    // `PASSWORD_VERIFY_METHOD_EMAIL` or `PASSWORD_VERIFY_METHOD_SMS`. Required; recorded as the method `AuthPasswordFlowVerify` checks.
    PasswordVerifyMethod method     = 2;
  }

  // Response of `AuthPasswordFlowSendCode`.
  message PasswordFlowSendCodeRes {
    // Send outcome, same values as `Auth.Code.result` (`1` sent, `2` code returned in `code`, `3` provider refused, `4` cooldown).
    int64  result = 1;
    // Seconds to wait before another code can be requested for the target.
    int64  next   = 2;
    // The OTP when IAM runs in non-production mode (`result` `2`); empty otherwise.
    string code   = 3;
  }

  // Request of `AuthPasswordFlowVerify`.
  //
  // The method is resolved from the inputs: a non-empty `oldPassword` means the
  // old-password method; otherwise `code` is checked against the OTP method chosen
  // by the last `AuthPasswordFlowSendCode`.
  message PasswordFlowVerifyReq {
    // Password-flow token from `AuthPasswordFlowInit`. Required.
    string flow_token   = 1;
    // OTP methods: the code sent by `AuthPasswordFlowSendCode`.
    string code         = 2;
    // Old-password method: the current password. Takes precedence over `code`.
    string old_password = 3;
  }

  // Request of `AuthPasswordFlowComplete`.
  message PasswordFlowCompleteReq {
    // Verified password-flow token. Required.
    string flow_token   = 1;
    // The new password. Required; checked by the IAM password policy.
    string new_password = 2;
  }
}

// -----------------------------------------------------------------------------
// 3 — Device
// -----------------------------------------------------------------------------

// Namespace for login-device types.
//
// A device is the client installation an account logs in from; IAM keys sessions
// by device.
message Device {
  // Device descriptor sent at login (`Auth.FlowInitReq.deviceInfo`).
  //
  // IAM requires a consistent `category`/`type` pair, a known `os`, and a valid
  // `language`.
  message Info {
    // Ignored on input; IAM assigns the device ID.
    string id = 1;
    // Device category: 1 unknown, 2 phone, 3 tablet, 4 wearable, 5 browser, 6 mini program, 7 PC.
    int64 category = 2;
    // Device type within `category` (1 is always "unknown"): phone 2 iPhone, 3 Android; tablet 2 iPad, 3 Android; wearable 2 Apple Watch, 3 Android watch; browser 2 Chrome, 3 Safari, 4 Firefox; mini program 2 phone, 3 computer; PC 2 Windows, 3 macOS, 4 Linux.
    int64 type = 3;
    // Operating system: `unknown`, `ios`, `android`, `watchos`, `android_wear`, `wechat`, `windows`, `macos`, or `linux`.
    string os = 4;
    // Device language: 1 English, 2 Chinese. 0 is rejected.
    int64 language = 5;
    // Display name of the device. Required at login.
    string name = 6;
    // Hardware model. Optional.
    string model = 7;
    // Serial number. Optional.
    string serial_number = 8;
    // Client or OS version string. Optional.
    string version = 9;
    // Ignored on input. (Non-standard proto casing; preserved for wire compatibility.)
    bool Connected = 10;
    // Ignored on input. (Non-standard proto casing; preserved for wire compatibility.)
    bool Current = 11;

    // Ignored on input.
    int64 sent = 12;
    // Ignored on input.
    int64 received = 13;
  }

  // List of device descriptors; not returned by any current endpoint.
  message List {
    // Device descriptors.
    repeated Info device_infos = 1;
  }

  // Request of `DeviceUnbind`, sent as query parameters.
  message UnbindReq {
    // Account ID (UUID). Optional: empty means the caller; another account requires an administrator.
    string account_id = 1;
    // ID of the device to remove. Required.
    string device_id = 2;
  }

  // Request of `DeviceRename`.
  message RenameReq {
    // Account ID (UUID). Optional: empty means the caller; another account requires an administrator.
    string account_id = 1;
    // ID of the device to rename. Required.
    string device_id = 2;
    // New display name. Required.
    string device_name = 3;
  }
}

/*
 * Info
 */

// Controller version and Service Node port information.
//
// Response of `GetInfo` (`GET /info`), which requires no authentication.
message ControllerInfo {
  // Version string of the running controller (`asnc`).
  string asnc_version = 1;
  // Version of each loaded service's controller plugin, keyed by service name.
  // Empty when no service is loaded.
  map<string, string> service_versions = 2;
  // TCP port the controller is currently listening on for Service Node
  // connections (the mTLS controller gRPC listener).
  uint32 port = 3;
  // Port saved by `UpdatePort` (`POST /info/port`) during this controller run but
  // not yet in effect; it is used after the controller restarts. 0 when no change
  // is pending.
  uint32 port_pending = 4;
}

// Request of `UpdatePort` (`POST /info/port`).
//
// Admin only (ASN admin); otherwise `shared.auth.permission_denied`. The new port
// is written to the controller config file and reported as
// `ControllerInfo.portPending`; the running listener is not changed until the
// controller restarts.
message UpdatePortReq {
  // New Service Node listening port, 1-65535. Required; 0 or values above 65535
  // fail with `shared.request.param_invalid` (meta `field=port`).
  uint32 port = 1;
}

/*
 * User and User Group
 */

// A user account and, depending on the endpoint, its groups, access and bound
// authentication factors.
//
// Returned by `GetUsersByIDs` (`GET /user`), `AuthGetCurrentUser`
// (`GET /auth/user`) and as `account` in login results. Which fields are filled
// depends on the endpoint:
// - Login result `account`: only `id`, `username`, `email`, `phone`.
// - `GetUsersByIDs`: all fields except `accesses`.
// - `AuthGetCurrentUser`: all fields.
message User {
  // Account ID (UUID string).
  string id = 1;
  // Login username.
  string username = 2;
  // Email address; empty if none is set.
  string email = 3;
  // Phone number. Always present in user responses; its fields are empty when no
  // phone is set.
  Phone phone = 4;
  // Names of the `asn` user groups the account belongs to, grouped by group type.
  // Omitted when the account is in no group.
  UserGroup.Names groups = 5;
  // Effective access grants from all of the account's groups (one entry per
  // group grant). Filled only by `AuthGetCurrentUser`.
  repeated UserGroup.Access accesses = 6;

  // True if the account has a password set.
  bool has_password = 7;
  // True if a TOTP authenticator is enrolled.
  bool totp = 8;
  // WeChat binding; omitted when IAM reports none.
  WeChat wechat = 9;
  // Apple ID binding; omitted when IAM reports none.
  Apple apple = 10;
  // Google ID binding; omitted when IAM reports none.
  Google google = 11;
  // Registered WebAuthn passkeys; empty when none.
  repeated Passkey passkeys = 12;
  // True if MFA is enabled for the account in the viewed service (`asn`, or the
  // `service` passed to `GetUsersByIDs`).
  bool mfa_enabled = 13;
  // Account creation time, UNIX seconds.
  int32 created_at = 14;
  // Last account update time, UNIX seconds.
  int32 updated_at = 15;

  // Identifies one account.
  //
  // Used by `DeleteUser` (`DELETE /user?id=`) and the `AuthUnbind*` factor RPCs.
  message ID {
    // Account ID (UUID string). For `DeleteUser` it is required. For the
    // `AuthUnbind*` RPCs, empty (or the caller's own ID) targets the caller;
    // another account's ID requires an ASN admin, otherwise
    // `shared.auth.permission_denied`.
    string id = 1;
  }

  // List of account IDs.
  //
  // Not used by any RPC in this API.
  message IDs {
    // Account IDs (UUID strings).
    repeated string ids = 1;
  }

  // Request of `GetUsersByIDs` (`GET /user`).
  message GetReq {
    // IAM service whose view of the accounts is returned. Optional; defaults to
    // `asn`. Any other value must be a loaded service name, otherwise
    // `shared.service.not_found`.
    string service = 1;
    // Account IDs (UUID strings) to fetch, as repeated query keys
    // (`?ids=a&ids=b`). Unknown IDs are skipped; an invalid UUID fails with
    // `shared.request.param_invalid`.
    repeated string ids = 2;
  }

  // Response of `ListUsers` (`GET /user/list`).
  message ServiceUsers {
    // Accounts per service, keyed by service name. A service with no accounts has
    // no entry.
    map<string, Users> users = 1;

    // Accounts of one service.
    message Users {
      // Accounts visible to the service.
      repeated User users = 1;

      // Minimal account identity.
      message User {
        // Account ID (UUID string).
        string id = 1;
        // Login username.
        string username = 2;
      }
    }
  }

  // Request of `CreateUser` (`POST /user`).
  //
  // All fields are passed to IAM, which validates them.
  message Create {
    // Login username for the new account.
    string username = 1;
    // Initial password.
    string password = 2;
    // Email address; stored without verification.
    string email = 3;
    // Phone number; stored without verification. A leading `+` in `countryCode`
    // is stripped.
    Phone phone = 4;
  }

  // Request of `UpdateUser` (`PUT /user`).
  //
  // Both `email` and `phone` are always written; omitting one sends an empty value
  // rather than keeping the current one.
  message Update {
    // Account ID (UUID string) to update. Required; an invalid UUID fails with
    // `shared.request.param_invalid` (meta `field=id`).
    string id = 1;
    // New email address; stored without verification.
    string email = 2;
    // New phone number; stored without verification. A leading `+` in
    // `countryCode` is stripped.
    Phone phone = 3;
  }

  // Account list filter.
  //
  // Not used by any RPC in this API.
  message ListReq {
    // Unused.
    bool asn_only = 1;
  }

  // Response of `GetUsersByIDs` (`GET /user`).
  message List {
    // Matching accounts; empty when no requested ID matched.
    repeated User users = 1;
  }

  // List of strings.
  //
  // Not used by any RPC in this API.
  message Array {
    // Values.
    repeated string values = 1;
  }

  // Phone number split into country code and local number.
  message Phone {
    // Country calling code, e.g. `86` or `1`. On `CreateUser` and `UpdateUser`
    // a leading `+` is accepted and stripped.
    string country_code = 1;
    // Phone number without the country code.
    string number = 2;
  }

  // WeChat binding of the account.
  message WeChat {
    // True if a WeChat account is bound.
    bool bound = 1;
    // WeChat nickname.
    string nickname = 2;
    // WeChat avatar image URL.
    string img_url = 3 [json_name = "imageUrl"];
  }

  // Sign in with Apple binding of the account.
  message Apple {
    // True if an Apple ID is bound.
    bool bound = 1;
    // Email reported by Apple.
    string email = 2;
    // True if Apple reports `email` as verified.
    bool email_verified = 3;
    // True if `email` is an Apple private relay address that hides the real email.
    bool private_email = 4;
  }

  // Google sign-in binding of the account.
  message Google {
    // True if a Google account is bound.
    bool bound = 1;
    // Email reported by Google.
    string email = 2;
    // True if Google reports `email` as verified.
    bool email_verified = 3;
    // Google display name.
    string nickname = 4;
    // Google profile picture URL.
    string img_url = 5 [json_name = "imageUrl"];
  }

  // A single WebAuthn passkey credential registered to the user.
  message Passkey {
    // Passkey ID; pass it as `passkeyId` to `AuthUnbindPasskey` to remove it.
    string passkey_id = 1;
    // ID of the device the passkey was registered from.
    string device_id = 2;
    // WebAuthn credential ID.
    string credential_id = 3;
  }
}

// A user group: a named set of accounts that shares one access grant.
//
// Two kinds exist (see `type`): built-in service admin groups named
// `<service>-admin` (for `asn` and every loaded service, created automatically at
// controller startup and granting `view` and `manage` on that whole service;
// members of `asn-admin` are ASN admins), and network groups that grant
// operations on networks under one root network. Every root network has one
// network group of its own, its admin group, created and deleted with the root
// and granting `view` and `manage` on the root; manage on a root comes only from
// it. Other network groups are created with `CreateUserGroup`. Returned by
// `GetUserGroups` (`GET /user/group`).
message UserGroup {
  // Group name; unique.
  string name = 1;
  // Number of member accounts.
  int64 user_total = 2;
  // Member account IDs (UUID strings).
  repeated string account_ids = 3;
  // True for built-in service admin groups (`type` is `TYPE_SERVICE`), which
  // cannot be updated or deleted.
  bool default = 4;
  // Group kind.
  Type type = 5;
  // Free-form remark; empty for built-in groups.
  string remark = 6;
  // Access grant of the group. A `TYPE_SERVICE` group has one entry with `service`
  // set; a `TYPE_NETWORK` group has one entry with `networks` set. Empty for
  // `TYPE_UNKNOWN` groups.
  repeated Access accesses = 7;
  // Legacy: for a `TYPE_NETWORK` group that ASN 26.19 kept per root network and
  // service (EnsureNetworkAdminGroup), that service; empty otherwise. Nothing
  // creates one any more. Read-only.
  string creator_service = 8;
  // For the admin group of a root network, that root's ID; empty otherwise.
  // Read-only. The group's access is fixed (an update naming it restores it) and
  // it is deleted with its root; its members are the root's administrators, the
  // only ones besides `asn-admin` (IAM written around ASN aside). A further admin group of the same root, or one
  // whose root is gone, may be deleted.
  string root_network_id = 9;

  // Identifies one user group.
  //
  // Request of `DeleteUserGroup` (`DELETE /user/group?userGroupName=`).
  message Name {
    // Group name. Required.
    string user_group_name = 1;
  }

  // User group names grouped by group type.
  //
  // Response of `ListUserGroups` (`GET /user/group/list`) and `User.groups`.
  message Names {
    // Group names of one type.
    message GroupNames {
      // Group names.
      repeated string names = 1;
    }
    // Keyed by the `UserGroup.Type` integer as a string: `"0"` unknown,
    // `"1"` service admin, `"2"` network. Types with no groups have no entry.
    map<string, GroupNames> groups = 1;
  }

  // One access grant: operations allowed on a service or on networks.
  message Access {
    // Service the grant covers; set only for `TYPE_SERVICE` groups (e.g. `asn` for
    // `asn-admin`, meaning full ASN admin). Ignored in `CreateUserGroup` and
    // `UpdateUserGroup` requests.
    string service = 1;
    // Network IDs the grant covers; set only for `TYPE_NETWORK` groups. The grant
    // also applies to the descendants of these networks. Required (non-empty) in
    // `CreateUserGroup` and `UpdateUserGroup`; each ID must exist, otherwise
    // `asn.network.not_found`.
    repeated string networks = 2;
    // Allowed operations: `view` and/or `manage`. Required (non-empty) in
    // `CreateUserGroup` and `UpdateUserGroup`; other values fail with
    // `shared.request.param_invalid`; duplicates are dropped.
    repeated string operations = 3;
  }

  // Request of `GetUserGroups` (`GET /user/group`).
  message GetReq {
    // Group names to fetch, as repeated query keys
    // (`?userGroupNames=a&userGroupNames=b`). Every name must exist.
    repeated string user_group_names = 1;
  }

  // Response of `GetUserGroups` (`GET /user/group`).
  message List {
    // Requested groups, in request order; empty when no names were given.
    repeated UserGroup groups = 1;
  }

  // Request of `CreateUserGroup` (`POST /user/group`).
  message Create {
    // Group name; must not already exist, otherwise
    // `shared.group.name_already_exists`.
    string name = 1;
    // Optional free-form remark.
    string remark = 2;
    // Network access grant. Required; only the first entry is used and its
    // `service` is ignored.
    repeated Access accesses = 4;
  }

  // Request of `UpdateUserGroup` (`PUT /user/group`).
  message Update {
    // Name of the existing `TYPE_NETWORK` group to update; cannot be changed.
    string name = 1;
    // New remark; always applied, so empty clears it.
    string remark = 2;
    // New network access grant, replacing the old one. Required; only the first
    // entry is used and its `service` is ignored.
    repeated Access accesses = 3;
  }

  // Request of `AddUsersToGroup` (`POST /user/group/users`) and
  // `RemoveUsersFromGroup` (`PUT /user/group/users`).
  message UserReq {
    // Target group name. Required.
    string user_group_name = 1;
    // Account IDs (UUID strings) to add or remove; an invalid UUID fails with
    // `shared.request.param_invalid` (meta `field=account_ids`).
    repeated string account_ids = 2;
  }

  // Kind of user group.
  enum Type {
    // Group whose metadata carries no recognized type (not created by the
    // controller, or unreadable metadata). It has no `accesses`.
    TYPE_UNKNOWN = 0;
    // Built-in service admin group `<service>-admin`, created automatically at
    // controller startup; grants `view` and `manage` on the whole service. Cannot
    // be updated or deleted.
    TYPE_SERVICE = 1;
    // Network group: a root admin group (`root_network_id` set), or a group
    // created by `CreateUserGroup`; grants its operations on its networks.
    TYPE_NETWORK = 2;
  }
}

/*
 * Network Topology: Network, Node, Location, etc.
 */

// A network topology file (YAML), used by `ImportTopoFromFile` and `ExportTopoFile`.
//
// Over REST these rpcs are hand-written: import takes the YAML as a plain string in
// `{"networkTopo":"<yaml text>"}` and export returns the YAML file itself, so the base64 form of
// `rawData` is not seen by REST clients.
//
// YAML structure (keys as written in the file):
// - `network-tiers`: list of tier names; becomes the tier vocabulary of every imported root network.
// - `networks`: list of top-level (root) networks. Each network has `name` (required, unique across
//   the whole file), optional `desc`, `tiers` (each must appear in `network-tiers`), `location`,
//   `nodes` (list of node names) and `networks` (nested subnetworks, same shape).
// - `nodes`: map from node name to node. Each node has `type` (one of `router`, `switch`,
//   `appliance`, `firewall`, `lb`, `ap`, `device`, `server`), optional `desc`, `location`,
//   `managed` (bool), `services` (service names the node is eligible for), `interfaces` (map of
//   interface name to `{ip, tags}`), `ipmi` (`{ip, username, key}`), `management`
//   (`{hostname, ip}`) and `info` (`{sn, vendor, model}`). A node may be listed in at most one network.
// - `links`: list of `{from: {node, interface}, to: {node, interface}, bandwidth, desc}`; `node` is a
//   node name and `interface`, when set, must be one of that node's `interfaces`.
// - `location` (networks and nodes): `{desc, tier, address, coordinates: {latitude, longitude, altitude}}`.
//   `tier` is one of `world`, `country`, `state`, `city`, `district`, `campus`, `building`, `floor`,
//   `room`, `row`, `rack`, `unit` and must be equal to or finer than the enclosing network's tier;
//   latitude must be within [-90, 90] and longitude within [-180, 180].
message NetworkTopo {
  // The YAML file content.
  bytes raw_data = 1;
}

// A network in the topology tree, with its subnetworks and nodes.
//
// Networks form trees: a root network has an empty `parentNetworkId`; subnetworks nest to any
// depth. Returned by `GetNetworkTopo`.
message Network {
  // Network ID (UUID string), generated by the server.
  string network_id = 1;
  // Network name. Root network names are unique among roots; subnetwork names are unique within
  // their root network's tree.
  string name = 2;
  // Free-text description.
  string description = 3;
  // ID of the parent network; empty for a root network.
  string parent_network_id = 4;
  // Tier labels assigned to this network. For subnetworks each label is one of the root network's
  // tier vocabulary (see `GetNetworkAvailableTiers`).
  repeated string network_tiers = 5;
  // Geographic location of the network as stored; null when none was set.
  Location location = 6;
  // Child networks, each with its own `subnets` and `nodes` filled recursively.
  repeated Network subnets = 7;
  // Nodes placed directly in this network (not those of subnetworks).
  repeated Node.Info nodes = 8;
  // True for the root network the controller configuration names
  // (`network.default_root_network`), however the root was created. Read-only.
  bool default_root = 9;

  // Name-only network tree, returned by `ListAvailableNetworks`.
  message List {
    // One network in the name-only tree.
    message Topo {
      // Network ID (UUID string).
      string network_id = 1;
      // Network name.
      string name = 2;
      // Child networks, recursively.
      repeated Topo subnets = 3;
      // As `Network.defaultRoot`. Read-only.
      bool default_root = 4;
    }

    // Top-level networks the caller can access, sorted by name.
    repeated Topo networks = 1;
  }

  // Full network trees, returned by `GetNetworkTopo`.
  message TopoLists {
    // Top-level networks the caller can access, each with its full subtree and nodes.
    repeated Network networks = 1;
  }

  // Request of `DisplayNetworks`.
  message GetReq {
    // Required. ID of the network to display.
    string network_id = 1;
    // Optional location tier filter (`world`, `country`, `state`, `city`, `district`, `campus`,
    // `building`, `floor`, `room`, `row`, `rack`, `unit`). Empty means no filter. See
    // `DisplayNetworks` for how it is applied.
    string location_tier = 2;
  }

  // One level of a network prepared for map/topology display, returned by `DisplayNetworks`.
  message Display {
    // A child network shown as a collapsed box.
    message Info {
      // Network ID (UUID string).
      string network_id = 1;
      // Network name.
      string name = 2;
      // Free-text description.
      string description = 3;
      // ID of the parent network.
      string parent_network_id = 4;
      // Tier labels assigned to this network.
      repeated string network_tiers = 5;
      // Location used for display. When the network has no address/coordinates of its own, they
      // are taken from the nearest ancestor network with a location (its own `description` and
      // `locationTier` are kept).
      Location location = 6;
      // All nodes in this network's whole subtree that pass the tier filter, sorted by name.
      repeated Node.Display nodes = 7;
    }

    // Child networks shown as boxes (unordered).
    repeated Info networks = 1;
    // Nodes shown individually at this level (directly in the requested network, or lifted from a
    // child network hidden by the tier filter), sorted by name.
    repeated Node.Display nodes = 2;
    // Links to draw. Aggregated network-level links have `fromNode` false, an empty `linkId`, and a
    // `bandwidth` that is the sum of the underlying links. Node-to-node links are individual links
    // with `linkId`, names, interfaces and description.
    repeated Link links = 3;
    // Distinct location tiers found on networks and nodes in the subtree (unordered); useful to
    // populate the `locationTier` filter.
    repeated string location_tiers = 4;
  }

  // Identifies a network. Used as the request of several rpcs (as the `networkId` query param on
  // GET/DELETE).
  message Id {
    // Network ID (UUID string).
    string network_id = 1;
  }

  // Request of `CreateNetwork`.
  message Create {
    // Parent network ID. Empty creates a root network (system-wide `manage` access required).
    string parent_network_id = 1;
    // Required. Network name; must be unique among root networks (for a root) or within the root
    // network's tree (for a subnetwork).
    string name = 2;
    // Optional free-text description.
    string description = 3;
    // Optional tier labels. For a subnetwork every entry must be in the root network's tier
    // vocabulary (see `GetNetworkAvailableTiers`), otherwise `shared.request.not_supported`.
    repeated string network_tiers = 4;
    // Optional location. For a subnetwork it is validated: latitude within [-90, 90], longitude
    // within [-180, 180], and `locationTier` equal to or finer than the nearest located ancestor's.
    Location location = 5;
  }

  // Request of `UpdateNetwork`. All editable fields are replaced; omitted ones are cleared.
  message Update {
    // Required. ID of the network to update.
    string network_id = 1;
    // Required. New name; when changed it must be unique within the root network's tree.
    string name = 3;
    // New description (empty clears it).
    string description = 4;
    // New tier labels (empty clears them); each must be in the root network's tier vocabulary.
    repeated string network_tiers = 5;
    // New location (omitted clears it); validated as in `CreateNetwork`.
    Location location = 6;
  }

  // Counters for a network's subtree, returned by `GetStatsOfNetwork`.
  message Stats {
    // Number of nodes in the network and all of its subnetworks.
    int64 number_of_nodes = 1;
    // Number of links that touch at least one of those nodes: links between two nodes of the
    // subtree count once, as do links from a subtree node to a node outside it.
    int64 number_of_links = 2;
    // Number of node groups (of any service) that contain at least one node of the subtree.
    int64 number_of_node_groups = 3;
  }

  // Tiers usable under a network, returned by `GetNetworkAvailableTiers`.
  message Tiers {
    // Tier vocabulary of the network's root network; the allowed values for `networkTiers` on
    // subnetworks. Empty for roots created with `CreateNetwork` (only a topo file import sets it).
    repeated string network_tiers = 1;
    // Allowed location tiers, coarsest first: the nearest located network's tier and every finer one.
    repeated string location_tiers = 2;
  }
}

// A node (a host running, or meant to run, `asnsn`) in the network topology.
//
// Returned by GetNodesByIds (`GET /node`). A node has two independent state
// axes: `installState` (is a host installed with this node's credential?) and
// `serviceNode.state` (is the node registered and connected right now?).
message Node {
  // Node ID (UUID string), assigned by the server at CreateNode.
  string node_id = 1;
  // Node type.
  Type type = 2;
  // Node name; unique within the node's root network tree.
  string name = 3;
  // Free-text description.
  string description = 4;
  // ID of the network the node sits directly under.
  string network_id = 5;
  // Physical location of the node; null when not set.
  Location location = 6;
  // Operator-set flag stored with the node; the controller does not act on it.
  bool managed = 7;
  // Topology info of the node (interfaces, IPMI, management address, device
  // info).
  //
  // Starts as what the operator entered at CreateNode / UpdateNode and the
  // interface endpoints. Each successful registration of the node replaces it
  // with the information the host reports (including `param`).
  NodeInfo topo_info = 8;
  // Runtime state of the node and its services. Always present; a node that
  // has never registered reports `STATE_UNREGISTERED`.
  ServiceNode service_node = 10;

  reserved 9;

  // Install state of the node (server-computed, read-only).
  //
  // Independent of the runtime state in `serviceNode.state` and derived on
  // every read from the node's credential. See `InstallState`.
  InstallState install_state = 11;
  // Whether the installed node runs older software than this controller would
  // install (server-computed, read-only).
  //
  // True only when `installState` is `INSTALL_INSTALLED` and either the
  // `asnsn` version the node registered with is below this controller's
  // version (or unparsable), or one of its services reported a version below
  // the one loaded on the controller (a service that reported no version
  // counts as older). To upgrade: UpgradeNodes (`POST /node/upgrade`) for a
  // node whose `serviceNode.capabilities` include `task`, otherwise run the
  // install script again (GetNodeInstallScript, `POST /node/install`); there
  // is no per-service upgrade.
  bool need_update = 12;

  // Request of GetNodesByIds (`GET /node`).
  message GetReq {
    // IDs of the nodes to return (required, repeated query parameter
    // `?nodeIds=a&nodeIds=b`).
    repeated string node_ids = 1;
    // Also return the links attached to the requested nodes, and the nodes on
    // the far end of those links. Default false.
    bool include_links = 2;
  }

  // Request of GetNodesOfNetwork (`GET /node/network`) and
  // GetNodesWithoutNodeGroup (`GET /node/service`).
  message ListReq {
    // Network ID (required).
    string network_id = 1;
    // GetNodesOfNetwork only: also include nodes of all subnetworks,
    // recursively. Default false. GetNodesWithoutNodeGroup always includes
    // subnetworks.
    bool include_subnetwork = 2;
    // GetNodesWithoutNodeGroup only: service name; nodes that are in a node
    // group of this service are excluded. Ignored by GetNodesOfNetwork.
    string service = 3;
    // The filters below are GetNodesOfNetwork only, and ignored by
    // GetNodesWithoutNodeGroup.
    //
    // Nodes whose name contains this text, ignoring case; empty matches every
    // node.
    string name = 4;
    // Nodes that are members of this node group; empty matches every node.
    string node_group_id = 5;
    // Nodes whose service set (`serviceNode.services`) has any of these
    // services (repeated query parameter `?services=a&services=b`); empty
    // matches every node.
    repeated string services = 6;
    // Nodes whose `needUpdate` has this value; unset matches every node.
    optional bool need_update = 7;
  }

  // Response of GetNodesByIds.
  message List {
    // The nodes, sorted by name. With `includeLinks`, also the nodes on the far
    // end of the returned links.
    repeated Node nodes = 1;
    // Links attached to the requested nodes, sorted by link ID. Empty unless
    // `includeLinks` was set.
    repeated Link links = 2;
    // Node group config per node, for nodes in `nodes` that belong to at least
    // one node group. Order is not defined.
    repeated GroupConfig group_configs = 3;

    // A node group config attached to a node.
    message GroupConfig {
      // ID of a node in `nodes` (despite the field name, this is a node ID,
      // not a node group ID).
      string node_group_id = 1;
      // Config (YAML text) of the first node group, in ascending node group
      // ID order and across all services, that contains this node and has a
      // non-empty config; empty when none has. Per-service effective config
      // is in `serviceNode.services[].config`.
      string config = 2;
    }
  }

  // A node ID.
  message Id {
    // Node ID (required).
    string node_id = 1;
  }

  // A list of node summaries.
  message Infos {
    // Node summaries, sorted by node name. Empty when there are no nodes.
    repeated Info nodes = 1;
  }

  // Node summary used in node lists (and in `Network.nodes`).
  message Info {
    // Node ID.
    string node_id = 1;
    // Node type.
    Type type = 2;
    // Node name.
    string name = 3;
    // Runtime state of the node.
    NodeState state = 4;
    // Message recorded at the node's last registration attempt (for example
    // why a version was rejected); empty otherwise.
    string message = 5;
    // Service metadata by service name, one entry per service of the node; the
    // value is the metadata string the service stored for this node (may be
    // empty). Empty for a node in `STATE_UNREGISTERED`.
    map<string, string> meta = 6;
    // As `Node.needUpdate`.
    bool need_update = 7;
  }

  // Node as shown on the network display (DisplayNetworks).
  message Display {
    // Node ID.
    string node_id = 1;
    // Node type.
    Type type = 2;
    // Node name.
    string name = 3;
    // Location of the node; null when not set.
    Location location = 4;
    // Runtime state, `message` and the node's services. Only `state`,
    // `message` and, per service, `name`, `state`, `message` and `meta` are
    // filled.
    ServiceNode service_node = 5;
  }

  // Node type.
  enum Type {
    // Not set. Rejected by CreateNode and UpdateNode; returned for a stored
    // type the API does not know.
    TYPE_UNKNOWN = 0;
    // Router (`router` in node statistics).
    TYPE_ROUTER = 1;
    // Switch (`switch`).
    TYPE_SWITCH = 2;
    // Appliance (`appliance`).
    TYPE_APPLIANCE = 3;
    // Firewall (`firewall`).
    TYPE_FIREWALL = 4;
    // Load balancer (`lb`).
    TYPE_LOAD_BALANCER = 5;
    // Access point (`ap`).
    TYPE_ACCESS_POINT = 6;
    // Device (`device`).
    TYPE_DEVICE = 7;
    // Server (`server`).
    TYPE_SERVER = 8;
  }

  // Request of CreateNode (`POST /node`).
  message Create {
    // ID of the network to place the node in (required).
    string parent_network_id = 1;
    // Node type (required; `TYPE_UNKNOWN` is rejected with
    // `asn.node.type_not_supported`).
    Type type = 2;
    // Node name; must be unique within the parent's root network tree.
    string name = 3;
    // Free-text description.
    string description = 4;
    // Operator-set flag stored with the node.
    bool managed = 5;
    // Location (optional). Latitude must be within [-90, 90] and longitude
    // within [-180, 180], and the location tier must be valid for the nearest
    // ancestor network that has a location.
    Location location = 6;
    // Topology info (optional): `interfaces`, `ipmi`, `management` and `info`
    // are stored; `param` and the `verify` flags are ignored. The host reports
    // its own info when it registers, which replaces this.
    NodeInfo info = 7;
    // Initial service set; the install script installs these services. Every
    // name must be a service known to this controller. May be empty.
    repeated string service_names = 8;
  }

  // Request of UpdateNode (`PUT /node`). Full replacement: omitted fields are
  // cleared.
  message Update {
    // Node ID (required).
    string node_id = 1;
    // Node type (required; `TYPE_UNKNOWN` is rejected).
    Type type = 3;
    // New name; must be unique within the node's root network tree.
    string name = 4;
    // New description.
    string description = 5;
    // New value of the operator-set flag.
    bool managed = 6;
    // New location; same validation as `Node.Create.location`.
    Location location = 7;
    // New topology info: `ipmi`, `management` and `info` replace the stored
    // values; `interfaces`, `param` and the `verify` flags are ignored (use the
    // `/node/interface` endpoints for interfaces).
    NodeInfo info = 8;
    // Services are changed only through AddNodeService / RemoveNodeService.
    reserved 9, 10;
  }

  // Request of SetNodeServiceConfig (`PUT /node/config`).
  message SetConfig {
    // Node ID (required).
    string node_id = 1;
    // Name of a service already on the node (required).
    string service_name = 2;
    // Node-specific config of the service, as YAML text. Must parse as YAML;
    // empty clears the node override so the node group config applies.
    string config = 3;
  }

  // Request of the node config op endpoints (`/node/config_op`).
  message SetConfigOp {
    // Node ID (required).
    string node_id = 1;
    // Service the ops belong to (required; a service known to this
    // controller).
    string service_name = 2;
    // UpdateNodeConfigOp only: ID of the config op to change.
    string op_id = 3;
    // Required, non-empty. AddNodeConfigOps: one op parameter string per new
    // op. UpdateNodeConfigOp: the new parameter in the first element.
    // RemoveNodeConfigOps: the IDs of the ops to remove.
    repeated string op_params = 4;
  }

  // Hardware and network information of a node.
  message NodeInfo {
    // Network interfaces. Order is not defined.
    repeated Interface interfaces = 1;
    // IPMI (out-of-band management) access; null when not set.
    Ipmi ipmi = 2;
    // Management address; null when not set.
    Management management = 3;
    // Device identification; null when not set.
    Info info = 4;
    // Hardware capacity reported by the host at registration; null when the
    // node has not registered. Ignored in requests.
    Param param = 5;

    // IPMI access details.
    message Ipmi {
      // Not used: ignored in requests, always false in responses.
      bool verify = 1;
      // IPMI IP address.
      string ip = 2;
      // IPMI user name.
      string username = 3;
      // IPMI password/key. Stored and returned as entered.
      string key = 4;
    }

    // Management address of the node.
    message Management {
      // Not used: ignored in requests, always false in responses.
      bool verify = 1;
      // Management host name.
      string hostname = 2;
      // Management IP address.
      string ip = 3;
    }

    // Device identification.
    message Info {
      // Not used: ignored in requests, always false in responses.
      bool verify = 1;
      // Vendor name.
      string vendor = 2;
      // Model name.
      string model = 3;
      // Serial number.
      string serial_number = 4;
    }

    // Hardware capacity reported by the host.
    message Param {
      // Number of CPUs the host reported.
      int64 cpu = 1;
      // Total memory in bytes.
      int64 memory = 2;
      // Total size in bytes of the file system holding `asnsn`'s working
      // directory.
      int64 disk = 3;
    }

    // A network interface of a node.
    message Interface {
      // Interface name; unique per node and used as the interface key (links
      // reference it).
      string name = 1;
      // IP address of the interface.
      string ip = 2;
      // Roles of the interface. Allowed values: `data`, `control`,
      // `management`, `inbound`, `outbound`; no duplicates. Any other value is
      // rejected with `shared.request.param_invalid`.
      repeated string tags = 3;
    }

    // Request of the node interface endpoints (`/node/interface`).
    message OperateInterface {
      // Node ID (required).
      string node_id = 1;
      // UpdateNodeInterface / RemoveNodeInterface: name of the existing
      // interface. Ignored by AddNodeInterface.
      string name = 2;
      // AddNodeInterface / UpdateNodeInterface (required): the new interface,
      // including its name. Ignored by RemoveNodeInterface.
      Interface interface = 3;
    }
  }

  // Node counts of a network and all of its subnetworks (GetStatsOfNodes).
  message Stats {
    // Number of nodes in one runtime state.
    message Stat {
      // Runtime state.
      NodeState state = 1;
      // Number of nodes in that state.
      int64 count = 2;
    }

    // Number of nodes of one type.
    message Type {
      // Node type as a string: `router`, `switch`, `appliance`, `firewall`,
      // `lb`, `ap`, `device` or `server`.
      string type = 1;
      // Number of nodes of that type.
      int64 count = 2;
    }

    // One entry per runtime state, including states with count 0. Order is not
    // defined.
    repeated Stat states = 1;
    // One entry per node type, including types with count 0. Order is not
    // defined.
    repeated Type types = 2;
  }

  // Runtime (connectivity) state of a node.
  //
  // Normal path: `STATE_UNREGISTERED` until the first registration;
  // `STATE_MAINTENANCE` while a registration is being processed;
  // `STATE_OFFLINE` once registration succeeded; `STATE_ONLINE` while the node
  // keeps its connection to the controller. Losing the connection returns it
  // to `STATE_OFFLINE`.
  enum NodeState {
    // The node has never registered (created, not yet installed or not yet
    // started).
    STATE_UNREGISTERED = 0;
    // Registered but not connected right now. Set when the connection drops,
    // when the node is uninstalled, and for every online node when the
    // controller restarts. All services of an offline node read
    // `STATE_UNAVAILABLE`.
    STATE_OFFLINE = 1;
    // Connected: the controller is reaching the node on every keep-alive tick
    // (`servicenode.keep_alive`, default 5 seconds).
    STATE_ONLINE = 2;
    // A registration is in progress, or the last registration attempt was
    // rejected (for example its `asnsn` version is below the minimum or above
    // the controller's; `message` says why). `serviceNode.registerInfo` holds
    // what the host reported in that attempt.
    STATE_MAINTENANCE = 3;
  }

  // State of one service on one node.
  enum ServiceState {
    // The service is not loaded on the node (also the state of every service
    // while the node is offline or not yet registered).
    STATE_UNAVAILABLE = 0;
    // Loaded; initialization has not succeeded yet.
    STATE_UNINITIALIZED = 1;
    // Initialized and ready to start.
    STATE_INITIALIZED = 2;
    // Applying config or config ops. A service that stays here longer than
    // `servicenode.malfunction_timeout` (default 60 seconds) is moved to
    // `STATE_MALFUNCTIONING`.
    STATE_CONFIGURING = 3;
    // Started and running.
    STATE_RUNNING = 4;
    // A fatal error or a failed config op; see the service's `message`.
    STATE_MALFUNCTIONING = 5;
  }

  // Install state of a node, independent of the runtime `NodeState`.
  //
  // Derived on every read from the node's credential. Suggested UI actions:
  // `INSTALL_NOT_INSTALLED`: Install; `INSTALL_PENDING`: Install (show the
  // script again) and Uninstall; `INSTALL_INSTALLED`: Uninstall, plus Upgrade
  // when `needUpdate` is true. Install and Upgrade both call
  // GetNodeInstallScript.
  enum InstallState {
    // No host holds a credential for the node: it was never installed, was
    // uninstalled, or its candidate certificates expired unused.
    INSTALL_NOT_INSTALLED = 0;
    // The install script was fetched (a candidate certificate is still within
    // its claim window) but no host has completed registration with it yet;
    // or a certificate is bound but the node has not registered.
    INSTALL_PENDING = 1;
    // A host registered and holds the node's one bound certificate.
    INSTALL_INSTALLED = 2;
  }

  // A script token for the public script endpoint.
  //
  // Returned by DeleteNode, GetNodeInstallScript, UninstallNode,
  // AddNodeService and RemoveNodeService. The frontend shows the operator the
  // one-liner to run on the node host:
  // `curl -fsSL https://<controller>/api/v1/enrollment/script?token=<token> | sudo bash`.
  // An empty `token` (with `kind` `KIND_NONE` and `expiresAt` 0) means there
  // is nothing to run on the host.
  message Script {
    // What the script does.
    enum Kind {
      // No token was issued; nothing to run.
      KIND_NONE = 0;
      // Install or upgrade `asnsn` and all of the node's services.
      KIND_INSTALL = 1;
      // Remove service packages from the host; for UninstallNode and
      // DeleteNode also `asnsn` and the node credential. The script first
      // checks that the host is enrolled as this node and aborts without
      // changes otherwise.
      KIND_UNINSTALL = 2;
    }
    // ID of the node the token is for.
    string node_id = 1;
    // Script kind.
    Kind kind = 2;
    // Opaque token (unpadded URL-safe base64, usable in a query string as
    // is); empty when there is nothing to run. Reusable until `expiresAt`;
    // issuing a new token does not invalidate older ones. Pass it as the
    // `token` query parameter of `GET /enrollment/script`.
    string token = 3;
    // Token expiry as unix seconds; 0 when `token` is empty.
    int64 expires_at = 4;
    // ID of the node task that changes the host, when it was sent at once
    // (a node with the `task` capability); `token` is then empty.
    string task_id = 5;
    // True when the node task is queued instead; see `pendingReason`.
    bool task_pending = 6;
    // Why the task is queued: `offline` (the node is not connected),
    // `maintenance` (the node is in Maintenance; an install waits until it is
    // admitted normally), or `busy` (another task runs on the node, or the
    // controller's task limit is reached).
    string pending_reason = 7;
  }

  // Request of AddNodeService and RemoveNodeService.
  message ServiceReq {
    // Node ID (required).
    string node_id = 1;
    // Service name (required).
    string service_name = 2;
  }

  // Request of RunNodeTask.
  message TaskRun {
    // Node IDs (required, at least one).
    repeated string node_ids = 1;
    // Task name (required), for example `probe`.
    string task = 2;
  }

  // Response of RunNodeTask: one result per requested node, in request order.
  message TaskRunResult {
    repeated Item results = 1;

    message Item {
      // Node ID.
      string node_id = 1;
      // ID of the task sent; empty when `error` is set.
      string task_id = 2;
      // Why the task was not sent (the structured error message); empty when
      // it was sent.
      string error = 3;
      reserved 4;
      reserved "message";
    }
  }

  // Request of UpgradeNodes.
  message UpgradeReq {
    // Node IDs (required, at least one).
    repeated string node_ids = 1;
  }

  // Request of SetNodeAutoUpgrade.
  message AutoUpgradeReq {
    // Node IDs (required, at least one).
    repeated string node_ids = 1;
    // The switch's new value.
    bool enabled = 2;
  }

  // Response of SetNodeAutoUpgrade: one result per requested node, in request
  // order.
  message AutoUpgradeResult {
    repeated Item results = 1;

    message Item {
      // Node ID.
      string node_id = 1;
      // Why the switch was not set (the structured error message); empty when
      // it was set or already had the value.
      string error = 2;
    }
  }

  // A node task's identity while it is in flight.
  message TaskRef {
    string task_id = 1;
    // Task name.
    string name = 2;
    // When the controller sent it (Unix seconds).
    int64 sent_at = 3;
    // When the controller stops waiting for its report (Unix seconds).
    int64 deadline = 4;
  }

  // A node task's last known result.
  message TaskResult {
    string task_id = 1;
    // Task name.
    string name = 2;
    // `OK`, `FAILED`, `REFUSED`, `TIMEOUT`, or `INTERRUPTED` as the node
    // reported it; empty when `outcome` is `no_report`.
    string status = 3;
    // `reported`, or `no_report` when the task's timeout passed without a
    // report.
    string outcome = 4;
    // The task script's exit status.
    int32 exit_status = 5;
    // The task's own message is a log line (asnsn's log and the controller's
    // audit), not part of the result.
    reserved 6;
    reserved "message";
    // When the controller sent the task (Unix seconds; 0 when unknown).
    int64 sent_at = 7;
    // When the result was recorded (Unix seconds).
    int64 at = 8;
  }

  // Request of FetchNodeScript.
  message ScriptReq {
    // A token from `Node.Script.token` (required).
    string token = 1;
  }

  // Response of FetchNodeScript.
  message ScriptContent {
    // The rendered shell script (raw bytes; served as the response body of
    // `GET /enrollment/script`).
    bytes content = 1;
    // Media type of `content`: `text/x-shellscript`.
    string content_type = 2;
    // ID of the node the token belongs to.
    string node_id = 3;
  }

  // Runtime state of a node and of its services.
  message ServiceNode {
    // Runtime state of the node.
    NodeState state = 1;
    // Message recorded at the node's last registration attempt (for example
    // why a version was rejected); empty otherwise.
    string message = 2;
    // What the host reported in the last registration attempt. Filled only
    // while `state` is `STATE_MAINTENANCE`; null otherwise.
    NodeInfo register_info = 3;
    // The node's service set with per-service state and config. Present also
    // before the node registers, so the services the install script will
    // install are visible. Order is not defined.
    repeated Service services = 4;
    // `asnsn` version the node last registered with (for example `v26.17.3`);
    // empty when the node never registered.
    string version = 5;
    // Capabilities the node listed at its last registration, for example
    // `maintenance` and `task`; empty for a node that never registered or was
    // built before capabilities.
    repeated string capabilities = 6;
    // Why a node in `STATE_MAINTENANCE` was admitted into Maintenance:
    // `below_window` (older than `servicenode.minimum_version`) or
    // `above_window` (not older than `servicenode.maximum_version`). Empty for
    // every other node, including one in `STATE_MAINTENANCE` because its
    // registration is in progress or was refused.
    string maintenance_kind = 7;
    // The node task in flight on the node; null when none.
    Node.TaskRef in_flight_task = 8;
    // The node's last node task result; null when it never ran one.
    Node.TaskResult last_task = 9;
    // Service package changes queued for node tasks, oldest first. A service
    // has at most one entry not yet sent: a new change replaces it, and only
    // waits behind an entry already sent. An entry leaves the list when the
    // task carrying it ends; an `install` the node already reports at the
    // target version leaves it without being sent (no `sentTaskId`).
    repeated PendingChange pending_changes = 10;
    // The node's auto-upgrade switch (SetNodeAutoUpgrade), who set it last
    // (for example `operator:alice` or `service:<name>`), and when (Unix
    // seconds; 0 when never set).
    bool auto_upgrade = 11;
    string auto_upgrade_set_by = 12;
    int64 auto_upgrade_set_at = 13;
    // True when the last automatic upgrade for the versions this controller
    // serves now did not bring the node to them; it is not tried again until
    // those versions change or the switch is turned off and on again.
    bool auto_upgrade_held = 14;
    // The last automatic upgrade sent, with its result once its task ended;
    // null when none. It stays until the next automatic upgrade, whatever
    // other tasks run meanwhile, and is cleared when the switch is turned
    // from off to on.
    AutoUpgradeAttempt auto_upgrade_attempt = 15;
    reserved 16;
    reserved "pending_upgrade";

    // An automatic upgrade that was sent.
    message AutoUpgradeAttempt {
      // Package versions it moved the node to: `asnsn` and each service in
      // scope.
      map<string, string> target = 1;
      // The upgrade task.
      string task_id = 2;
      // When it was sent (Unix seconds).
      int64 at = 3;
      // `ok` when the node reported `OK`, `failed` for any other status or
      // no report before the task's timeout; empty while the task runs.
      string status = 4;
      // When the task ended (Unix seconds); 0 while it runs.
      int64 ended_at = 5;
    }

    // A queued service package change.
    message PendingChange {
      // Service name.
      string service = 1;
      // Service package (deb) name.
      string package = 2;
      // `install` or `uninstall`.
      string change = 3;
      // Who asked, for example `operator:alice`.
      string actor = 4;
      // When it was asked (Unix seconds).
      int64 requested_at = 5;
      // The task carrying it once sent; empty while it waits.
      string sent_task_id = 6;
    }

    // One service on the node.
    message Service {
      // Service name.
      string name = 1;
      // State of the service on this node.
      ServiceState state = 2;
      // Last error message reported for the service on this node; empty when
      // none.
      string message = 3;
      // True when `config` is the node's own config (or there is no node group
      // config to inherit); false when it is inherited from the node group.
      bool customize_config = 4;
      // Effective config of the service on this node (YAML text): the node's
      // own config, or, when that is empty, the config of the node group
      // `nodeGroupId`.
      string config = 5;
      // ID of the node group of this service that contains the node; empty
      // when none.
      string node_group_id = 6;
      // Config ops applied to this service on the node: the node's own ops
      // (`customizeConfig` true) followed by the node group's ops
      // (`customizeConfig` false).
      repeated Node.Service.ConfigOp config_ops= 7;
      // Metadata string the service stored for this node; may be empty.
      string meta = 8;
      // Service version the node reported (for example `v26.17.3`); empty
      // when not reported.
      string version = 9;
    }
  }

  // Service-related types used by the Service and User APIs.
  message Service {
    // A single service name.
    message Name {
      // Service name.
      string service_name = 1;
    }

    // A list of service names.
    message Names {
      // Service names.
      repeated string service_names = 1;
    }

    // Per-service node counts by service state (GetStatsOfServices).
    message Stats {
      // Counts keyed by service name. Without `serviceNames` in the request,
      // one entry per service loaded on the controller.
      map<string, Inner> stats = 1;

      // Counts for one service.
      message Inner {
        // One entry per service state that occurs at least once; order is not
        // defined.
        repeated Stat stats = 1;
      }

      // Request of GetStatsOfServices.
      message GetReq {
        // Network ID (required); its subnetworks are included recursively.
        string network_id = 1;
        // Services to count (repeated query parameter); empty means every
        // service loaded on the controller. An unknown name fails with
        // `shared.service.not_found`.
        repeated string service_names = 2;
      }

      // Number of nodes on which a service is in one state.
      message Stat {
        // Service state.
        ServiceState state = 1;
        // Number of nodes.
        int64 count = 2;
      }
    }

    // Metrics a service reports for a network (GetMetricsOfService).
    message Metrics {
      // Metric values by metric name, as provided by the service.
      map<string, string> metrics = 1;

      // Request of GetMetricsOfService.
      message GetReq {
        // Network ID (required).
        string network_id = 1;
        // Service name (required; a service loaded on the controller).
        string service_name = 2;
      }
    }

    // A config op of a service on a node.
    message ConfigOp {
      // Config op ID (UUID string), assigned by the server when the op is
      // added.
      string id = 1;
      // Op parameter string, passed to the service as is.
      string param = 2;
      // True for an op set on the node itself (managed with the
      // `/node/config_op` endpoints); false for an op inherited from the node
      // group (managed with `/node/group/config_op`).
      bool customize_config = 3;
    }
  }
}

// A topology link between two endpoints.
//
// Node-to-node links are created manually (`CreateLink`) or imported from a
// topology file; the controller does not discover links. In node-level lists
// (`GetLinksOfNode`, node lists) both ends are nodes. In topology views
// (`Network.Display.links`) a link may instead be an aggregate: an end with
// `fromNode`/`toNode` = `false` is a network, `linkId`, names, interfaces and
// `description` are empty, and `bandwidth` is the sum over the underlying
// node links.
message Link {
  // Link ID (UUID). Empty for aggregated network-level links.
  string link_id = 1;
  // Free-text description.
  string description = 2;
  // ID of the `from` end: a node ID when `fromNode` is `true`, otherwise a
  // network ID.
  string from_id = 3;
  // Name of the `from` node. Empty for network ends.
  string from_name = 4;
  // Whether the `from` end is a node (`true`) or a network (`false`).
  bool   from_node = 5;
  // Interface name on the `from` node; empty when not specified.
  string from_interface = 6;
  // ID of the `to` end: a node ID when `toNode` is `true`, otherwise a
  // network ID.
  string to_id = 7;
  // Name of the `to` node. Empty for network ends and aggregated links.
  string to_name = 8;
  // Whether the `to` end is a node (`true`) or a network (`false`).
  bool   to_node = 9;
  // Interface name on the `to` node; empty when not specified.
  string to_interface = 10;
  // Link bandwidth in Mbps (the unit used by the CLI); 0 means not set.
  uint64 bandwidth = 11;

  // Identifies a link.
  message Id {
    // Link ID (UUID). Required.
    string link_id = 1;
  }

  // A list of links.
  message List {
    // Links, sorted by `linkId`. May be empty.
    repeated Link links = 1;
  }

  // Request body for `CreateLink` (`POST /link`).
  message Create {
    // ID of the first node. Required; must differ from `toNodeId`.
    string from_node_id = 1;
    // Interface on the first node. Optional; when set it must exist on the
    // node.
    string from_interface = 2;
    // ID of the second node. Required; must be under the same root network as
    // `fromNodeId`.
    string to_node_id = 3;
    // Interface on the second node. Optional; when set it must exist on the
    // node.
    string to_interface = 4;
    // Link bandwidth in Mbps (the unit used by the CLI). Optional; 0 means
    // not set. The server does not range-check it.
    uint64 bandwidth = 5;
    // Free-text description. Optional.
    string description = 6;
  }

  // Request body for `UpdateLink` (`PUT /link`).
  //
  // All fields are written as given: an omitted interface, `bandwidth` or
  // `description` is stored as empty/0.
  message Update {
    // ID of the link to update. Required.
    string link_id = 1;
    // One end node. Required; together with `toNodeId` it must be the link's
    // existing node pair (either order).
    string from_node_id = 2;
    // Interface on `fromNodeId`. Optional; when set it must exist on the node.
    string from_interface = 3;
    // The other end node. Required; see `fromNodeId`.
    string to_node_id = 4;
    // Interface on `toNodeId`. Optional; when set it must exist on the node.
    string to_interface = 5;
    // Link bandwidth in Mbps; 0 means not set.
    uint64 bandwidth = 6;
    // Free-text description.
    string description = 7;
  }
}

// A node group: a named set of nodes in a network that share one service's
// config.
//
// Each group belongs to exactly one service. A node may be in at most one
// group per service. The group's `config` is used as a member node's config
// for that service when the node has no config of its own, and the group's
// config ops are pushed to all member nodes. Groups are created through
// `CreateNodeGroup` or by a service plugin for its own service.
message NodeGroup {
  // Node group ID (UUID).
  string node_group_id = 1;
  // Display name.
  string name = 2;
  // ID of the network the group belongs to.
  string network_id = 3;
  // Name of the service the group configures.
  string service_name = 4;
  // Free-text remark.
  string remark = 5;
  // Number of member nodes.
  int64 num_node = 6;
  // Service config for member nodes (YAML text); empty when not set.
  string config = 7;
  // Config ops currently applied to the group, in the order they were added.
  repeated ConfigOp configOps = 8;

  // A config op stored on a node group.
  message ConfigOp {
    // Config op ID (UUID), assigned by the server when the op is added.
    string id = 1;
    // Op parameter as given when added; its format is defined by the service.
    string param = 2;
  }

  // Identifies a node group.
  message Id {
    // Node group ID (UUID). Required.
    string node_group_id = 1;
  }

  // A list of node group IDs.
  message Ids {
    // Node group IDs. As a request (`GET /node/group`) at least one is
    // required, passed as repeated query keys:
    // `?nodeGroupIds=a&nodeGroupIds=b`. IDs that do not exist or that the
    // caller cannot view are skipped.
    repeated string node_group_ids = 1;
  }

  // Query for `ListNodeGroups` (`GET /node/group/list`).
  message ListReq {
    // Network ID. Required; groups of this network and all its subnetworks
    // are listed.
    string network_id = 1;
    // Service name. Only groups of exactly this service are returned, so an
    // empty value matches no group.
    string service = 2;
  }

  // A list of node groups.
  message List {
    // Node groups, sorted by `name`. May be empty.
    repeated NodeGroup groups = 1;
  }

  // Request body for `CreateNodeGroup` (`POST /node/group`).
  message Create {
    // Display name. Required.
    string name = 1;
    // ID of the network the group belongs to. Required; must exist.
    string network_id = 2;
    // Name of the service the group configures. Required; must be a service
    // loaded on the controller.
    string service = 3;
    // Free-text remark. Optional.
    string remark = 4;
    // Initial member node IDs. Optional. Every node must exist and must not
    // already be in another group of the same service (otherwise
    // `asn.group.service_conflict`).
    repeated string nodes = 5;
    // Service config for member nodes, as YAML text. Optional; when non-empty
    // it must parse as YAML (otherwise `shared.request.param_invalid`). The
    // updated config is pushed asynchronously to the member nodes.
    string config = 6;
  }

  // Request body for `UpdateNodeGroup` (`PUT /node/group`).
  //
  // Replaces `name`, `remark`, `nodes` and `config` as a whole; the network
  // and service of a group cannot change. Affected nodes (old and new
  // members) receive their updated service config asynchronously.
  message Update {
    // ID of the group to update. Required.
    string node_group_id = 1;
    // Display name. Required.
    string name = 2;
    // Free-text remark; empty clears it.
    string remark = 3;
    // Complete new member list; empty removes all members. Every node must
    // exist and must not be in another group of the same service.
    repeated string nodes = 4;
    // Service config as YAML text; empty clears it. Must parse as YAML.
    string config = 5;
  }

  // Request for the node group config op rpcs.
  //
  // Used by `AddNodeGroupConfigOps` (`POST /node/group/config_op`),
  // `UpdateNodeGroupConfigOp` (`PUT /node/group/config_op`) and
  // `RemoveNodeGroupConfigOps` (`DELETE /node/group/config_op`, fields as
  // query params, e.g. `?nodeGroupId=g&opParams=id1&opParams=id2`).
  message SetConfigOp {
    // Node group ID. Required.
    string node_group_id = 1;
    // ID of the config op to change. Used only by `UpdateNodeGroupConfigOp`.
    string op_id = 2;
    // Required, at least one entry. Meaning depends on the rpc:
    //
    // - `AddNodeGroupConfigOps`: op parameters; each entry becomes a new
    //   config op with a server-assigned ID.
    // - `UpdateNodeGroupConfigOp`: only the first entry is used, as the new
    //   parameter of `opId`.
    // - `RemoveNodeGroupConfigOps`: IDs of the config ops to remove.
    repeated string op_params = 3;
  }
}

// Messages for service operations sent to nodes.
message Ops {
  // Request for the start, stop and reset service rpcs.
  message GeneralReq {
    // Target ID. Required. A network ID, node group ID or node ID depending on
    // the rpc (`...OnNetwork`, `...OnNodeGroup`, `...OnNode`).
    string id = 1;
    // Name of the service to act on. Required.
    string service_name = 2;
  }

  // Request for the `ApplyServiceOps*` rpcs (gRPC only).
  message Request {
    // Target ID. Required. A network ID, node group ID or node ID depending on
    // the rpc.
    string id = 1;
    // Name of the service that handles the command. Required; must be loaded
    // on the controller.
    string service_name = 2;
    // Service-defined command name. Required.
    string command = 3;
    // Service-defined command parameters, passed to the service unchanged.
    // Optional.
    string params = 4;
  }

  // Per-node results of an operation sent to one or more nodes.
  message Responses {
    // One entry per targeted node, in the order the results arrived.
    repeated Response responses = 1;
  }

  // The result of an operation on one node.
  //
  // When both `frameworkErr` and `serviceErr` are empty the operation
  // succeeded and `serviceResponse` holds the service's output.
  message Response {
    // Time the controller recorded the result, RFC 3339 with nanoseconds
    // (e.g. `2026-10-16T08:00:00.123456789Z`).
    string timestamp = 1;
    // ID of the node this result is for.
    string node_id = 2;
    // Framework-level error, empty on success. Errors raised by the
    // controller start with the error code, e.g.
    // `shared.service.unreachable {id=<nodeId>}` when the node could not be
    // reached or `shared.service.timeout {id=<nodeId>}` when it did not reply
    // within the service's timeout.
    string framework_err = 3;
    // Service-defined response payload; empty when the service returned none.
    string service_response = 4;
    // Error message returned by the service on the node, empty on success.
    string service_err = 5;
  }
}

# Controller
#
#controller:
#  address: 127.0.0.1:12762 # Default: 127.0.0.1:12762
#  max_retry: 3 # Default: 3 times
#  retry_interval: 5 # Default: 5 seconds
#  # Bounds the wait for the controller's first stream message (the registration
#  # response). The stream itself is long-lived and carries no deadline.
#  registration_timeout: 10 # in seconds, Default: 10
#  # Bounds each unary call to the controller: UpdateServiceState, SendMessage,
#  # ReplyNotification.
#  rpc_timeout: 5 # in seconds, Default: 5

# gRPC Transport
#
#   controller -> this node's client connection to the controller
#   cli        -> this node's local CLI gRPC server (pairs with cli.grpc above)
#   slave      -> this node's client connections to the slaves listed above
#
# Sizes are in MB. Durations are in seconds. A size of 0 means "use the gRPC
# default", i.e. the option is not set at all.
#
# Every value below is what the framework runs with when the section is absent,
# so leaving this commented out changes nothing.
#
# Two constraints span processes and cannot be checked here:
# grpc.controller.max_send_msg_size must not exceed the controller's
# grpc.grpc_c.max_recv_msg_size, and grpc.controller.keepalive.time must be at
# or above its grpc.grpc_c.keepalive.min_time or the controller closes the
# connection with GOAWAY too_many_pings. Both sides log their effective values
# at startup; compare the two log lines when diagnosing a mismatch.
#
#grpc:
#  controller:
#    max_recv_msg_size: 1024        # in MB, Default: 1024 (1GB)
#    max_send_msg_size: 1024        # in MB, Default: 1024 (1GB)
#    initial_window_size: 4         # in MB, per-stream receive window. Default: 4
#    initial_conn_window_size: 16   # in MB, per-connection receive window. Default: 16
#    compressor: ""                 # "" (off) | "gzip". Default: ""
#    keepalive:
#      time: 5                      # in seconds, Default: 5
#      timeout: 5                   # in seconds, Default: 5
#      permit_without_stream: true  # Default: true
#  cli:
#    max_recv_msg_size: 1024        # in MB, Default: 1024
#    max_send_msg_size: 1024        # in MB, Default: 1024
#    initial_window_size: 0         # in MB, Default: 0 (gRPC default)
#    initial_conn_window_size: 0    # in MB, Default: 0 (gRPC default)
#    keepalive:
#      time: 5                      # in seconds, Default: 5
#      timeout: 5                   # in seconds, Default: 5
#      min_time: 1                  # in seconds, Default: 1
#      permit_without_stream: true  # Default: true
#  slave:
#    max_recv_msg_size: 1024        # in MB, Default: 1024
#    max_send_msg_size: 1024        # in MB, Default: 1024
#    initial_window_size: 4         # in MB, Default: 4
#    initial_conn_window_size: 16   # in MB, Default: 16
#    keepalive:
#      time: 5                      # in seconds, Default: 5
#      timeout: 5                   # in seconds, Default: 5
#      permit_without_stream: true  # Default: true

# Ultra-High-Bandwidth Profile
#
# NOT a default. Uncomment on a deployment that moves single messages in the
# tens of megabytes, and apply the matching block on the controller.
#
# Set the WINDOW, not the message cap: the caps above are already 1GB. Size the
# stream window at or above the largest single message; a smaller window forces
# one stall-and-refill round trip per window's worth of data. Raise both ends
# together — the window is a receive-side advertisement, so raising only the
# sender changes nothing. Leave compressor off: payloads in this size class are
# usually already incompressible.
#
#grpc:
#  controller:
#    initial_window_size: 64        # in MB, at or above the largest single message
#    initial_conn_window_size: 64
#    keepalive:
#      time: 30                     # a long single-message transfer holds the
#      timeout: 10                  # stream busy; a slower ping is enough


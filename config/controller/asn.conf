# Network Topology
#
# TOPO file is loaded when it's specified. And the networks defined in it will be imported
# if not existing.
#
# Topology-based verification is optional. So the TOPO File, topo_file, is loaded at start., if specified.
# Configurable Topo Verifications:
#  - network: verify the presence of root network
#  - parent: verify the presence of parent (network)
#  - node: verify the presence of the service node. Default setting for all node types. Can be overwritten.
#  - router|switch|appliance|server|*: overwriting "node" verification for THE SPECIFIED TYPE of nodes.
# Node Specification Verifications:
#  - node: verify the spec info of node
#  - router|switch|appliance|server|*: overwriting "node" spec verification for THE SPECIFIED TYPE of nodes.
#
#network:
#  topo_file: ./config/topo-example.yml # network topology description file path
#  # Bounds ancestry walks over the network tree so a cyclic topology cannot hang
#  # a request. A dead-loop guard, not a business limit on topology depth.
#  max_tree_depth: 100 # Default: 100
#  topo_verification: # Network Topology
#    network: false # Default: false
#    parent: false # Default: false
#    node: false # Default: false
#    node_types:
#      server: false # Default: false
#      device: false # Default: false
#      ...
#  default_root_network: "default" # Only valid when network is not verified. Default: "default"
#  spec_verification: # Network Node Specification
#    node: false # Default: false
#    node_types:
#      server: false # Default: false
#      device: false # Default: false
#      ...


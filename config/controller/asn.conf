##
# Mode
#
# This is a flag indicating the running mode of ASN Controller.
# Configurations should be set accordingly with caution.
#
mode: "dev" # Mandatory: "dev": development; "pro": production.

# API Service Ports
#
# API Service Ports should be configured properly for the deployment purpose.
# grpc_c: Controller gRPC for Service Node
# grpc_m: Internal used for RESTful API
# restful: RESTful API for ASN Portal
#
#api:
#  grpc_c: ":12762" # Default: dev ":12762", pro ":52762"
#  grpc_m: "localhost:12766" # Default: dev "localhost:12766", pro "localhost:52766"
#  restful: ":12760" # Default: dev ":12760", pro ":52760"

# gRPC Transport
#
# Subsection names mirror the endpoint keys in "api" above:
#   grpc_c -> controller gRPC server for Service Nodes (api.grpc_c)
#   grpc_m -> manager gRPC server, dialed by asncli (api.grpc_m)
#   cli    -> asncli's client connection to the manager server
#
# Sizes are in MB. Durations are in seconds. A size of 0 means "use the gRPC
# default", i.e. the option is not set at all.
#
# Every value below is what the framework runs with when the section is absent,
# so leaving this commented out changes nothing.
#
#grpc:
#  grpc_c:
#    max_recv_msg_size: 1024        # in MB, Default: 1024 (1GB)
#    max_send_msg_size: 1024        # in MB, Default: 1024 (1GB)
#    initial_window_size: 4         # in MB, per-stream receive window. Default: 4
#    initial_conn_window_size: 16   # in MB, per-connection receive window. Default: 16
#    compressor: ""                 # "" (off) | "gzip". Default: "" — payloads in this
#                                   # size class usually get slower when compressed
#    keepalive:
#      time: 5                      # in seconds, ping an idle peer. Default: 5
#      timeout: 5                   # in seconds, wait for the ping ack. Default: 5
#      max_connection_age: 0        # in seconds, 0 = infinite. Default: 0
#      max_connection_age_grace: 0  # in seconds, 0 = infinite. Default: 0
#      min_time: 1                  # in seconds, disconnect clients pinging faster. Default: 1
#      permit_without_stream: true  # Default: true
#  grpc_m:
#    max_recv_msg_size: 1024        # in MB, Default: 1024 (1GB)
#    max_send_msg_size: 1024        # in MB, Default: 1024 (1GB)
#    initial_window_size: 4         # in MB, Default: 4
#    initial_conn_window_size: 16   # in MB, Default: 16
#    keepalive:
#      time: 60                     # in seconds, Default: 60
#      timeout: 10                  # in seconds, Default: 10
#      max_connection_age: 0        # in seconds, Default: 0
#      max_connection_age_grace: 0  # in seconds, Default: 0
#      min_time: 1                  # in seconds, Default: 1
#      permit_without_stream: true  # Default: true
#  cli:
#    max_recv_msg_size: 1024        # in MB, Default: 1024. A fleet-wide ops call
#                                   # returns one service response per node in a
#                                   # single message, so this must hold what
#                                   # grpc_m is willing to send
#    max_send_msg_size: 1024        # in MB, Default: 1024
#    rpc_timeout: 30                # in seconds, per-call deadline. Default: 30

# Ultra-High-Bandwidth Profile
#
# NOT a default. Uncomment on a deployment that moves single messages in the
# tens of megabytes, and apply the matching block on every Service Node.
#
# Set the WINDOW, not the message cap: the caps above are already 1GB, so a
# ResourceExhausted on this path means the payload exceeded 1GB, not that the
# window is small. A window smaller than the largest single message forces one
# stall-and-refill round trip per window's worth of data, which is the usual
# cause of "the transfer completes but is slow".
#
# Raise both ends together — the window is a receive-side advertisement, so
# raising only the sender changes nothing. Budget the memory: the connection
# window is per connection, so a controller holding N node connections may
# buffer up to N x initial_conn_window_size. That is why it is not the default.
#
#grpc:
#  grpc_c:
#    initial_window_size: 64        # in MB, at or above the largest single message
#    initial_conn_window_size: 64

# RESTful Server
#
# Bounds for the manager REST server (api.restful above). 0 means no limit.
#
# Only the header deadline is set by default: this router also serves static
# assets and per-service web bundles, so a body-read or write deadline could
# truncate a legitimate large download, while a header deadline cannot.
#
#restful:
#  read_timeout: 0            # in seconds, Default: 0 (no limit)
#  read_header_timeout: 10    # in seconds, Default: 10
#  write_timeout: 0           # in seconds, Default: 0 (no limit)
#  idle_timeout: 0            # in seconds, Default: 0 (no limit)
#  max_header_bytes: 0        # in MB, Default: 0 (net/http default, 1MB)

# Lock
#
# Distributed-lock timings, applied to controller-held locks and to every
# per-service lock handed to a service plugin.
#
#lock:
#  waiting_time: 10 # in seconds, Default: 10
#  holding_time: 10 # in seconds, Default: 10

# Subscription
#
#subscription:
#  notify_buffer: 10000 # buffered notifications per service. Default: 10000


services:
  asnsn:
    restart: always
    image: registry.amiasys.com/asnsn:26.0.12
    ports:
      - "50052:50052"
    volumes:
      - ./cert/:/asn/cert
      - ./config/:/asn/config
      - ./service-config/:/etc/asn/servicenode/config
      - ./log/:/var/log/asn/servicenode
      - ./services:/usr/local/asn/servicenode/services

services:
  # The controller's stores: PostgreSQL 18 with TimescaleDB (the image creates
  # the timescaledb extension in POSTGRES_DB). Sapphire IAM uses it too.
  asn-pdb:
    image: timescale/timescaledb:latest-pg18
    container_name: asn-pdb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: amia
      POSTGRES_PASSWORD: ${ASNC_POSTGRES_PASSWORD:?set ASNC_POSTGRES_PASSWORD}
      POSTGRES_DB: asn
  asn-rdb:
    container_name: asn-rdb
    image: redis:8
    restart: always   # auto restart the container if it fails
    network_mode: "host"
    command: [ "redis-server", "--save", "", "--appendonly", "yes", "--requirepass", "${ASNC_REDIS_PASSWORD:?set ASNC_REDIS_PASSWORD}", "--port", "6379", "--bind", "0.0.0.0" ]
    volumes:
      - redis_data:/data
  sapphire-iam:
    image: registry.amiasys.com/sapphire.iam:27.1.1
    container_name: sapphire-iam
    privileged: true
    restart: always
    depends_on:
      - "asn-pdb"
    network_mode: host
    volumes:
      - ./iam-cert/:/etc/sapphire/cert/
      - ./iam-config/:/etc/sapphire/config/
      - ./iam-log/:/var/log/sapphire/
  asnc:
    restart: always
    image: registry.amiasys.com/asnc:26.25.6
    network_mode: host
    depends_on:
      - "asn-pdb"
      - "asn-rdb"
      - "sapphire-iam"
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - ./asn-config/:/etc/asn/controller/config
      - ./asn-cert/:/etc/asn/controller/cert
      - ./asn-log/:/var/log/asn/controller
      - ./asn-services:/usr/local/asn/controller/services
      - ./asn-web:/var/www/asn/controller

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
